    // --- Web Audio Synthesizer (Zero External Dependencies) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.ambientGain = null;
        this.ambientNodes = [];
        this.soundEnabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.12, gainLevel = 0.08) {
        if (!this.soundEnabled) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) { }
      }

      click() { this.playTone(850, 'sine', 0.04, 0.04); }
      success() {
        if (!this.soundEnabled) return;
        this.playTone(523.25, 'triangle', 0.1, 0.06); // C5
        setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.06), 80); // E5
        setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.08), 160); // G5
      }
      beep() { this.playTone(440, 'sine', 0.2, 0.05); }

      startAmbient(soundType) {
        this.stopAmbient();
        if (!this.soundEnabled) return;
        try {
          this.init();
          this.ambientGain = this.ctx.createGain();
          this.ambientGain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          this.ambientGain.connect(this.ctx.destination);

          if (soundType === 'rain' || soundType === 'whitenoise') {
            const bufferSize = this.ctx.sampleRate * 2;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              if (soundType === 'rain') {
                data[i] = (lastOut * 0.95) + (white * 0.05);
                lastOut = data[i];
              } else {
                data[i] = white * 0.2;
              }
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            noise.connect(this.ambientGain);
            noise.start();
            this.ambientNodes.push(noise);
          } else if (soundType === 'binaural') {
            const oscL = this.ctx.createOscillator();
            const oscR = this.ctx.createOscillator();
            oscL.frequency.value = 200;
            oscR.frequency.value = 210;
            oscL.connect(this.ambientGain);
            oscR.connect(this.ambientGain);
            oscL.start();
            oscR.start();
            this.ambientNodes.push(oscL, oscR);
          }
        } catch (e) {
          console.warn('Ambient sound failed:', e);
        }
      }

      stopAmbient() {
        this.ambientNodes.forEach(node => {
          try { node.stop(); } catch (e) { }
        });
        this.ambientNodes = [];
      }
    }

    const TARGET_CAREER_ALIASES = {
      'ai-ml-engineer': 'machine-learning-ai',
      'fullstack-architect': 'full-stack',
      'data-intelligence': 'data-science',
      'data intelligence specialist': 'data-science',
      'data intelligence & analytics specialist': 'data-science',
      'devops-cloud': 'cloud-devops'
    };
    const EXCLUDED_TARGET_CAREER_IDS = new Set(['data-intelligence', 'software-engineering', 'cyber-defense', 'data intelligence specialist', 'data intelligence & analytics specialist', 'software engineering fundamentals', 'cybersecurity defense analyst']);
    const resolveTargetCareerId = value => {
      const normalized = String(value || '').trim().toLowerCase();
      return TARGET_CAREER_ALIASES[normalized] || (EXCLUDED_TARGET_CAREER_IDS.has(normalized) ? '' : normalized);
    };

    const EMPTY_PROFILE = {
      id: '', name: '', email: '', phone: '', address: '', college: '', degree: '', gradYear: '', cgpa: '',
      skills: [], skillGoals: [], resume: null, interests: [], projects: [], workMode: '', salaryTarget: '', github: '', linkedin: '', bio: '', experienceLevel: '', targetCareer: ''
    };

    function canonicalSkillName(value) {
      return String(value || '').normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ');
    }
    function skillDisplayName(value) {
      const canonical = canonicalSkillName(value);
      return canonical.replace(/\b\w/g, letter => letter.toUpperCase());
    }
    function normalizeSkillRecord(skill, defaultSource = 'manual') {
      const canonical = canonicalSkillName(typeof skill === 'string' ? skill : skill?.canonical || skill?.canonicalName || skill?.name || skill?.display || skill?.skill);
      if (!canonical) return null;
      const sources = Array.isArray(skill?.sources) ? [...new Set(skill.sources.filter(source => ['resume', 'manual'].includes(source)))] : [];
      const source = ['resume', 'manual'].includes(skill?.source) ? skill.source : sources.includes('manual') ? 'manual' : defaultSource;
      const confidenceValue = Number(skill?.confidence);
      return {
        canonical,
        canonicalName: String(skill?.canonicalName || skill?.display || skillDisplayName(canonical)),
        name: String(skill?.name || skill?.display || skillDisplayName(canonical)),
        display: String(skill?.display || skill?.name || skillDisplayName(canonical)),
        level: ['beginner', 'familiar', 'intermediate', 'advanced'].includes(String(skill?.level || '').toLowerCase()) ? String(skill.level).toLowerCase() : 'familiar',
        source,
        sources: sources.length ? sources : [source],
        confidence: Number.isFinite(confidenceValue) && confidenceValue >= 0 && confidenceValue <= 1 ? confidenceValue : null,
        confirmed: typeof skill === 'object' && skill?.confirmed === false ? false : true,
        ...(skill?.evidence ? { evidence: String(skill.evidence).slice(0, 500) } : {}),
        ...(Array.isArray(skill?.evidenceItems) ? { evidenceItems: skill.evidenceItems } : {})
      };
    }
    function profileSkillRecords(profile) {
      return (Array.isArray(profile?.skills) ? profile.skills : []).map(skill => normalizeSkillRecord(skill)).filter(Boolean);

          return { ...EMPTY_PROFILE, id: `vortex-user-${(window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`)}` };

      // Save profile
      useEffect(() => {
        localStorage.setItem('vortex_candidate_profile', JSON.stringify(profile));
      }, [profile]);

      // Server profile wins over the browser cache whenever it is available.
      useEffect(() => {
        let active = true;
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 4000);
        (async () => {
          try {
            const health = await fetch('/api/health', { signal: controller.signal });
            if (!health.ok) throw new Error('Profile service unavailable.');
            const healthResult = await health.json();
            if (active) setBackendStatus(healthResult.status === 'ONLINE' ? 'NODE_API_CONNECTED' : 'BACKEND_UNAVAILABLE');
            if (profile.id) {
              const response = await fetch(`/api/user/profile/${encodeURIComponent(profile.id)}`, { signal: controller.signal });
              if (response.ok) {
                const serverProfile = await response.json();
                if (active && serverProfile && typeof serverProfile === 'object') {
                  const restored = { ...EMPTY_PROFILE, ...serverProfile };
                  const skills = new Map();
                  for (const rawSkill of Array.isArray(restored.skills) ? restored.skills : []) {
                    const skill = normalizeSkillRecord(rawSkill);
                    if (skill?.confirmed) skills.set(skill.canonical, { ...(skills.get(skill.canonical) || {}), ...skill });
                  }
                  setProfile({ ...restored, skills: [...skills.values()], skillGoals: Array.isArray(restored.skillGoals) ? restored.skillGoals : [] });
                }
              } else if (response.status !== 404) {
                throw new Error('Saved profile could not be loaded.');
              }
            }
          } catch (error) {
            if (active) {
              setBackendStatus('BACKEND_UNAVAILABLE');
              console.warn('Using the locally saved profile because the server profile could not be loaded.');
            }
          } finally {
            window.clearTimeout(timeout);
            if (active) setProfileHydrated(true);
          }
        })();
        return () => { active = false; window.clearTimeout(timeout); controller.abort(); };

    // =========================================================================
    // PERSONAL DASHBOARD: current goal, next action, and grounded progress

    function DashboardTab({ profile, setActiveTab, openCareerAnalysis, openSkillGap, openLearningPlan, openJobMatch, openSkillGoals }) {
      const [careers, setCareers] = useState([]);
      useEffect(() => {
        const controller = new AbortController();
        fetch('/api/roadmap/catalogue', { signal: controller.signal })
          .then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data?.error || 'Catalogue is unavailable.'); return data; })
          .then(data => { if (!controller.signal.aborted && Array.isArray(data.tracks)) setCareers(data.tracks.filter(career => career.id !== 'software-engineering')); })
          .catch(error => { if (error.name !== 'AbortError') console.error('Roadmap catalogue could not be loaded for the dashboard:', error); });
        return () => controller.abort();
      }, []);
      const skills = profileSkillRecords(profile).filter(skill => skill.confirmed);
      const [assessment, setAssessment] = useState(null);
      const [careerRecommendations, setCareerRecommendations] = useState([]);
      const [assessmentState, setAssessmentState] = useState('idle');
      const [assessmentError, setAssessmentError] = useState('');
      const selectedCareer = careers.find(career => career.id === resolveTargetCareerId(profile.targetCareer || profile.targetRole));
      const selectableCareerRecommendations = careerRecommendations.flatMap(recommendation => {
        const id = resolveTargetCareerId(recommendation?.id);
        const track = careers.find(career => career.id === id);
        return track ? [{ ...recommendation, id: track.id, title: track.name }] : [];
      });

      useEffect(() => {
        const hasProjects = Array.isArray(profile.projects) ? profile.projects.length > 0 : Boolean(profile.projects);
        const hasEducation = Boolean(profile.degree || profile.college || profile.cgpa);
        if (!skills.length && !hasProjects && !hasEducation) { setAssessment(null); setCareerRecommendations([]); setAssessmentState('idle'); return; }
        const controller = new AbortController();
        setAssessmentState('loading');
        setAssessmentError('');
        const requestProfile = { ...profile, skills, ...(selectedCareer ? { targetCareer: selectedCareer.id } : {}) };
        fetch('/api/ai/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile: requestProfile }), signal: controller.signal })
          .then(async response => {
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.error || 'Analysis is unavailable.');
            if (!Array.isArray(result.topRecommendations)) throw new Error('The analysis response is incomplete.');
            if (selectedCareer && (!result.skillGapAnalysis || !Array.isArray(result.skillGapAnalysis.skillDetails))) throw new Error('The goal analysis response is incomplete.');
            return result;
          })
          .then(result => { if (!controller.signal.aborted) { setAssessment(result); setCareerRecommendations(result.topRecommendations); setAssessmentState('ready'); } })
          .catch(error => { if (!controller.signal.aborted) { setAssessment(null); setCareerRecommendations([]); setAssessmentError('Your saved profile is available, but career analysis is temporarily unavailable.'); setAssessmentState('error'); } });
        return () => controller.abort();
      }, [careers, profile.skills, profile.targetCareer, profile.targetRole, profile.projects, profile.degree, profile.college, profile.cgpa]);

      const gap = selectedCareer ? assessment?.skillGapAnalysis : null;
      const roadmap = selectedCareer ? assessment?.learningRoadmap : null;
      const details = Array.isArray(gap?.skillDetails) ? gap.skillDetails : [];
      const nextSkill = roadmap?.priorityRanking?.[0];
      const completedCount = details.filter(item => item.status === 'mastered').length;
      const developingCount = details.filter(item => item.status === 'developing').length;
      const missingCount = details.filter(item => ['missing', 'critical_missing'].includes(item.status)).length;
      const firstName = String(profile.name || '').trim().split(/\s+/)[0];
      const latestJob = profile.latestJobMatch;

      return (
        <div className="mx-auto max-w-6xl space-y-6">
          <header className="space-y-1"><p className="text-xs font-medium uppercase tracking-wide text-cyan-300">Your learning home</p><h1 className="text-2xl font-semibold text-white sm:text-3xl">{firstName ? `Good to see you, ${firstName}` : 'Welcome to Tech Vortex'}</h1><p className="text-sm text-slate-400">Choose a goal, understand your skill gaps, and decide what to work on next.</p></header>

          {!skills.length && <section className="grid gap-4 rounded-2xl border border-slate-800 bg-slate-900/60 p-5 sm:grid-cols-2 sm:p-6"><div className="sm:col-span-2"><h2 className="text-lg font-semibold text-white">Let’s understand where you are and where you want to go.</h2><p className="mt-1 text-sm text-slate-400">A resume is optional. You can build your skill profile manually and use learning features right away.</p></div><button type="button" onClick={() => openSkillGap()} className="rounded-xl border border-slate-700 bg-slate-950/50 p-4 text-left hover:border-cyan-500/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-cyan-400"><strong className="text-sm text-white">I have a resume</strong><span className="mt-1 block text-xs text-slate-400">Upload it once and review the extracted skills.</span></button><button type="button" onClick={openSkillGoals} className="rounded-xl border border-slate-700 bg-slate-950/50 p-4 text-left hover:border-cyan-500/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-cyan-400"><strong className="text-sm text-white">I don’t have a resume</strong><span className="mt-1 block text-xs text-slate-400">Choose skills you want to learn and set your level.</span></button></section>}

          {!selectedCareer ? <section className="rounded-2xl border border-slate-800 bg-slate-900/60 p-5 sm:p-6"><div><p className="text-xs font-medium uppercase tracking-wide text-cyan-300">What are you working toward?</p><h2 className="mt-1 text-lg font-semibold text-white">Choose a career goal</h2><p className="mt-1 text-sm text-slate-400">Your career recommendations use confirmed profile skills and the existing role requirements.</p></div>{assessmentState === 'loading' && skills.length > 0 && <p role="status" className="mt-4 text-sm text-slate-400">Finding career paths from your profile…</p>}{assessmentError && <p role="alert" className="mt-4 text-sm text-amber-200">{assessmentError}</p>}{selectableCareerRecommendations.length > 0 ? <div className="mt-4 grid gap-3 lg:grid-cols-3">{selectableCareerRecommendations.slice(0, 3).map(career => { const score = career.scoreBreakdown?.overall ?? career.matchScore; return <article key={career.id} className="rounded-xl border border-slate-800 bg-slate-950/40 p-4"><div className="flex items-start justify-between gap-3"><h3 className="text-sm font-semibold text-white">{career.title}</h3><span className="shrink-0 text-sm font-medium text-cyan-200">{Number.isFinite(Number(score)) ? `${Math.round(Number(score))}%` : '—'}</span></div><p className="mt-1 text-[10px] uppercase tracking-wide text-slate-500">Profile match score · not a probability</p><p className="mt-3 text-xs leading-relaxed text-slate-400">{career.whyMatched?.[0] || 'Compared with the local role requirements.'}</p><button type="button" onClick={() => openSkillGap(career.id)} className="mt-4 rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200 hover:border-cyan-500/40">Set as goal</button></article>; })}</div> : !skills.length ? <div className="mt-4 rounded-lg border border-slate-800 p-4"><p className="text-sm text-slate-300">You can choose a career target after adding skills, or start with a learning goal now.</p><div className="mt-3 flex flex-wrap gap-2"><button type="button" onClick={openSkillGoals} className="rounded-lg bg-cyan-500 px-3 py-2 text-xs font-medium text-slate-950">Choose learning goals</button><button type="button" onClick={() => openSkillGap()} className="rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200">Build skills</button></div></div> : null}</section> : (
            <section className="grid gap-4 lg:grid-cols-5">
              <article className="rounded-2xl border border-slate-800 bg-slate-900/60 p-5 lg:col-span-3"><div className="flex flex-wrap items-start justify-between gap-3"><div><p className="text-xs font-medium uppercase tracking-wide text-cyan-300">Current goal</p><h2 className="mt-1 text-xl font-semibold text-white">{selectedCareer.name}</h2></div><button type="button" onClick={() => openSkillGap(selectedCareer.id)} className="text-xs text-cyan-300 underline underline-offset-4">Change goal</button></div>{assessmentState === 'loading' ? <p role="status" className="mt-5 text-sm text-slate-400">Checking confirmed skills against this role…</p> : gap ? <><div className="mt-5 flex items-end gap-2"><span className="text-4xl font-semibold text-white">{Math.round(gap.readinessScore)}%</span><span className="pb-1 text-sm text-slate-400">skill coverage</span></div><p className="mt-1 text-xs text-slate-500">Calculated from your confirmed skills and this role’s requirements. This is not a hiring probability.</p><div className="mt-4 h-2 overflow-hidden rounded-full bg-slate-800" role="progressbar" aria-label="Role skill coverage" aria-valuemin="0" aria-valuemax="100" aria-valuenow={Math.round(gap.readinessScore)}><div className="h-full rounded-full bg-cyan-400" style={{ width: `${Math.max(0, Math.min(100, Number(gap.readinessScore) || 0))}%` }} /></div><p className="mt-3 text-xs text-slate-400">{completedCount} core/role skills mastered · {developingCount} developing · {missingCount} not found</p><button type="button" onClick={() => openSkillGap(selectedCareer.id)} className="mt-4 rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200 hover:border-slate-500">View Skill Intelligence</button></> : <p role={assessmentState === 'error' ? 'alert' : undefined} className="mt-5 text-sm text-slate-400">{assessmentError || 'Add or confirm skills to see role-specific coverage.'}</p>}</article>
              <article className="rounded-2xl border border-cyan-900/60 bg-slate-900/60 p-5 lg:col-span-2"><p className="text-xs font-medium uppercase tracking-wide text-cyan-300">Your next step</p>{nextSkill ? <><h2 className="mt-2 text-lg font-semibold text-white">{nextSkill.skill}</h2><p className="mt-2 text-sm text-slate-400">{nextSkill.reason}</p><button type="button" onClick={() => openLearningPlan(selectedCareer.id)} className="mt-4 rounded-lg bg-cyan-500 px-4 py-2 text-sm font-medium text-slate-950 hover:bg-cyan-400">Open roadmap</button></> : assessmentState === 'loading' ? <p role="status" className="mt-3 text-sm text-slate-400">Finding the next useful step…</p> : <><p className="mt-2 text-sm text-slate-400">Your next learning action will appear when role analysis is available.</p><button type="button" onClick={() => openSkillGap(selectedCareer.id)} className="mt-4 rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200">Review skills</button></>}</article>
            </section>
          )}

          <section className="grid gap-4 sm:grid-cols-2">
            <article className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5"><div className="flex items-center justify-between"><h2 className="text-sm font-semibold text-white">Your skills</h2><button type="button" onClick={() => openSkillGap()} className="text-xs text-cyan-300">View all</button></div><p className="mt-2 text-2xl font-semibold text-white">{skills.length}</p><p className="text-xs text-slate-400">confirmed skills in your shared profile</p><div className="mt-3 flex flex-wrap gap-1.5">{skills.slice(0, 8).map(skill => <span key={skill.canonical} className="rounded-md border border-slate-700 px-2 py-1 text-[11px] text-slate-300">{skill.display}</span>)}</div></article>
            <article className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5"><div className="flex items-center justify-between"><h2 className="text-sm font-semibold text-white">Your roadmap</h2><button type="button" onClick={() => openLearningPlan(selectedCareer?.id || '')} className="text-xs text-cyan-300">Open roadmap</button></div><p className="mt-2 text-sm text-slate-300">{roadmap?.phases?.length ? `${roadmap.phases.length} learning phases for ${selectedCareer?.title || 'your selected role'}` : 'Choose a skill goal or career target to build a learning path.'}</p><p className="mt-2 text-xs text-slate-500">Progress appears after learning verification is recorded.</p></article>
          </section>

          <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5"><div className="flex flex-wrap items-center justify-between gap-3"><div><h2 className="text-sm font-semibold text-white">Job match</h2>{latestJob?.summary ? <p className="mt-1 text-sm text-slate-400">Latest analysis · {latestJob.summary.title || 'Pasted job description'} · {latestJob.summary.coverageScore == null ? 'No recognized requirements' : `${latestJob.summary.coverageScore}% weighted requirement coverage`}</p> : <p className="mt-1 text-sm text-slate-400">Have a job description? Compare its listed skills with your profile.</p>}</div><button type="button" onClick={openJobMatch} className="rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200">{latestJob?.summary ? 'View analysis' : 'Analyze a job'}</button></div></section>
        </div>
      );

    // =========================================================================
    // Career analysis panel: retained existing explainable recommendation flow
    // =========================================================================
    function CareerAnalysisPanel({ profile, gainXp, sound, setActiveTab, openCareerAnalysis, openSkillGap, openLearningPlan }) {
      const [isAnalyzing, setIsAnalyzing] = useState(true);
      const [currentStageIndex, setCurrentStageIndex] = useState(0);
      const [logs, setLogs] = useState([]);
      const [selectedCareer, setSelectedCareer] = useState(0);
      const [evaluatedCareers, setEvaluatedCareers] = useState([]);
      const [analysisError, setAnalysisError] = useState('');
      const analyzeProfile = async (signal) => {
        setIsAnalyzing(true);
        setAnalysisError('');
        setLogs([]);
        const skills = Array.isArray(profile.skills) ? profile.skills : [];
        const hasProjects = Array.isArray(profile.projects) ? profile.projects.length > 0 : Boolean(profile.projects);
        const hasEducation = Boolean(profile.degree || profile.education || profile.college || profile.cgpa);
        const hasCandidateData = skills.length > 0 || hasProjects || hasEducation || (Array.isArray(profile.interests) && profile.interests.length > 0);
        if (!hasCandidateData) {
          setEvaluatedCareers([]);
          setSelectedCareer(0);
          setIsAnalyzing(false);
          setAnalysisError('Add skills, project details, interests, or education to generate career recommendations.');
          return false;
        }

        try {
          const response = await fetch('/api/ai/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profile }),
            signal
          });
          let result;
          try { result = await response.json(); } catch (error) { throw new Error('The career service returned an unreadable response.'); }
          if (!response.ok) throw new Error(result?.error || `Career analysis failed (${response.status}).`);
          if (!result || !Array.isArray(result.topRecommendations)) throw new Error('The career service response is missing recommendations.');

          const requiredBreakdown = ['semanticSimilarity', 'coreSkillCoverage', 'projectRelevance', 'educationFit', 'interestAlignment', 'overall'];
          const normalized = result.topRecommendations.filter(item => {
            if (EXCLUDED_TARGET_CAREER_IDS.has(String(item?.id || '').toLowerCase())) return false;
            const breakdown = item?.scoreBreakdown;
            const overall = Number(item?.matchScore ?? breakdown?.overall);
            return item && typeof item.id === 'string' && typeof item.title === 'string' && breakdown &&
              requiredBreakdown.every(key => Number.isFinite(Number(breakdown[key]))) && Number.isFinite(overall) && overall >= 0 && overall <= 100;
          }).map(item => {
            const template = CAREERS_MASTER_DATA.find(c => c.id === item.id) || {};
            const phases = Array.isArray(item.learningRoadmap?.phases) ? item.learningRoadmap.phases : [];
            return {
              ...template,
              ...item,
              matchScore: Math.round(Number(item.scoreBreakdown.overall)),
              matchingSkills: Array.isArray(item.matchingSkills) ? item.matchingSkills : [],
              missingSkills: Array.isArray(item.missingSkills) ? item.missingSkills : [],
              whyMatched: Array.isArray(item.whyMatched) ? item.whyMatched : [],
              strengths: Array.isArray(item.strengths) ? item.strengths : [],
              missingCriticalSkills: Array.isArray(item.missingCriticalSkills) ? item.missingCriticalSkills : [],
              recommendedNextSkills: Array.isArray(item.recommendedNextSkills) ? item.recommendedNextSkills : [],
              matchingJobs: Array.isArray(template.matchingJobs) ? template.matchingJobs : [],
              roadmap: phases.map((phase, index) => ({
                phase: phase.title || `Phase ${index + 1}`,
                task: phase.projectMilestone?.objective || (Array.isArray(phase.focusSkills) ? phase.focusSkills.join(', ') : '')
              }))
            };
          });
          if (!normalized.length) throw new Error('The career service returned no valid recommendation records.');
          setEvaluatedCareers(normalized);
          setSelectedCareer(0);
          setCurrentStageIndex(5);
          const stageSummaries = [
            'Candidate profile loaded',
            'Skills, projects, education, and interests assessed',
            'Profile compared with role requirements',
            'Explainable recommendations ranked',
            'Skill gaps and learning plan prepared'
          ];
          setLogs(stageSummaries.map((summary, index) => `[STAGE ${index + 1}] ${summary}`));
          return true;
        } catch (error) {
          if (error.name !== 'AbortError') {
            console.error('Career analysis request failed:', error);
            setEvaluatedCareers([]);
            setSelectedCareer(0);
            setAnalysisError(error instanceof TypeError || /failed to fetch|networkerror/i.test(String(error?.message || '')) ? 'network' : 'service');
          }
          return false;
        } finally {
          if (!signal?.aborted) setIsAnalyzing(false);
        }
      };

      useEffect(() => {
        const controller = new AbortController();
        analyzeProfile(controller.signal);
        return () => controller.abort();
      }, [profile]);

      const career = evaluatedCareers[selectedCareer] || null;

      const pipelineStages = [
        { num: 1, title: "Student Data Ingestion", subtitle: "Profile details supplied for analysis", icon: "👤", details: `${profile.name} • ${profile.degree || 'Education not provided'}` },
        { num: 2, title: "Profile Feature Analysis", subtitle: "Skills, projects, education & interests", icon: "🧠", details: `${Array.isArray(profile.skills) ? profile.skills.length : 0} candidate skills supplied` },
        { num: 3, title: "Role Ontology Comparison", subtitle: "Local career requirement profiles", icon: "⚖️", details: `${evaluatedCareers.length} recommendations returned` },
          { num: 4, title: "Explainable Career Ranking", subtitle: "Weighted profile match score and breakdown", icon: "🎯", details: career ? `${career.matchScore}% overall match` : 'Awaiting analysis' },
        { num: 5, title: "Skill Gaps & Learning Plan", subtitle: "Role-specific skills and roadmap", icon: "💼", details: career ? `${career.missingCriticalSkills.length} critical gaps` : 'Awaiting analysis' },
      ];

      const careerGap = career?.skillGapAnalysis;
      const careerRoadmap = career?.learningRoadmap;
      const profileComplete = Boolean(String(profile.name || '').trim() && String(profile.degree || '').trim() && profileSkills.length > 0);

      const rawExplicitTarget = profile.targetCareer || profile.targetRole || '';
      const explicitTarget = resolveTargetCareerId(rawExplicitTarget);
      const removedExplicitTarget = Boolean(rawExplicitTarget && !explicitTarget);
      const targetMatch = evaluatedCareers.find(item => item.id === explicitTarget || item.title.toLowerCase() === String(explicitTarget).toLowerCase());

        ? careerRoadmap.priorityRanking.filter(item => ['critical_missing', 'missing'].includes(item.currentStatus) && item.skill)

        ? (priorityGapItems.length ? priorityGapItems.map(item => item.skill) : [...new Set([...(careerGap.criticalMissingSkills || []), ...(careerGap.missingSkills || [])])])

              )}

          <section className="p-4 sm:p-5 rounded-2xl bg-vortex-card border border-vortex-border" aria-label="Career intelligence pipeline">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4"><div><h2 className="text-xs font-mono font-bold tracking-wider text-white">YOUR CAREER INTELLIGENCE PIPELINE</h2><p className="mt-1 text-[11px] text-slate-400">Each stage reflects the profile and analysis currently available.</p></div>{isAnalyzing && <span className="text-[10px] font-mono text-cyan-300">Analysis in progress…</span>}</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-2">
              {stages.map((stage, index) => {

                const stateColor = stage.status === 'complete' ? 'text-emerald-300' : stage.status === 'active' ? 'text-cyan-300' : stage.status === 'action' ? 'text-amber-300' : 'text-slate-500';

                    ? item.learningRoadmap.priorityRanking.filter(skill => ['critical_missing', 'missing'].includes(skill.currentStatus)).map(skill => skill.skill).filter(Boolean)
                    : item.skillGapAnalysis ? [...new Set([...(item.skillGapAnalysis.criticalMissingSkills || []), ...(item.skillGapAnalysis.missingSkills || [])])] : item.missingSkills;
                  return <article key={item.id} className={`p-4 rounded-2xl border bg-vortex-card min-w-0 ${selectedCareer === index ? 'border-cyan-400/70 shadow-lg shadow-cyan-500/5' : 'border-vortex-border'}`}>
