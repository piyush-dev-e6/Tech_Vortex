            <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-2"><div><h2 id="career-journey-title" className="text-base font-display font-bold text-white">Career Journey</h2><p className="mt-1 text-[11px] text-slate-400">Progress reflects information in your profile and recorded practice; it does not imply job readiness.</p></div><span className="text-[9px] font-mono uppercase text-cyan-300">Current focus: {currentJourneyIndex < journeyStages.length ? journeyStages[currentJourneyIndex].label : 'Opportunity exploration'}</span></div>
            <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-2">
              {[...journeyStages, { label: 'Opportunity exploration', complete: false, detail: 'Sample listings only; applications are not tracked' }].map((stage, index) => {
                const isCurrent = index === currentJourneyIndex;
                const isRecorded = stage.complete;
                return <div key={stage.label} className={`relative p-3 rounded-xl border ${isCurrent ? 'border-cyan-400/60 bg-cyan-500/10' : isRecorded ? 'border-emerald-500/25 bg-emerald-500/5' : 'border-vortex-border bg-vortex-surface/50'}`}>
                  <p className={`text-[9px] font-mono uppercase tracking-wider ${isCurrent ? 'text-cyan-300' : isRecorded ? 'text-emerald-300' : 'text-slate-500'}`}>{isRecorded ? '✓ RECORDED' : isCurrent ? '● CURRENT FOCUS' : index === 4 ? 'NOT TRACKED' : 'NEXT'}</p>
                  <h3 className="mt-1 text-xs font-bold text-white">{stage.label}</h3><p className="mt-1 text-[10px] text-slate-400">{stage.detail}</p>
                  {index < 5 && <span className="hidden xl:block absolute -right-2 top-1/2 z-10 text-cyan-500" aria-hidden="true">→</span>}
                </div>;
              })}
            </div>
          </section>

          <section className="grid grid-cols-1 gap-4">
            <article className="p-5 rounded-2xl bg-vortex-card border border-vortex-border min-w-0">
              <p className="text-[10px] font-mono uppercase tracking-wider text-cyan-300">PROFESSIONAL PRESENCE</p><h2 className="mt-1 text-base font-bold text-white">LinkedIn &amp; profile</h2>
              <p className="mt-3 text-xs text-slate-300">LinkedIn URL <strong className={profile.linkedin ? 'text-emerald-300' : 'text-amber-300'}>{profile.linkedin ? 'saved in your profile' : 'not added'}</strong></p>
              <div className="mt-3 grid grid-cols-2 gap-3 text-[11px]"><div><span className="text-slate-500">Profile-listed skills</span><strong className="block mt-1 text-white">{profileSkills.length || 'None yet'}</strong></div><div><span className="text-slate-500">Project evidence</span><strong className="block mt-1 text-white">{hasProjects ? projectCount : 'Not added'}</strong></div></div>
              <p className="mt-3 text-[10px] text-slate-500">No LinkedIn optimization score is tracked on the dashboard.</p>
              <button type="button" onClick={() => setActiveTab('linkedin')} className="mt-4 px-4 py-2 rounded-lg border border-cyan-500/30 text-xs font-semibold text-cyan-200 hover:bg-cyan-500/10">Optimize LinkedIn</button>
            </article>
          </section>

          <section className="p-4 sm:p-5 rounded-2xl bg-vortex-card border border-vortex-border" aria-labelledby="quick-actions-title">
            <h2 id="quick-actions-title" className="text-[10px] font-mono font-bold tracking-wider text-slate-300">QUICK ACTIONS</h2>
            <div className="mt-3 flex flex-wrap gap-2">
              <button type="button" onClick={() => setActiveTab('profile')} className="px-3 py-2 rounded-lg border border-vortex-border text-[11px] text-slate-200 hover:border-cyan-500/40">Complete Profile</button>
              <button type="button" onClick={runPipeline} disabled={isAnalyzing} className="px-3 py-2 rounded-lg border border-vortex-border text-[11px] text-slate-200 hover:border-cyan-500/40 disabled:opacity-50">Analyze Career</button>
              <button type="button" onClick={() => openSkillGap(career?.id || profile.targetCareer)} className="px-3 py-2 rounded-lg border border-vortex-border text-[11px] text-slate-200 hover:border-cyan-500/40">Detect Skill Gap</button>
              <button type="button" onClick={() => openLearningPlan(career?.id || profile.targetCareer)} className="px-3 py-2 rounded-lg border border-vortex-border text-[11px] text-slate-200 hover:border-cyan-500/40">Build Learning Plan</button>
                            <button type="button" onClick={() => setActiveTab('linkedin')} className="px-3 py-2 rounded-lg border border-vortex-border text-[11px] text-slate-200 hover:border-cyan-500/40">Optimize LinkedIn</button>
            </div>
          </section>

          {career && (
            <details id="career-detail" className="group rounded-2xl bg-vortex-card border border-vortex-border">
              <summary className="cursor-pointer list-none p-4 sm:p-5 flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 rounded-2xl">
                <span><span className="block text-sm font-bold text-white">Career details &amp; example opportunities</span><span className="block mt-1 text-[11px] text-slate-400">View the score components and bundled demo listings for {career.title}.</span></span>
                <span className="text-cyan-300 transition-transform group-open:rotate-180" aria-hidden="true">⌄</span>
              </summary>
              <div className="px-4 pb-5 sm:px-5 space-y-4">
                <div>
                  <h3 className="text-[10px] font-mono uppercase tracking-wider text-slate-300">Match score components</h3>
                  <div className="mt-2 grid grid-cols-2 sm:grid-cols-5 gap-2">{[['Profile text similarity', 'semanticSimilarity'], ['Core skill coverage', 'coreSkillCoverage'], ['Project relevance', 'projectRelevance'], ['Education fit', 'educationFit'], ['Interest alignment', 'interestAlignment']].map(([label, key]) => <div key={key} className="p-3 rounded-xl bg-vortex-surface/70 border border-vortex-border"><span className="block text-[9px] text-slate-400">{label}</span><strong className="block mt-1 text-sm text-cyan-200">{Math.round(Number(career.scoreBreakdown[key]))}%</strong></div>)}</div>
                  <p className="mt-2 text-[10px] text-slate-500">Weighted profile match score, not a hiring probability. Project relevance reflects only project information supplied in your profile.</p>
                </div>
                <div>
                  <div className="flex flex-wrap items-center justify-between gap-2"><h3 className="text-[10px] font-mono uppercase tracking-wider text-slate-300">Example Opportunities ({career.matchingJobs.length})</h3><span className="text-[9px] font-mono text-amber-300">Demo dataset</span></div>
                  <p className="mt-1 text-[10px] text-slate-500">Bundled local examples; no jobs API is queried and listing availability is not verified.</p>
                  {career.matchingJobs.length ? <div className="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">{career.matchingJobs.map((job, index) => <div key={`${job.company}-${index}`} className="p-3 rounded-xl bg-vortex-surface/70 border border-vortex-border"><p className="text-[10px] text-cyan-300">{job.company} · Example</p><h4 className="mt-1 text-xs font-bold text-white">{job.title}</h4><p className="mt-1 text-[10px] text-slate-400">{job.loc} · {job.type} · {job.pkg}</p><button type="button" onClick={() => { gainXp(10, `Viewed example opportunity at ${job.company}`); alert(`Example opportunity only — no application was submitted.\n\nRole: ${job.title} at ${job.company}\nLocation: ${job.loc}\nDisplayed compensation: ${job.pkg}`); }} className="mt-2 text-[10px] font-semibold text-cyan-300 hover:text-white">View Example</button></div>)}</div> : <p className="mt-2 text-xs text-slate-400">No example listings are configured for this career.</p>}
                </div>
              </div>
            </details>
          )}
          </>}
        </div>
      );
    }

    // =========================================================================
    // 2. PROFILE TAB: Shared personal details, education, and resume/skills summary
    // =========================================================================
    function ProfileTab({ profile, setProfile, gainXp, sound, setActiveTab }) {
      const [saveStatus, setSaveStatus] = useState('');
      const [isSaving, setIsSaving] = useState(false);
      const [showResumeText, setShowResumeText] = useState(false);
      const skills = profileSkillRecords(profile).filter(skill => skill.confirmed);
      const fields = [profile.name, profile.email, profile.phone, profile.degree, profile.college, profile.gradYear, profile.cgpa, profile.resume?.status === 'parsed' ? profile.resume.fileName : '', skills.length ? 'skills' : ''];
      const completion = Math.round(fields.filter(value => String(value || '').trim()).length / fields.length * 100);
      const updateField = event => setProfile(previous => ({ ...previous, [event.target.name]: event.target.value }));

      const handleSave = async event => {
        event.preventDefault();
        sound.click();
        setIsSaving(true);
        setSaveStatus('');
        try {
          const saved = await saveStudentProfile({ ...profile, skills });
          setProfile({ ...EMPTY_PROFILE, ...saved });
          setSaveStatus('Profile saved. Your confirmed skills and resume metadata are synced.');
          gainXp(20, 'Saved Profile Details');
        } catch (error) {
          console.error('Could not sync the profile to the backend:', error);
          setSaveStatus(/failed to fetch|networkerror/i.test(String(error.message)) ? 'Your edits are saved in this browser. Backend sync is temporarily unavailable.' : (error.message || 'Your profile could not be saved. Review the entered details and try again.'));
        } finally {
          setIsSaving(false);
          window.setTimeout(() => setSaveStatus(''), 5000);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-5 animate-fadeIn">
          <header className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 pb-4 border-b border-vortex-border">
            <div><p className="text-xs font-mono tracking-wider text-cyan-300">MY PROFILE</p><h1 className="mt-1 text-2xl sm:text-3xl font-display font-bold text-white">Your information</h1><p className="mt-1 text-sm text-slate-400">Manage your personal information, education, resume and skills.</p></div>
            <div className="w-full sm:w-52"><div className="flex justify-between text-xs mb-2"><span className="text-slate-400">Profile completeness</span><strong className="text-cyan-200">{completion}%</strong></div><div className="h-1.5 rounded-full bg-slate-800 overflow-hidden"><div className="h-full bg-cyan-400 rounded-full transition-all" style={{ width: `${completion}%` }} /></div></div>
          </header>

          <form onSubmit={handleSave} className="space-y-4">
            <section className="p-5 sm:p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
              <div><p className="text-[10px] font-mono text-cyan-300">01</p><h2 className="text-base font-semibold text-white">Personal Information</h2></div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {[['name', 'Full Name', 'Your full name', 'text'], ['email', 'Email Address', 'you@example.com', 'email'], ['phone', 'Phone Number', 'Phone number', 'tel']].map(([name, label, placeholder, type]) => <label key={name} className="block"><span className="text-xs text-slate-400">{label}</span><input name={name} type={type} value={profile[name] || ''} onChange={updateField} autoComplete={name === 'name' ? 'name' : name === 'email' ? 'email' : 'tel'} placeholder={placeholder} className="mt-1 w-full px-3 py-2.5 rounded-lg bg-vortex-surface border border-vortex-border text-sm text-white focus:outline-none focus:border-cyan-400" /></label>)}
              </div>
            </section>

            <section className="p-5 sm:p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
              <div><p className="text-[10px] font-mono text-cyan-300">02</p><h2 className="text-base font-semibold text-white">Educational Credentials</h2></div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label><span className="text-xs text-slate-400">Degree / Program</span><input name="degree" value={profile.degree || ''} onChange={updateField} placeholder="e.g. B.Tech in Computer Science" className="mt-1 w-full px-3 py-2.5 rounded-lg bg-vortex-surface border border-vortex-border text-sm text-white focus:outline-none focus:border-cyan-400" /></label>
                <label><span className="text-xs text-slate-400">College / University</span><input name="college" value={profile.college || ''} onChange={updateField} placeholder="Institution name" className="mt-1 w-full px-3 py-2.5 rounded-lg bg-vortex-surface border border-vortex-border text-sm text-white focus:outline-none focus:border-cyan-400" /></label>
                <label><span className="text-xs text-slate-400">Graduation Year</span><input name="gradYear" inputMode="numeric" value={profile.gradYear || ''} onChange={updateField} placeholder="e.g. 2027" className="mt-1 w-full px-3 py-2.5 rounded-lg bg-vortex-surface border border-vortex-border text-sm text-white focus:outline-none focus:border-cyan-400" /></label>
                <label><span className="text-xs text-slate-400">CGPA / Percentage</span><input name="cgpa" value={profile.cgpa || ''} onChange={updateField} placeholder="As recorded by your institution" className="mt-1 w-full px-3 py-2.5 rounded-lg bg-vortex-surface border border-vortex-border text-sm text-white focus:outline-none focus:border-cyan-400" /></label>
              </div>
            </section>

            <section className="p-5 sm:p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
              <div><p className="text-[10px] font-mono text-cyan-300">03</p><h2 className="text-base font-semibold text-white">Resume & Skills</h2></div>
              <div className="rounded-xl bg-vortex-surface/60 border border-vortex-border p-4">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div><p className="text-xs text-slate-400">Resume</p>{profile.resume?.status === 'parsed' ? <><p className="mt-1 text-sm font-medium text-white break-all">{profile.resume.fileName || 'Resume on file'}</p><p className="mt-1 text-xs text-emerald-300">Uploaded{profile.resume.uploadedAt ? ` · ${new Date(profile.resume.uploadedAt).toLocaleDateString()}` : ''} · {profile.resume.extractedSkillCount || skills.filter(skill => skill.source === 'resume').length} extracted skills</p></> : <p className="mt-1 text-sm text-slate-300">No resume uploaded</p>}</div><div className="flex flex-wrap gap-2">{profile.resume?.status === 'parsed' && <button type="button" onClick={() => setShowResumeText(value => !value)} className="px-3 py-2 rounded-lg border border-vortex-border text-xs text-slate-200">{showResumeText ? 'Hide' : 'View'}</button>}<button type="button" onClick={() => setActiveTab('skillgap')} className="px-3 py-2 rounded-lg border border-cyan-500/30 text-xs text-cyan-200">{profile.resume?.status === 'parsed' ? 'Manage Resume →' : 'Go to Skill Intelligence →'}</button></div></div>
                {showResumeText && profile.resume?.extractedText && <pre className="mt-3 max-h-48 overflow-auto whitespace-pre-wrap break-words rounded-lg bg-slate-950/50 p-3 text-[11px] leading-relaxed text-slate-300">{profile.resume.extractedText}</pre>}
              </div>
              <div><div className="flex flex-wrap items-center justify-between gap-2"><div><p className="text-sm font-medium text-white">Skills</p><p className="text-xs text-slate-400">{skills.length} confirmed skill{skills.length === 1 ? '' : 's'}</p></div><button type="button" onClick={() => setActiveTab('skillgap')} className="px-3 py-2 rounded-lg border border-vortex-border text-xs text-slate-200 hover:border-cyan-500/40">Manage Skills →</button></div>
                {skills.length ? <div className="mt-3 flex flex-wrap gap-2">{skills.map(skill => <span key={skill.canonical} title={`${skill.source === 'resume' ? 'Resume detected' : 'Added manually'}${skill.evidence ? ` · ${skill.evidence}` : ''}`} className="max-w-full rounded-lg border border-cyan-500/20 bg-cyan-500/5 px-2.5 py-1.5 text-xs text-cyan-100"><span className="break-words">{skill.display}</span><span className="ml-1.5 text-[9px] text-slate-500">{skill.source === 'resume' ? 'RESUME' : 'MANUAL'}</span></span>)}</div> : <p className="mt-3 text-xs text-slate-400">No confirmed skills yet. Add or review skills in Skill Intelligence.</p>}
              </div>
            </section>

            {saveStatus && <p role="status" className="rounded-lg border border-slate-700 bg-vortex-card px-3 py-2 text-xs text-slate-300">{saveStatus}</p>}
            <div className="flex justify-end"><button type="submit" disabled={isSaving} className="px-5 py-2.5 rounded-lg bg-cyan-500/15 border border-cyan-400/30 text-sm font-semibold text-cyan-100 disabled:opacity-50">{isSaving ? 'Saving…' : 'Save Profile'}</button></div>
          </form>
        </div>
      );
    }

    // =========================================================================
    // 3. SKILL INTELLIGENCE: canonical resume, confirmed skills, target, gaps, and roadmap
    // =========================================================================
    function JobMatchPanel({ profile, setProfile, setActiveTab }) {
      const [jobDescription, setJobDescription] = useState('');
      const [result, setResult] = useState(profile.latestJobMatch || null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [message, setMessage] = useState('');
      const skills = profileSkillRecords(profile).filter(skill => skill.confirmed);

      const saveResult = async next => {
        setProfile(previous => ({ ...previous, latestJobMatch: next }));
        try {
          const saved = await saveStudentProfile({ ...profile, latestJobMatch: next });
          setProfile({ ...EMPTY_PROFILE, ...saved });
          setMessage('Analysis saved to your profile.');
        } catch (saveError) {
          console.error('Job analysis could not sync:', saveError);
          setMessage('Analysis is saved in this browser. Profile sync is temporarily unavailable.');
        }
      };
      const analyze = async event => {
        event.preventDefault();
        setLoading(true); setError(''); setMessage('');
        try {
          const response = await fetch('/api/job-match/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobDescription, profile: { ...profile, skills, skillGoals: Array.isArray(profile.skillGoals) ? profile.skillGoals : [] } }) });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.error || 'Job analysis is temporarily unavailable.');
          if (!Array.isArray(body.requirements) || !Array.isArray(body.priorityGaps)) throw new Error('The job analysis response was incomplete.');
          const savedResult = { ...body, summary: { title: body.job?.title || 'Job description', coverageScore: body.coverageScore, requirementCount: body.requirementCount, matchedCount: body.matchedCount, developingCount: body.developingCount, notFoundCount: body.notFoundCount } };
          setResult(savedResult);
          await saveResult(savedResult);
        } catch (analysisError) {
          console.error('Job description analysis failed:', analysisError);
          setError(/failed to fetch|networkerror/i.test(String(analysisError.message)) ? 'Job analysis is temporarily unavailable. Your saved skills are still available.' : analysisError.message);
        } finally { setLoading(false); }
      };
      const addGapToGoals = async item => {
        const goals = Array.isArray(profile.skillGoals) ? profile.skillGoals : [];
        if (goals.some(goal => canonicalSkillName(goal.canonical) === item.canonical)) { setMessage(`${item.display} is already in your learning goals.`); return; }
        const next = { ...profile, skillGoals: [...goals, { canonical: item.canonical, display: item.display, currentLevel: 'beginner', targetLevel: 'intermediate', priority: item.importance === 'high' ? 'high' : 'medium' }] };
        setProfile(next);
        try { setProfile({ ...EMPTY_PROFILE, ...await saveStudentProfile(next) }); setMessage(`${item.display} added to your learning goals.`); }
        catch (saveError) { setMessage(`${item.display} is saved in this browser; backend sync is temporarily unavailable.`); }
      };
      const statusText = { matched: 'Matched by confirmed evidence', developing: 'Developing / partial evidence', missing: 'No confirmed evidence' };
      const statusStyle = { matched: 'border-emerald-900/70 bg-emerald-950/20 text-emerald-200', developing: 'border-amber-900/70 bg-amber-950/20 text-amber-200', missing: 'border-slate-800 bg-slate-950/40 text-slate-300' };

      return <div className="space-y-5">
        <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 sm:p-6"><h2 className="text-lg font-semibold text-white">Analyze a job</h2><p className="mt-1 text-sm text-slate-400">Paste a job description. We’ll identify recognized skill mentions and compare them with your confirmed profile and stated learning levels.</p><form onSubmit={analyze} className="mt-4 space-y-3"><label htmlFor="job-description" className="block text-xs font-medium text-slate-300">Job description</label><textarea id="job-description" value={jobDescription} onChange={event => setJobDescription(event.target.value)} maxLength={30000} rows={9} placeholder="Paste the job description here…" className="w-full resize-y rounded-xl border border-slate-700 bg-[#0b0f14] p-3 text-sm leading-relaxed text-slate-100 placeholder:text-slate-600 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20"/><div className="flex flex-wrap items-center justify-between gap-2"><span className="text-[11px] text-slate-500">Up to 30,000 characters · {skills.length} confirmed profile skills · No job data source is queried</span><button type="submit" disabled={loading || jobDescription.trim().length < 20} className="rounded-lg bg-cyan-500 px-4 py-2.5 text-sm font-medium text-slate-950 disabled:cursor-not-allowed disabled:opacity-50">{loading ? 'Analyzing…' : 'Analyze Job'}</button></div></form>{loading && <p role="status" className="mt-3 text-xs text-cyan-200">Extracting explicit skill requirements and comparing profile evidence…</p>}{error && <div role="alert" className="mt-3 flex flex-wrap items-center justify-between gap-3 rounded-lg border border-amber-900/70 bg-amber-950/20 p-3 text-xs text-amber-100"><span>{error}</span><button type="button" onClick={event => { event.preventDefault(); analyze({ preventDefault() {} }); }} className="underline">Retry</button></div>}{message && <p role="status" className="mt-3 text-xs text-slate-400">{message}</p>}</section>
        {result && <>
          <section className="grid gap-3 sm:grid-cols-3"><article className="rounded-xl border border-slate-800 bg-slate-900/50 p-4 sm:col-span-2"><p className="text-xs uppercase tracking-wide text-slate-500">Job overview</p><h3 className="mt-1 text-base font-semibold text-white">{result.job?.title || 'Job description'}</h3><p className="mt-2 text-sm text-slate-400">{result.requirementCount} recognized skill requirements · {result.matchedCount} matched · {result.developingCount} developing · {result.notFoundCount} not found</p></article><article className="rounded-xl border border-slate-800 bg-slate-900/50 p-4"><p className="text-xs uppercase tracking-wide text-slate-500">Profile coverage</p><p className="mt-1 text-3xl font-semibold text-white">{result.coverageScore == null ? '—' : `${result.coverageScore}%`}</p><p className="mt-1 text-[11px] text-slate-500">{result.coverageScore == null ? 'No supported skills identified' : result.scoreLabel}. Not a hiring probability.</p></article></section>
          {result.warnings?.map((warning, index) => <p key={index} className="rounded-lg border border-amber-900/60 bg-amber-950/20 p-3 text-xs text-amber-100">{warning}</p>)}
          <section className="grid gap-4 lg:grid-cols-3">
            {[['Matched', result.skillsYouHave || [], 'matched'], ['Developing', result.developingSkills || [], 'developing'], ['Missing confirmed evidence', result.notFoundSkills || [], 'missing']].map(([title, items, status]) => <article key={status} className="rounded-xl border border-slate-800 bg-slate-900/40 p-4"><h3 className="text-sm font-semibold text-white">{title} <span className="font-normal text-slate-500">{items.length}</span></h3>{items.length ? <ul className="mt-3 space-y-2">{items.map(item => <li key={item.canonical}><details className={`rounded-lg border p-3 ${statusStyle[status]}`}><summary className="cursor-pointer list-none text-sm font-medium">{item.display}<span className="ml-2 text-[10px] font-normal opacity-75">{statusText[status]}</span></summary><p className="mt-2 text-[11px] leading-relaxed text-slate-300">Job description evidence: “{item.evidence}”</p>{item.profileEvidence && <p className="mt-1 text-[11px] leading-relaxed text-slate-400">Profile evidence: “{item.profileEvidence}”</p>}<p className="mt-2 text-[10px] uppercase tracking-wide opacity-75">{item.importance} priority · {item.source}</p><p className="mt-1 text-[11px] text-slate-400">{item.reason}</p>{status !== 'matched' && <button type="button" onClick={() => addGapToGoals(item)} className="mt-2 text-xs underline underline-offset-4">Add to learning goals</button>}</details></li>)}</ul> : <p className="mt-3 text-xs text-slate-500">No skills in this group.</p>}</article>)}
          </section>
          <section className="rounded-xl border border-slate-800 bg-slate-900/40 p-4"><h3 className="text-sm font-semibold text-white">Priority skill gaps</h3>{result.priorityGaps?.length ? <ol className="mt-3 space-y-2">{result.priorityGaps.slice(0, 8).map((item, index) => <li key={item.canonical} className="flex flex-wrap items-center justify-between gap-2 rounded-lg border border-slate-800 p-3"><div><p className="text-sm text-slate-100"><span className="mr-2 text-slate-500">{index + 1}</span>{item.display}<span className="ml-2 text-[10px] uppercase text-slate-500">{item.priority} · {statusText[item.status]}</span></p><p className="mt-1 text-[11px] text-slate-400">{item.reason}</p>{item.relatedSkills?.length > 0 && <p className="mt-1 text-[10px] text-slate-500">Related confirmed skills: {item.relatedSkills.join(', ')}</p>}</div><button type="button" onClick={() => addGapToGoals(item)} className="rounded-md border border-slate-700 px-3 py-1.5 text-xs text-slate-200 hover:border-cyan-500/40">Add to goals</button></li>)}</ol> : <p className="mt-2 text-xs text-slate-400">No skill gaps were identified in the recognized requirements.</p>}</section>
          <p className="text-[11px] leading-relaxed text-slate-500">{result.scoreFormula} {result.methodology}</p>
        </>}
      </div>;
    }

    function SkillGapTab({ profile, setProfile, gainXp, sound, setActiveTab, preferredCareerId = '', pageMode = 'skills', initialMode = 'build', openSkillGoals }) {
      const [catalogueTracks, setCatalogueTracks] = useState([]);
      useEffect(() => {
        const controller = new AbortController();
        fetch('/api/roadmap/catalogue', { signal: controller.signal })
          .then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data?.error || 'Catalogue is unavailable.'); return data; })
          .then(data => { if (!controller.signal.aborted && Array.isArray(data.tracks)) setCatalogueTracks(data.tracks); })
          .catch(error => { if (error.name !== 'AbortError') console.error('Roadmap catalogue could not be loaded:', error); });
        return () => controller.abort();
      }, []);
      const targetCareers = catalogueTracks.filter(career => career.id !== 'software-engineering');
      const findCareer = value => targetCareers.find(career => career.id === value || career.name.toLowerCase() === String(value || '').toLowerCase());
      const suggestedCareer = findCareer(preferredCareerId);
      const [targetCareerId, setTargetCareerId] = useState(resolveTargetCareerId(profile.targetCareer) || suggestedCareer?.id || '');
      const [experienceLevel, setExperienceLevel] = useState(profile.experienceLevel || 'not specified');
      const [pendingResume, setPendingResume] = useState(null);
      const [extractedSkills, setExtractedSkills] = useState([]);
      const [selectedExtractedSkills, setSelectedExtractedSkills] = useState([]);
      const [isParsing, setIsParsing] = useState(false);
      const [parseError, setParseError] = useState('');
      const [manualSkillQuery, setManualSkillQuery] = useState('');
      const [manualSkillLevel, setManualSkillLevel] = useState('beginner');
      const [profileSyncMessage, setProfileSyncMessage] = useState('');
      const [showResumeText, setShowResumeText] = useState(false);
      const [learningRoadmap, setLearningRoadmap] = useState(null);
      const [skillGapResult, setSkillGapResult] = useState(null);
      const [isRoadmapLoading, setIsRoadmapLoading] = useState(false);
      const [roadmapError, setRoadmapError] = useState('');
      const [retryCount, setRetryCount] = useState(0);
      const [workspaceTab, setWorkspaceTab] = useState(initialMode || 'build');
      const [goalQuery, setGoalQuery] = useState('');
      const [goalCurrentLevel, setGoalCurrentLevel] = useState('beginner');
      const [goalTargetLevel, setGoalTargetLevel] = useState('intermediate');
      const [goalPriority, setGoalPriority] = useState('high');
      const confirmedSkills = profileSkillRecords(profile).filter(skill => skill.confirmed);
      const allowedGoalNames = new Map(SKILL_GOAL_OPTIONS.map(skill => [canonicalSkillName(skill), skill]));
      const skillGoals = [...new Map((Array.isArray(profile.skillGoals) ? profile.skillGoals : []).flatMap(goal => {
        const rawName = typeof goal === 'string' ? goal : goal?.canonical || goal?.canonicalSkill || goal?.skill || goal?.name || goal?.display;
        const canonical = canonicalSkillName(rawName);
        const display = allowedGoalNames.get(canonical);
        return display ? [[canonical, { ...(typeof goal === 'object' ? goal : {}), canonical, display }]] : [];
      })).values()].slice(0, MAX_SKILL_GOALS);
      const currentCareer = findCareer(targetCareerId);
      const matched = skillGapResult ? [...skillGapResult.masteredSkills, ...skillGapResult.developingSkills] : [];
      const missing = skillGapResult ? [...skillGapResult.criticalMissingSkills, ...skillGapResult.missingSkills] : [];
      const compatibility = Number.isFinite(Number(skillGapResult?.readinessScore)) ? Math.round(Number(skillGapResult.readinessScore)) : null;

      useEffect(() => {
        if (preferredCareerId && !profile.targetCareer && suggestedCareer && targetCareerId !== suggestedCareer.id) setTargetCareerId(suggestedCareer.id);
      }, [preferredCareerId]);

      useEffect(() => {
        const controller = new AbortController();
        setSkillGapResult(null);
        setLearningRoadmap(null);
        setRoadmapError('');
        const hasJobRequirements = Array.isArray(profile.latestJobMatch?.requirements) && profile.latestJobMatch.requirements.length > 0;
        const hasRoadmapTarget = Boolean(currentCareer || skillGoals.length || hasJobRequirements);
        const useCareerAnalysis = Boolean(currentCareer && confirmedSkills.length);
        if (!hasRoadmapTarget) {
          setIsRoadmapLoading(false);
          return () => controller.abort();
        }
        setIsRoadmapLoading(true);
        const requestProfile = { ...profile, skills: confirmedSkills, skillGoals, targetCareer: targetCareerId, experienceLevel };
        const endpoint = useCareerAnalysis ? '/api/ai/analyze' : '/api/roadmap/skills';
        fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile: requestProfile }), signal: controller.signal })
          .then(async response => {
            let result;
            try { result = await response.json(); } catch (error) { throw new Error('The career service returned an unreadable response.'); }
            if (!response.ok) throw new Error(result?.error || `Career analysis failed (${response.status}).`);
            const roadmap = result.learningRoadmap || result;
            if (!Array.isArray(roadmap?.phases)) throw new Error('The learning service response is missing roadmap data.');
            return result;
          })
          .then(result => { if (!controller.signal.aborted) { setSkillGapResult(result.skillGapAnalysis || null); setLearningRoadmap(result.learningRoadmap || result); } })
          .catch(error => {
            if (error.name !== 'AbortError') {
              console.error('Skill Intelligence analysis failed:', error);
              setSkillGapResult(null);
              setLearningRoadmap(null);
              setRoadmapError('Career analysis temporarily unavailable. Your profile and saved skills are still available.');
            }
          })
          .finally(() => { if (!controller.signal.aborted) setIsRoadmapLoading(false); });
        return () => controller.abort();
      }, [profile.skills, profile.skillGoals, profile.latestJobMatch, profile.roadmapProgress, targetCareerId, experienceLevel, retryCount]);

      const updateRoadmapActivity = async (item, activity) => {
        if (!item?.id || !['learning', 'practice', 'verification'].includes(activity)) return;
        const field = `${activity}Status`;
        const existing = profile.roadmapProgress?.[item.id] || {};
        const current = existing[field] || 'not_started';
        const next = current === 'not_started' ? 'in_progress' : current === 'in_progress' ? 'completed' : 'not_started';
        await saveSharedProfile({ ...profile, roadmapProgress: {
          ...(profile.roadmapProgress || {}), [item.id]: { ...existing, [field]: next }
        } });
      };

      const saveSharedProfile = async nextProfile => {
        const { removedSkills: _removedSkills, ...displayProfile } = nextProfile;
        setProfile(displayProfile);
        setProfileSyncMessage('Saved in this browser. Syncing your shared profile…');
        try {
          const saved = await saveStudentProfile(nextProfile);
          setProfile({ ...EMPTY_PROFILE, ...saved });
          setProfileSyncMessage('Your shared profile is saved.');
          return saved;
        } catch (error) {
          console.error('Could not sync Skill Intelligence changes:', error);
          setProfile(displayProfile);
          setProfileSyncMessage('Saved in this browser. Backend sync is temporarily unavailable.');
          return displayProfile;
        }
      };
      const parseResumeFile = async file => {
        if (!file) return;
        const extension = file.name.split('.').pop().toLowerCase();
        const contentTypes = { pdf: 'application/pdf', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', txt: 'text/plain' };
        if (!contentTypes[extension]) { setParseError('Upload a PDF, DOCX, or TXT resume.'); return; }
        if (file.size > 5 * 1024 * 1024) { setParseError('Resume must be 5 MB or smaller.'); return; }
        setIsParsing(true);
        setParseError('');
        setPendingResume(null);
        setExtractedSkills([]);
        sound.beep();
        try {
          const formData = new FormData();
          formData.append('resume', file);
          const response = await fetch('/api/resume/parse', { method: 'POST', body: formData });
          const result = await response.json().catch(() => null);
          if (!response.ok) throw new Error(result?.error || `Resume parser returned HTTP ${response.status}.`);
          if (!result || !result.success) throw new Error(result?.error || 'Resume parser returned an unreadable response.');
          const candidate = result.candidateProfile || {};
          const priorResume = profile.resume || {};
          const sameResume = Boolean(result.contentHash && result.contentHash === priorResume.contentHash);
          const decisions = sameResume && Array.isArray(priorResume.candidateDecisions) ? priorResume.candidateDecisions : [];
          const detected = [...new Map((Array.isArray(candidate.skills) ? candidate.skills : []).map(item => {
            const canonical = canonicalSkillName(item.canonical || item.display);
            const decision = decisions.find(item => canonicalSkillName(item.canonical) === canonical);
            return [canonical, { ...item, canonical, canonicalName: item.display || skillDisplayName(canonical), name: item.display || skillDisplayName(canonical), display: item.display || skillDisplayName(canonical), level: 'familiar', source: 'resume', sources: ['resume'], confirmed: decision?.status === 'confirmed', reviewStatus: decision?.status || 'review' }];
          }).filter(([canonical]) => canonical)).values()];
          setPendingResume({ fileName: result.filename || file.name, uploadedAt: new Date().toISOString(), extractedText: result.textPreview || '', extractedSkillCount: detected.length, contentHash: result.contentHash || '', sections: result.sections || {}, candidateDecisions: decisions, candidateProfile: candidate });
          setExtractedSkills(detected);
          setSelectedExtractedSkills(detected.map(skill => skill.canonical));
          sound.success();
        } catch (error) {
          console.error('Resume parsing failed:', error);
          const message = String(error?.message || '');
          setParseError(error instanceof TypeError || /failed to fetch|networkerror/i.test(message)
            ? 'Cannot connect to the resume service. Start the backend on port 5000 and try again.'
            : message || "We couldn't extract skills from this resume. Try another file or add your skills manually.");
        } finally { setIsParsing(false); }
      };
      const handleFileUpload = event => { const file = event.target.files?.[0]; event.target.value = ''; parseResumeFile(file); };
      const saveResumeDetails = () => {
        if (!pendingResume) return;
        const candidate = pendingResume.candidateProfile || {};
        const nextProfile = {
          ...profile,
          ...(candidate.name ? { name: candidate.name } : {}),
          ...(candidate.degree ? { degree: candidate.degree } : {}),
          ...(candidate.college ? { college: candidate.college } : {}),
          ...(candidate.graduationYear ? { gradYear: String(candidate.graduationYear) } : {}),
          ...(candidate.cgpa !== null && candidate.cgpa !== undefined ? { cgpa: String(candidate.cgpa) } : {}),
          projects: Array.isArray(candidate.projects) && candidate.projects.length ? candidate.projects : profile.projects,
          experience: Array.isArray(candidate.internshipsOrWorkExperience) && candidate.internshipsOrWorkExperience.length ? candidate.internshipsOrWorkExperience : profile.experience,
          certifications: Array.isArray(candidate.certifications) && candidate.certifications.length ? candidate.certifications : profile.certifications,
          skills: confirmedSkills,
          resume: { fileName: pendingResume.fileName, uploadedAt: pendingResume.uploadedAt, status: 'parsed', extractedText: pendingResume.extractedText, extractedSkillCount: pendingResume.extractedSkillCount, contentHash: pendingResume.contentHash, sections: pendingResume.sections, candidateDecisions: pendingResume.candidateDecisions }
        };
        saveSharedProfile(nextProfile);
        setPendingResume(null);
        setExtractedSkills([]);
        setSelectedExtractedSkills([]);
        setParseError('');
      };
      const decideResumeSkill = async (skill, status) => {
        if (!pendingResume) return;
        const decisions = (pendingResume.candidateDecisions || []).filter(item => canonicalSkillName(item.canonical) !== skill.canonical);
        decisions.push({ canonical: skill.canonical, status, confidence: Number(skill.confidence) || 0 });
        const nextSkills = new Map(confirmedSkills.map(item => [item.canonical, item]));
        if (status === 'confirmed') {
          const existing = nextSkills.get(skill.canonical);
          const sources = new Set([...(existing?.sources || (existing?.source ? [existing.source] : [])), 'resume']);
          const evidenceItems = [...(existing?.evidenceItems || []), ...(Array.isArray(skill.evidence) ? skill.evidence : [])];
          const evidence = [...new Set([existing?.evidence || '', skill.evidenceText || ''].filter(Boolean))].join(' · ');
          nextSkills.set(skill.canonical, { ...existing, ...skill, level: existing?.level || 'familiar', source: sources.has('manual') ? 'manual' : 'resume', sources: [...sources], evidence, evidenceItems, confirmed: true });
        }
        const nextResume = { fileName: pendingResume.fileName, uploadedAt: pendingResume.uploadedAt, status: 'parsed', extractedText: pendingResume.extractedText, extractedSkillCount: pendingResume.extractedSkillCount, contentHash: pendingResume.contentHash, sections: pendingResume.sections, candidateDecisions: decisions };
        const nextProfile = { ...profile, skills: [...nextSkills.values()], resume: nextResume };
        const saved = await saveSharedProfile(nextProfile);
        setPendingResume(current => current ? { ...current, candidateDecisions: decisions } : current);
        setExtractedSkills(current => current.map(item => item.canonical === skill.canonical ? { ...item, reviewStatus: status, confirmed: status === 'confirmed' } : item));
        if (status === 'confirmed') gainXp(10, `Confirmed ${skill.display} Evidence`);
        return saved;
      };
      const addManualSkill = value => {
        const label = String(value || manualSkillQuery).trim();
        const canonical = canonicalSkillName(label);
        if (!canonical || confirmedSkills.some(skill => skill.canonical === canonical)) return;
        sound.click();
        saveSharedProfile({ ...profile, skills: [...confirmedSkills, { canonical, canonicalName: skillDisplayName(label), name: skillDisplayName(label), display: skillDisplayName(label), level: manualSkillLevel, source: 'manual', sources: ['manual'], confidence: 1, confirmed: true, evidence: '' }] });
        setManualSkillQuery('');
      };
      const removeSkill = canonical => saveSharedProfile({ ...profile, skills: confirmedSkills.filter(skill => skill.canonical !== canonical), removedSkills: [canonical] });
      const removeResume = () => {
        saveSharedProfile({ ...profile, resume: null, skills: confirmedSkills });
        setPendingResume(null);
        setExtractedSkills([]);
        setSelectedExtractedSkills([]);
        setShowResumeText(false);
      };
      const chooseCareer = careerId => {
        const career = findCareer(careerId);
        if (!career) return;
        setTargetCareerId(career.id);
        setProfile({ ...profile, targetCareer: career.id });
        saveSharedProfile({ ...profile, targetCareer: career.id });
      };
      const addSkillGoal = () => {
        const selectedSkill = SKILL_GOAL_OPTIONS.find(option => option === goalQuery);
        const canonical = selectedSkill ? canonicalSkillName(selectedSkill) : '';
        const alreadySelected = skillGoals.some(goal => canonicalSkillName(goal.canonical || goal.canonicalSkill || goal.skill || goal.name || goal.display) === canonical);
        if (!canonical || alreadySelected || skillGoals.length >= MAX_SKILL_GOALS) return;
        const nextGoal = { canonical, display: selectedSkill, currentLevel: goalCurrentLevel, targetLevel: goalTargetLevel, priority: goalPriority };
        saveSharedProfile({ ...profile, skillGoals: [...skillGoals, nextGoal] });
        setGoalQuery('');
      };
      const removeSkillGoal = canonical => saveSharedProfile({ ...profile, skillGoals: skillGoals.filter(goal => canonicalSkillName(goal.canonical || goal.canonicalSkill || goal.skill || goal.name || goal.display) !== canonical) });
      const skillGoalLimitReached = skillGoals.length >= MAX_SKILL_GOALS;
      const selectedGoalCanonical = canonicalSkillName(goalQuery);
      const duplicateSkillGoal = Boolean(selectedGoalCanonical && skillGoals.some(goal => canonicalSkillName(goal.canonical || goal.canonicalSkill || goal.skill || goal.name || goal.display) === selectedGoalCanonical));
      const availableSkillOptions = manualSkillQuery.trim() ? ALL_SKILL_OPTIONS.filter(option => option.toLowerCase().includes(manualSkillQuery.trim().toLowerCase()) && !confirmedSkills.some(skill => skill.canonical === canonicalSkillName(option))).slice(0, 6) : [];
      const toggleExtractedSkill = canonical => setSelectedExtractedSkills(current => current.includes(canonical) ? current.filter(item => item !== canonical) : [...current, canonical]);

      return (
        <div className="mx-auto max-w-6xl space-y-6 animate-fadeIn">
          <header className="flex flex-col gap-3 border-b border-slate-800 pb-4 sm:flex-row sm:items-end sm:justify-between"><div><p className="text-xs font-medium uppercase tracking-wide text-cyan-300">{pageMode === 'roadmap' ? 'LEARNING PLAN' : 'SKILL INTELLIGENCE'}</p><h1 className="mt-1 text-2xl font-semibold text-white sm:text-3xl">{pageMode === 'roadmap' ? 'Your Learning Roadmap' : workspaceTab === 'build' ? 'Build your skills' : workspaceTab === 'goals' ? 'My Skill Goals' : 'Job Match'}</h1><p className="mt-1 text-sm text-slate-400">{pageMode === 'roadmap' ? 'A path based on your selected career or learning goals.' : 'Understand your current skills, learning goals, and job requirements.'}</p></div><button type="button" onClick={() => setActiveTab('profile')} className="self-start rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200 hover:border-slate-500">Profile</button></header>

          {pageMode === 'skills' && <nav aria-label="Skill Intelligence modes" className="flex flex-wrap gap-1 rounded-xl border border-slate-800 bg-slate-900/50 p-1">{[{ id: 'build', label: 'Build Skills' }, { id: 'goals', label: 'My Skill Goals' }, { id: 'job', label: 'Job Match' }].map(tab => <button key={tab.id} type="button" role="tab" aria-selected={workspaceTab === tab.id} onClick={() => setWorkspaceTab(tab.id)} className={`rounded-lg px-3 py-2 text-xs font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-cyan-400 ${workspaceTab === tab.id ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-slate-100'}`}>{tab.label}</button>)}</nav>}

          {pageMode === 'skills' && workspaceTab === 'build' && <div className="grid grid-cols-1 gap-4 lg:grid-cols-5">
            <section className="lg:col-span-2 p-5 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
              <div className="flex items-start justify-between gap-3"><div><p className="text-[10px] font-mono text-cyan-300">01 · RESUME</p><h2 className="mt-1 text-base font-semibold text-white">Your Resume</h2></div><span className="text-[10px] text-slate-500">PDF / DOCX / TXT · 5 MB max</span></div>
              {profile.resume?.status === 'parsed' ? <div className="p-3 rounded-xl bg-vortex-surface border border-vortex-border"><p className="text-sm font-medium text-white break-all">{profile.resume.fileName || 'Resume on file'}</p><p className="mt-1 text-xs text-emerald-300">Uploaded · Skills extracted: {profile.resume.extractedSkillCount ?? confirmedSkills.filter(skill => skill.source === 'resume').length}</p><div className="mt-3 flex flex-wrap gap-2"><button type="button" onClick={() => setShowResumeText(value => !value)} className="px-3 py-1.5 rounded-lg border border-vortex-border text-xs text-slate-200">{showResumeText ? 'Hide resume text' : 'View extracted text'}</button><button type="button" onClick={removeResume} className="px-3 py-1.5 rounded-lg border border-rose-500/25 text-xs text-rose-200">Remove Resume</button></div>{showResumeText && <pre className="mt-3 max-h-40 overflow-auto whitespace-pre-wrap break-words text-[10px] leading-relaxed text-slate-400">{profile.resume.extractedText || 'No extracted text preview was stored.'}</pre>}</div> : <p className="text-sm text-slate-300">Upload your resume to automatically extract skills, education and project information.</p>}
              <label className="block cursor-pointer rounded-xl border border-dashed border-cyan-500/30 bg-cyan-500/5 px-4 py-5 text-center text-sm text-cyan-100 hover:border-cyan-400/60">{isParsing ? 'Parsing resume…' : profile.resume?.status === 'parsed' ? 'Replace Resume' : 'Upload Resume'}<input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} disabled={isParsing} className="sr-only" /></label>
              {!profile.resume?.status && <div className="rounded-lg bg-vortex-surface/70 p-3 text-xs text-slate-400"><strong className="text-slate-200">Don’t have a resume?</strong><p className="mt-1">Build your skill profile manually below.</p></div>}
              {parseError && <div role="alert" className="rounded-lg border border-rose-500/25 bg-rose-500/5 p-3 text-xs text-rose-200">{parseError}<button type="button" onClick={() => setActiveTab('profile')} className="ml-1 underline">Review profile</button></div>}
              {pendingResume && <div className="rounded-lg border border-cyan-500/20 bg-cyan-500/5 p-3 text-xs text-cyan-100">Parsed <strong>{pendingResume.fileName}</strong>. Review the extracted fields and confirm below to update your shared profile.</div>}
            </section>

            <section className="lg:col-span-3 p-5 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
              <div><p className="text-[10px] font-mono text-cyan-300">02 · CONFIRM / EDIT SKILLS</p><h2 className="mt-1 text-base font-semibold text-white">Your Skills · {confirmedSkills.length} confirmed</h2></div>
              {confirmedSkills.length ? <div className="flex flex-wrap gap-2">{confirmedSkills.map(skill => <span key={skill.canonical} title={`${skill.source === 'resume' ? skill.evidence || 'Resume detected' : 'Added manually'}${skill.confidence == null ? '' : ` · heuristic confidence ${Math.round(skill.confidence * 100)}%`}`} className="inline-flex items-center gap-1.5 rounded-lg border border-cyan-500/20 bg-cyan-500/5 px-2.5 py-1.5 text-xs text-cyan-100"><span>{skill.display}</span><span className="text-[9px] text-slate-500">{skill.source === 'resume' ? 'RESUME' : 'MANUAL'}</span><button type="button" onClick={() => removeSkill(skill.canonical)} aria-label={`Remove ${skill.display}`} className="ml-1 text-slate-400 hover:text-rose-300">×</button></span>)}</div> : <p className="text-sm text-slate-400">No confirmed skills yet. Add skills manually or upload a resume to extract candidates.</p>}

                  <div className="mt-3 grid gap-2 md:grid-cols-3">{[['learning', 'LEARN', skill.learning?.guidance], ['practice', 'PRACTICE', skill.practice?.task], ['verification', 'VERIFY', skill.verification?.task]].map(([activity, label, detail]) => { const activityStatus = skill[activity]?.status || 'not_started'; const buttonLabel = activityStatus === 'not_started' ? 'Start' : activityStatus === 'in_progress' ? 'Mark complete' : 'Reset'; const blocked = activity === 'practice' ? skill.learning?.status !== 'completed' || (learningRoadmap.catalogueTrackId && !skill.practice?.task) : activity === 'verification' ? skill.practice?.status !== 'completed' || (learningRoadmap.catalogueTrackId && !skill.verification?.task) : false; return <div key={activity} className="rounded-md border border-slate-800 bg-slate-900/50 p-2"><p className="text-[9px] font-semibold tracking-wide text-cyan-200">{label} · {activityStatus.replace('_', ' ')}</p><p className="mt-1 min-h-10 text-[10px] leading-relaxed text-slate-400">{detail}</p><button type="button" disabled={blocked} onClick={() => updateRoadmapActivity(skill, activity)} className="mt-2 rounded border border-slate-700 px-2 py-1 text-[10px] text-slate-200 hover:border-cyan-500/50 disabled:cursor-not-allowed disabled:opacity-40">{buttonLabel}</button></div>; })}</div>
                  {(skill.officialDocumentationUrls?.length > 0 || skill.officialDocumentationUrl) && <div className="mt-3"><p className="text-[9px] font-semibold tracking-wide text-cyan-200">OFFICIAL DOCUMENTATION</p>{(skill.officialDocumentationUrls?.length ? skill.officialDocumentationUrls : [skill.officialDocumentationUrl]).map((url, index) => <a key={url} href={url} target="_blank" rel="noopener noreferrer" className="mt-1 block text-[10px] text-cyan-300 underline underline-offset-2">{index === 0 ? 'Official Documentation / Tutorial' : 'Additional official guide'}</a>)}</div>}
                  {skill.youtube?.length > 0 ? <div className="mt-3 grid gap-2 sm:grid-cols-2">{skill.youtube.map(video => <article key={video.videoId} className="overflow-hidden rounded-lg border border-vortex-border"><a href={video.url} target="_blank" rel="noopener noreferrer" className="block"><img src={video.thumbnailUrl} alt={`Thumbnail for ${video.title}`} loading="lazy" className="aspect-video w-full bg-slate-900 object-cover" onError={event => { event.currentTarget.hidden = true; event.currentTarget.nextElementSibling.hidden = false; }} /><div hidden className="aspect-video flex items-center justify-center bg-slate-900 text-[10px] text-slate-500">Thumbnail unavailable</div><div className="p-2"><p className="text-[10px] font-medium text-slate-100">{video.title}</p><p className="mt-1 text-[9px] text-slate-400">{video.channel}{video.selectionBasis === 'high_view_verified' ? ' · Popular' : ' · Recommended video'}{video.viewsAtResearch != null ? ` · ${Number(video.viewsAtResearch).toLocaleString()} views at research` : ''}</p><span className="mt-2 inline-block text-[9px] text-cyan-300 underline">Watch on YouTube</span></div></a></article>)}</div> : skill.youtubeSearchUrl && <a href={skill.youtubeSearchUrl} target="_blank" rel="noopener noreferrer" className="mt-3 inline-block text-[10px] text-cyan-300 underline underline-offset-2">Find tutorials on YouTube</a>}
                  {skill.resources?.length > 0 && <ul className="mt-2 space-y-1">{skill.resources.map((resource, index) => <li key={`${resource.title}-${index}`} className="text-[10px] text-slate-400">{resource.title} · {resource.type}</li>)}</ul>}
                </div>)}</div>
                {phase.projectMilestone && <div className="mt-3 rounded-lg bg-slate-950/30 p-3"><p className="text-xs font-medium text-slate-100">Project milestone: {phase.projectMilestone.title}</p><p className="mt-1 text-[11px] text-slate-400">{phase.projectMilestone.objective}</p><p className="mt-1 text-[10px] text-slate-500">Deliverables: {phase.projectMilestone.deliverables.join(' · ')}</p></div>}
              </article>)}</div>
              {learningRoadmap.readinessContext && <p className="text-[10px] text-slate-500">{learningRoadmap.readinessContext}</p>}
            </> : !isRoadmapLoading && <div className="rounded-xl border border-slate-800 p-4"><p className="text-sm text-slate-300">{learningRoadmap?.readinessContext || 'Choose a career target, add a skill goal, or analyze a job description to build a roadmap.'}</p><button type="button" onClick={() => { setWorkspaceTab(learningRoadmap?.jobRequirements?.length ? 'job' : 'goals'); setActiveTab('skill-intelligence'); }} className="mt-3 rounded-lg bg-cyan-500 px-3 py-2 text-xs font-medium text-slate-950">Choose a goal</button></div>}
          </section>}

    // =========================================================================
    // 6. CAREER ACTION CENTER
    // =========================================================================
    function CareerActionTab({ profile, setActiveTab, openCareerAnalysis, openSkillGap, openLearningPlan }) {
      const [analysis, setAnalysis] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [retryCount, setRetryCount] = useState(0);
      const hasProfileData = (Array.isArray(profile.skills) && profile.skills.length > 0) || Boolean(profile.degree || profile.education || profile.college || profile.cgpa) || (Array.isArray(profile.interests) && profile.interests.length > 0) || Boolean(profile.projects && (Array.isArray(profile.projects) ? profile.projects.length : String(profile.projects).trim()));
      const profileComplete = Boolean(String(profile.name || '').trim() && String(profile.degree || '').trim() && Array.isArray(profile.skills) && profile.skills.length > 0);

      useEffect(() => {
        const controller = new AbortController();
        if (!hasProfileData) { setAnalysis(null); setError(''); setLoading(false); return () => controller.abort(); }
        setLoading(true);
        setError('');
        fetch('/api/ai/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile }), signal: controller.signal })
          .then(async response => {
            let result;
            try { result = await response.json(); } catch (parseError) { throw new Error('The career service returned an unreadable response.'); }
            if (!response.ok) throw new Error(result?.error || `Career analysis failed (${response.status}).`);
            if (!result || !Array.isArray(result.topRecommendations)) throw new Error('Career analysis returned an invalid recommendation list.');
            return result;
          })
