    // --- Web Audio Synthesizer (Zero External Dependencies) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.ambientGain = null;
        this.ambientNodes = [];
        this.soundEnabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.12, gainLevel = 0.08) {
        if (!this.soundEnabled) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      click() { this.playTone(850, 'sine', 0.04, 0.04); }
      success() {
        if (!this.soundEnabled) return;
        this.playTone(523.25, 'triangle', 0.1, 0.06); // C5
        setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.06), 80); // E5
        setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.08), 160); // G5
      }
      beep() { this.playTone(440, 'sine', 0.2, 0.05); }

      startAmbient(soundType) {
        this.stopAmbient();
        if (!this.soundEnabled) return;
        try {
          this.init();
          this.ambientGain = this.ctx.createGain();
          this.ambientGain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          this.ambientGain.connect(this.ctx.destination);

          if (soundType === 'rain' || soundType === 'whitenoise') {
            // Pink/White noise buffer
            const bufferSize = this.ctx.sampleRate * 2;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              if (soundType === 'rain') {
                data[i] = (lastOut * 0.95) + (white * 0.05); // low-pass filtered rain
                lastOut = data[i];
              } else {
                data[i] = white * 0.2; // white noise
              }
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            noise.connect(this.ambientGain);
            noise.start();
            this.ambientNodes.push(noise);
          } else if (soundType === 'binaural') {
            // Alpha wave binaural pulse (200Hz & 210Hz => 10Hz alpha beat)
            const oscL = this.ctx.createOscillator();
            const oscR = this.ctx.createOscillator();
            oscL.frequency.value = 200;
            oscR.frequency.value = 210;
            oscL.connect(this.ambientGain);
            oscR.connect(this.ambientGain);
            oscL.start();
            oscR.start();
            this.ambientNodes.push(oscL, oscR);
          }
        } catch (e) {
          console.warn('Ambient sound failed:', e);
        }
      }

      stopAmbient() {
        this.ambientNodes.forEach(node => {
          try { node.stop(); } catch(e) {}
        });
        this.ambientNodes = [];
      }
    }

    function ProfileTab({ profile, setProfile, gainXp, sound, setActiveTab }) {
      const [formData, setFormData] = useState({ ...profile });
      const [newSkill, setNewSkill] = useState('');
      const [saveStatus, setSaveStatus] = useState('');

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const toggleSkill = (skill) => {
        sound.click();
        setFormData(prev => {
          const exists = prev.skills.includes(skill);
          const updated = exists ? prev.skills.filter(s => s !== skill) : [...prev.skills, skill];
          return { ...prev, skills: updated };
        });
      };

      const addCustomSkill = (e) => {
        e.preventDefault();
        if (newSkill.trim() && !formData.skills.includes(newSkill.trim())) {
          sound.click();
          setFormData(prev => ({ ...prev, skills: [...prev.skills, newSkill.trim()] }));
          setNewSkill('');
        }
      };

      const toggleInterest = (interest) => {
        sound.click();

    // 5. PRODUCTIVITY TAB: Pomodoro Timer, Ambient Audio, Stress & Calm Center

    function ProductivityTab({ gainXp, sound }) {
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [isRunning, setIsRunning] = useState(false);
      const [mode, setMode] = useState('focus'); // focus, shortBreak, longBreak
      const [ambientSound, setAmbientSound] = useState('none'); // none, rain, binaural, whitenoise
      const [tasks, setTasks] = useState([
        { id: 1, title: 'Complete Tech Vortex AI Analysis & Review Skill Gaps', quad: 'q1', done: true },
        { id: 2, title: 'Optimize LinkedIn Headline & About Summary', quad: 'q1', done: false },
        { id: 3, title: 'Study 2 hard DSA problems on NeetCode', quad: 'q2', done: false },
        { id: 4, title: 'Prepare 5 answers for College Project Viva Defense', quad: 'q2', done: false },
        { id: 5, title: 'Clean up desktop downloads folder', quad: 'q4', done: false }
      ]);
      const [newTaskText, setNewTaskText] = useState('');
      const [newTaskQuad, setNewTaskQuad] = useState('q1');

      // Breathing Exercise State
      const [breathState, setBreathState] = useState('Inhale');
      const [breathCounter, setBreathCounter] = useState(4);
      const [isBreathingActive, setIsBreathingActive] = useState(false);

      // Pomodoro Timer Effect
      useEffect(() => {
        let interval = null;
        if (isRunning && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (timeLeft === 0 && isRunning) {
          setIsRunning(false);
          sound.success();
          gainXp(120, "Finished Focus Work Block!");
          alert("🎉 Focus session completed! Take a rejuvenating break.");
        }
        return () => clearInterval(interval);
      }, [isRunning, timeLeft]);

      // Ambient Audio Handler
      const handleAmbientChange = (type) => {
        setAmbientSound(type);
        if (type === 'none') {
          sound.stopAmbient();
        } else {
          sound.startAmbient(type);
        }
      };

      const setTimerMode = (m, minutes) => {
        sound.click();
        setMode(m);
        setIsRunning(false);
        setTimeLeft(minutes * 60);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // 4-7-8 Breathing Loop
      useEffect(() => {
        let timer = null;
        if (isBreathingActive) {
          timer = setInterval(() => {
            setBreathCounter(prev => {
              if (prev <= 1) {
                if (breathState === 'Inhale (4s)') {
                  setBreathState('Hold (7s)');
                  return 7;
                } else if (breathState === 'Hold (7s)') {
                  setBreathState('Exhale (8s)');
                  return 8;
                } else {
                  setBreathState('Inhale (4s)');
                  return 4;
                }
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [isBreathingActive, breathState]);

      const toggleTask = (id) => {
        sound.click();
        setTasks(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
      };

      const addTask = (e) => {
        e.preventDefault();
        if (newTaskText.trim()) {
          sound.click();
          setTasks(prev => [...prev, { id: Date.now(), title: newTaskText.trim(), quad: newTaskQuad, done: false }]);
          setNewTaskText('');
          gainXp(20, "Scheduled Priority Task");
        }
      };

      return (
        <div className="space-y-8 animate-fadeIn">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-vortex-border">
            <div>
              <div className="flex items-center gap-2 text-xs font-mono text-cyan-400 mb-1">

                <span>•</span>
                <span>Module 04</span>

            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-400 font-mono">Ambient Audio:</span>
              {['none', 'rain', 'binaural', 'whitenoise'].map((type) => (
                <button
                  key={type}
                  onClick={() => handleAmbientChange(type)}
                  className={`px-2.5 py-1 rounded-lg text-[10px] font-mono capitalize transition-all ${
                    ambientSound === type
                      ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40'
                      : 'bg-vortex-card border border-vortex-border text-slate-400'

                  {type}

                <div className="flex items-center justify-center gap-2">
                  <button
                    onClick={() => setTimerMode('focus', 25)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono transition-all ${
                      mode === 'focus' ? 'bg-cyan-500 text-black font-bold' : 'text-slate-400 hover:text-white'

                    25m Focus

                  <button
                    onClick={() => setTimerMode('shortBreak', 5)}

                  >
                    5m Break

                  <button
                    onClick={() => setTimerMode('longBreak', 15)}

                  {formatTime(timeLeft)}

                  </button>

                  {isRunning ? '⚡ Session active! Ambient focus sound playing.' : 'Tip: Work in unbroken 25-minute sprints to double your retention.'}
                </p>
              </div>

              {/* Stress Decompression: 4-7-8 Guided Breathing Circle */}
              <div className="p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-4 text-center">

                  >
                    {isBreathingActive ? 'Stop' : 'Start Guided Breathing'}
                  </button>
                </div>

                <div className="flex flex-col items-center justify-center py-4">
                  <div

    // =========================================================================
    // 6. INTERVIEW & VIVA TAB: Mock Prep, Speech AI, Defense Rules
    // =========================================================================
    function InterviewTab({ gainXp, sound }) {
      const [category, setCategory] = useState('technical');
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState('');
      const [isListening, setIsListening] = useState(false);
      const [isEvaluating, setIsEvaluating] = useState(false);
      const [evalResult, setEvalResult] = useState(null);

      const interviewBank = {
        technical: [
          { q: "Explain the difference between Virtual DOM and Real DOM in React, and how reconciliation works.", ideal: "The Virtual DOM is a lightweight JavaScript representation of the actual DOM tree. When state changes occur, React creates a new VDOM tree, computes diffs via the reconciliation algorithm (Fiber), and batches mutations efficiently to minimize expensive browser repaints." },
          { q: "How does the Node.js Event Loop manage asynchronous I/O with a single-threaded runtime?", ideal: "Node.js utilizes libuv to offload blocking tasks to a thread pool while keeping the main V8 execution thread non-blocking through phases: timers, pending callbacks, poll, check (setImmediate), and close callbacks." },
          { q: "What is overfitting in Machine Learning models, and what techniques prevent it?", ideal: "Overfitting occurs when a model learns noise and peculiarities of training data rather than generalizing. Mitigations include L1/L2 regularization, dropout layers, cross-validation, data augmentation, and early stopping." }
        ],
        viva: [
          { q: "Why did you choose React + Node.js + Python for this project instead of an all-in-one monolith or PHP?", ideal: "We decoupled frontend responsiveness using React from the intensive ML vector matching in Python, orchestrating persistence via Node.js REST APIs. This delivers sub-millisecond client renders alongside high-throughput computational intelligence." },
          { q: "What will happen to your platform if 100,000 concurrent students access the career recommendation engine?", ideal: "We would introduce horizontal scaling with Kubernetes pods, implement Redis caching for frequent skill vectors, and offload vector similarity queries to asynchronous task queues (Celery/RabbitMQ) with managed Vector DBs." },
          { q: "What are the limitations or edge cases of your current recommendation algorithm?", ideal: "Cold-start candidates with zero listed skills, domain shifts where emerging tech roles lack historical training data, and potential bias toward mainstream keywords. We address this using complementary skill clustering." }
        ],
        behavioral: [
          { q: "Tell me about a challenging bug you encountered in a team project and how you resolved it under pressure.", ideal: "Using STAR: Situation (tight hackathon deadline with broken auth), Task (restore session tokens), Action (isolated race conditions using network inspector and implemented token refresh queues), Result (restored uptime with zero downtime during final demo)." }
        ]
      };

      const currentQuestions = interviewBank[category];
      const question = currentQuestions[currentQIndex % currentQuestions.length];

      // Text to Speech Readout
      const readQuestionAloud = () => {
        if ('speechSynthesis' in window) {
          sound.click();
          const utterance = new SpeechSynthesisUtterance(question.q);
          utterance.rate = 1.0;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        } else {
          alert("Text-to-Speech not supported in your browser.");
        }
      };

      // Speech to Text Dictation (Web Speech API)
      const toggleVoiceDictation = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Speech recognition not supported in this browser. Please type your answer.");
          return;
        }

        if (isListening) {
          setIsListening(false);
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.lang = 'en-US';

          recognition.onstart = () => {
            setIsListening(true);
            sound.beep();
          };

          recognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            setUserAnswer(prev => prev + (prev ? ' ' : '') + transcript);
            setIsListening(false);
            sound.success();
          };

          recognition.onerror = () => setIsListening(false);
          recognition.onend = () => setIsListening(false);

          recognition.start();
        } catch (e) {
          setIsListening(false);
        }
      };

      const evaluateAnswer = async () => {
        if (!userAnswer.trim()) {
          alert("Please type or speak your response first.");
          return;
        }

        setIsEvaluating(true);
        sound.beep();

        // Check backend evaluator or run local evaluator
        setTimeout(() => {
          setIsEvaluating(false);
          sound.success();
          gainXp(100, "Submitted Mock Interview Answer");

          const words = userAnswer.trim().split(/\s+/).length;
          const score = Math.min(96, Math.max(68, Math.round(60 + (words * 0.5))));

          setEvalResult({
            score,
            clarity: score >= 85 ? "High (Clear technical fluency)" : "Moderate",
            feedback: `Solid effort! You addressed "${question.q.slice(0, 40)}...". Emphasize architectural trade-offs and quantitative results to hit top percentile marks.`,
            starScore: `${Math.min(95, score - 5)}%`,
            strengths: ["Relevant technical terminology", "Clear explanation structure", "Good core logic"],
            improvements: ["Mention quantitative impact (e.g. % performance gain)", "Conclude with an edge case or scalability note"]
          });
        }, 800);
      };

      return (
        <div className="space-y-8 animate-fadeIn">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-vortex-border">
            <div>
              <div className="flex items-center gap-2 text-xs font-mono text-cyan-400 mb-1">
                <span>STAGE & INTERVIEW MASTERY</span>
                <span>•</span>
                <span>Module 05</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-display font-extrabold text-white">Interactive Mock Viva & Interview Simulator</h1>
              <p className="text-xs text-slate-300">Prepare for tough college project defense, technical rounds, and behavioral questions with voice feedback.</p>
            </div>
            <div className="flex gap-2">
              {['technical', 'viva', 'behavioral'].map((cat) => (
                <button
                  key={cat}
                  onClick={() => {
                    sound.click();
                    setCategory(cat);
                    setCurrentQIndex(0);
                    setUserAnswer('');
                    setEvalResult(null);
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all ${
                    category === cat
                      ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-bold'
                      : 'bg-vortex-card border border-vortex-border text-slate-400'
                  }`}
                >
                  {cat === 'viva' ? '🎓 College Viva' : cat === 'technical' ? '💻 Technical' : '💼 Behavioral'}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Left 7 Cols: Question & Voice Answer Simulator */}
            <div className="lg:col-span-7 space-y-6">
              <div className="p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-mono text-cyan-400 uppercase">
                    Question {currentQIndex + 1} of {currentQuestions.length}
                  </span>
                  <button
                    onClick={readQuestionAloud}
                    className="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-cyan-500/10 text-cyan-300 hover:bg-cyan-500/20 text-xs font-mono transition-all"
                  >
                    <span>🔊 Read Question Aloud</span>
                  </button>
                </div>

                <h3 className="text-lg font-bold text-white leading-relaxed">
                  "{question.q}"
                </h3>

                {/* Answer Box */}
                <div className="space-y-2 pt-2">
                  <div className="flex items-center justify-between text-xs text-slate-400">
                    <span>Your Spoken or Typed Response:</span>
                    <button
                      type="button"
                      onClick={toggleVoiceDictation}
                      className={`px-3 py-1 rounded-full text-xs font-mono flex items-center gap-1.5 transition-all ${
                        isListening
                          ? 'bg-rose-500 text-white animate-pulse'
                          : 'bg-vortex-surface border border-vortex-border text-cyan-400 hover:border-cyan-400'
                      }`}
                    >
                      <span>🎙️</span>
                      <span>{isListening ? 'Listening...' : 'Voice Dictate'}</span>
                    </button>
                  </div>

                  <textarea
                    rows="5"
                    value={userAnswer}
                    onChange={(e) => setUserAnswer(e.target.value)}
                    placeholder="Type or speak your answer here using the STAR methodology (Situation, Task, Action, Result)..."
                    className="w-full p-4 rounded-xl bg-vortex-surface border border-vortex-border text-xs text-white focus:outline-none focus:border-cyan-400 leading-relaxed font-sans"
                  ></textarea>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <button
                    onClick={() => {
                      sound.click();
                      setCurrentQIndex(prev => (prev + 1) % currentQuestions.length);
                      setUserAnswer('');
                      setEvalResult(null);
                    }}
                    className="px-4 py-2 rounded-xl bg-vortex-surface border border-vortex-border text-slate-300 hover:text-white text-xs font-medium"
                  >
                    Next Question ❯
                  </button>

                  <button
                    onClick={evaluateAnswer}
                    disabled={isEvaluating}
                    className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-bold text-xs shadow-lg hover:shadow-cyan-500/20 transition-all flex items-center gap-2"
                  >
                    <span>{isEvaluating ? 'Analyzing Speech...' : '⚡ Submit for AI Evaluation'}</span>
                  </button>
                </div>
              </div>

              {/* AI Evaluation Scorecard */}
              {evalResult && (
                <div className="p-6 rounded-2xl bg-vortex-card border border-cyan-500/40 space-y-4 animate-fadeIn">
                  <div className="flex items-center justify-between pb-3 border-b border-vortex-border">
                    <div>
                      <span className="text-[10px] font-mono text-cyan-400 uppercase">AI Speech Evaluation</span>
                      <h4 className="font-bold text-base text-white">Score: {evalResult.score}/100</h4>
                    </div>
                    <div className="text-right">
                      <span className="text-xs font-mono font-bold text-emerald-400">{evalResult.clarity}</span>
                      <div className="text-[10px] text-slate-400">STAR Adherence: {evalResult.starScore}</div>
                    </div>
                  </div>

                  <p className="text-xs text-slate-200 leading-relaxed">{evalResult.feedback}</p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div className="p-3 rounded-xl bg-emerald-950/20 border border-emerald-500/30 text-xs space-y-1">
                      <span className="font-bold text-emerald-400">Key Strengths:</span>
                      {evalResult.strengths.map((s, idx) => (
                        <div key={idx} className="text-slate-300">• {s}</div>
                      ))}
                    </div>
                    <div className="p-3 rounded-xl bg-amber-950/20 border border-amber-500/30 text-xs space-y-1">
                      <span className="font-bold text-amber-400">Actionable Polish:</span>
                      {evalResult.improvements.map((imp, idx) => (
                        <div key={idx} className="text-slate-300">• {imp}</div>
                      ))}
                    </div>
                  </div>

                  <div className="p-3.5 rounded-xl bg-vortex-surface/80 border border-vortex-border text-xs space-y-1">
                    <span className="font-bold text-cyan-300">Ideal Benchmark Answer:</span>
                    <p className="text-slate-300 leading-relaxed italic">{question.ideal}</p>
                  </div>
                </div>
              )}
            </div>

            {/* Right 5 Cols: College Project Viva & Public Speaking Rules */}
            <div className="lg:col-span-5 space-y-5">
              <div className="p-5 rounded-2xl bg-vortex-card border border-vortex-border space-y-3">
                <h3 className="font-display font-bold text-sm text-white flex items-center gap-2">
                  <span>🎓</span>
                  <span>College Project Viva Defense Secrets</span>
                </h3>
                <div className="space-y-2 text-xs text-slate-300 leading-relaxed">
                  <div className="p-2.5 rounded-xl bg-vortex-surface border border-vortex-border">
                    <strong className="text-cyan-400">Rule 1: Never Argue with the Examiner:</strong> If they claim an alternative is better, say: <em>"That is an insightful perspective; we considered that and chose our architecture for [Reason], but in future iterations we can benchmark that approach."</em>
                  </div>
                  <div className="p-2.5 rounded-xl bg-vortex-surface border border-vortex-border">
                    <strong className="text-purple-400">Rule 2: Know Your Architecture Diagram:</strong> Be able to draw every block, database table, and API payload on a whiteboard without looking at slides.
                  </div>
                  <div className="p-2.5 rounded-xl bg-vortex-surface border border-vortex-border">
                    <strong className="text-emerald-400">Rule 3: State Limitations First:</strong> Mentioning limitations voluntarily portrays maturity and prevents examiners from cornering you.
                  </div>
                </div>
              </div>

              {/* Presentation & Stage Mastery */}
              <div className="p-5 rounded-2xl bg-vortex-card border border-vortex-border space-y-3">
                <h3 className="font-display font-bold text-sm text-white flex items-center gap-2">
                  <span>🎤</span>
                  <span>The 10/20/30 Presentation Rule</span>
                </h3>
                <div className="space-y-2 text-xs text-slate-300">
                  <p>When presenting your hackathon project or pitch to judges:</p>
                  <ul className="space-y-1.5 pl-2">
                    <li><strong className="text-cyan-400">10 Slides Max:</strong> Problem → Solution → Architecture → Live Demo → Market Traction → Team.</li>
                    <li><strong className="text-indigo-400">20 Minutes Max:</strong> Keep verbal pitch under 5-7 minutes, leaving 10+ minutes for live demo and Q&A.</li>
                    <li><strong className="text-amber-400">30pt Font Minimum:</strong> Prevent text overcrowding. Use bold metrics and visual diagrams.</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

      return (
        <div className="space-y-8 animate-fadeIn">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-vortex-border">
            <div>
              <div className="flex items-center gap-2 text-xs font-mono text-cyan-400 mb-1">
                <span>CAREER LONGEVITY PLAYBOOK</span>
                <span>•</span>
                <span>Module 07</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-display font-extrabold text-white">How to Get Hired & Keep Your Job Secured</h1>
              <p className="text-xs text-slate-300">Overcome the market's toughest dilemma: breaking in as a fresher and becoming completely irreplaceable.</p>
            </div>
          </div>

          {/* Part 1: How to Get Hired */}
          <div className="p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
            <h3 className="font-display font-bold text-lg text-white flex items-center gap-2">
              <span className="text-cyan-400">Phase 1:</span>
              <span>The Fresher Hiring Playbook (Bypassing the 5,000 ATS Wall)</span>
            </h3>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div className="p-4 rounded-xl bg-vortex-surface/80 border border-vortex-border space-y-2">
                <span className="font-bold text-cyan-300">1. Proof of Work Over Resumes</span>
                <p className="text-slate-300 leading-relaxed">
                  Instead of sending 200 blank applications, build 1 hyper-relevant prototype for your target company. Send a 45-second Loom video demo directly to the VP of Engineering or Tech Lead on LinkedIn.
                </p>
              </div>
              <div className="p-4 rounded-xl bg-vortex-surface/80 border border-vortex-border space-y-2">
                <span className="font-bold text-purple-300">2. The 40% Cold Outreach Script</span>
                <p className="text-slate-300 leading-relaxed">
                  "Hi [Name], loved your recent release of [Feature]. I built an open-source tool solving [Pain Point] with [Stack]. Would love 5 minutes of your feedback." (Zero begging, 100% engineering respect).
                </p>
              </div>
              <div className="p-4 rounded-xl bg-vortex-surface/80 border border-vortex-border space-y-2">
                <span className="font-bold text-emerald-300">3. Open Source PR Proof</span>
                <p className="text-slate-300 leading-relaxed">
                  Merge 2 PRs into well-known open-source repositories (e.g., Supabase, Next.js, LangChain docs). This single credential beats 90% of college certifications.
                </p>
              </div>
            </div>
          </div>

          {/* Part 2: How to Keep Your Job Secured */}
          <div className="p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
            <h3 className="font-display font-bold text-lg text-white flex items-center gap-2">
              <span className="text-amber-400">Phase 2:</span>
              <span>Job Security & Anti-Layoff Architecture</span>
            </h3>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div className="p-4 rounded-xl bg-vortex-surface/80 border border-vortex-border space-y-2">
                <span className="font-bold text-amber-300">1. Revenue Alignment</span>
                <p className="text-slate-300 leading-relaxed">
                  Never remain in isolated internal experimental tools that generate no revenue. Move toward core checkout, monetization, or core platform pipelines that directly affect company cash flow.

    // =========================================================================
    // 9. FUN QUIZ TAB: Discover Developer Superpower (Gamification)
    // =========================================================================
    function QuizTab({ gainXp, sound }) {
      const [currentQ, setCurrentQ] = useState(0);
      const [scores, setScores] = useState({ ai: 0, fullstack: 0, devops: 0, data: 0 });
      const [result, setResult] = useState(null);

      const questions = [
        {
          q: "When an unexpected bug crashes production at 11 PM, what is your immediate instinct?",
          options: [
            { text: "Fire up the terminal, inspect Docker logs, and trace memory leaks.", trait: "devops" },
            { text: "Inspect React component state and network API payloads.", trait: "fullstack" },
            { text: "Analyze input token embeddings and loss function anomalies.", trait: "ai" },
            { text: "Query database transaction logs with complex SQL joins.", trait: "data" }
          ]
        },
        {
          q: "What kind of project excites you most to build over a 36-hour hackathon weekend?",
          options: [
            { text: "An autonomous agent that plans and executes complex multi-step tasks.", trait: "ai" },
            { text: "A sleek, animated SaaS web app with high-speed microservices.", trait: "fullstack" },
            { text: "A resilient auto-scaling Kubernetes cluster deployed on AWS.", trait: "devops" },
            { text: "A real-time predictive financial intelligence dashboard.", trait: "data" }
          ]
        },
        {
          q: "Which superpower would you choose in your engineering career?",
          options: [
            { text: "Instantly architecting distributed systems with 99.999% uptime.", trait: "devops" },
            { text: "Creating neural models that reason better than humans.", trait: "ai" },
            { text: "Writing blazing-fast full-stack code that turns ideas into reality in hours.", trait: "fullstack" },
            { text: "Finding hidden business millions inside messy unstructured data.", trait: "data" }
          ]
        }
      ];

      const selectOption = (trait) => {
        sound.click();
        const updated = { ...scores, [trait]: scores[trait] + 1 };
        setScores(updated);

        if (currentQ + 1 < questions.length) {
          setCurrentQ(currentQ + 1);
        } else {
          // Compute result
          let highest = 'ai';
          let maxVal = -1;
          for (const key in updated) {
            if (updated[key] > maxVal) {
              maxVal = updated[key];
              highest = key;
            }
          }

          const archetypes = {
            ai: { title: "The Neural Architect", icon: "🧠", color: "text-purple-400", desc: "You thrive on the bleeding edge of AI models, transformers, and autonomous agentic workflows." },
            fullstack: { title: "The Product Wizard", icon: "⚡", color: "text-cyan-400", desc: "You possess the supreme ability to craft beautiful interfaces and back them with rock-solid server architectures." },
            devops: { title: "The Infrastructure Titan", icon: "🛡️", color: "text-emerald-400", desc: "You are the guardian of uptime, container orchestration, and zero-downtime high-availability systems." },
            data: { title: "The Data Oracle", icon: "📊", color: "text-amber-400", desc: "You extract profound insights and predictive gold from vast oceans of complex data." }
          };

          setResult(archetypes[highest]);
          gainXp(150, "Discovered Engineering Superpower");
          sound.success();
        }
      };

      const restart = () => {
        sound.click();
        setCurrentQ(0);
        setScores({ ai: 0, fullstack: 0, devops: 0, data: 0 });
        setResult(null);
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6 py-6 animate-fadeIn text-center">
          <div className="space-y-2">
            <span className="text-xs font-mono text-cyan-400 uppercase">Interactive Gamification</span>
            <h1 className="text-2xl sm:text-3xl font-display font-extrabold text-white">Discover Your Developer Superpower</h1>
            <p className="text-xs text-slate-300">Answer 3 fun situational questions to unveil your core engineering archetype and claim +150 Vortex XP.</p>
          </div>

          {!result ? (
            <div className="p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-6 text-left">
              <div className="flex items-center justify-between text-xs font-mono text-slate-400">
                <span>QUESTION {currentQ + 1} OF {questions.length}</span>
                <span>{Math.round(((currentQ) / questions.length) * 100)}% Complete</span>
              </div>

              <h3 className="font-bold text-base text-white">{questions[currentQ].q}</h3>

              <div className="space-y-3">
                {questions[currentQ].options.map((opt, idx) => (
                  <button
                    key={idx}
                    onClick={() => selectOption(opt.trait)}
                    className="w-full p-4 rounded-xl bg-vortex-surface border border-vortex-border hover:border-cyan-400 hover:bg-slate-800 text-left text-xs text-slate-200 transition-all flex items-center justify-between group"
                  >
                    <span>{opt.text}</span>
                    <span className="text-cyan-400 font-bold opacity-0 group-hover:opacity-100 transition-opacity">Select ❯</span>
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <div className="p-8 rounded-2xl bg-vortex-card border border-cyan-500/40 space-y-6 animate-fadeIn">
              <div className="text-6xl">{result.icon}</div>
              <div className="space-y-2">
                <span className="text-xs font-mono text-cyan-400 uppercase">Your Engineering Archetype</span>
                <h2 className={`text-3xl font-display font-extrabold ${result.color}`}>{result.title}</h2>
                <p className="text-sm text-slate-200 max-w-md mx-auto">{result.desc}</p>
              </div>

              <div className="p-4 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-xs font-mono text-cyan-300 inline-block">
                🏆 +150 XP Awarded to your Tech Vortex Profile!
              </div>

              <div>
                <button
                  onClick={restart}
                  className="px-6 py-2.5 rounded-xl bg-vortex-surface border border-vortex-border text-xs text-slate-300 hover:text-white"
                >
                  Retake Quiz 🔄
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render Root Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
