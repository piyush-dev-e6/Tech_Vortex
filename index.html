                })}
              </ol></details>)}</div>;
              })()}
            </section>

            <section id="roadmap-skill-details" aria-labelledby="selected-roadmap-skill" className="min-w-0 scroll-mt-6 rounded-2xl border border-vortex-border bg-vortex-card p-5 sm:p-6">
              {selectedItem ? <>
                <div className="flex flex-wrap items-start justify-between gap-3"><div><p className="text-[10px] font-semibold uppercase tracking-[0.14em] text-cyan-300">Selected skill</p><h2 id="selected-roadmap-skill" className="mt-1 break-words text-xl font-semibold text-white">{selectedItem.skill}</h2></div><span className={`rounded-full border px-3 py-1 text-xs ${selectedItem.status === 'completed' ? 'border-emerald-500/30 text-emerald-200' : selectedItem.id === recommendedItem?.id ? 'border-cyan-500/30 text-cyan-100' : 'border-slate-700 text-slate-300'}`}>{selectedItem.status === 'completed' ? 'Completed' : selectedItem.id === recommendedItem?.id ? 'Current step' : 'Upcoming'}</span></div>
                <div className="mt-5 border-t border-slate-800 pt-4"><h3 className="text-xs font-semibold uppercase tracking-wide text-slate-300">Why learn this?</h3><p className="mt-2 text-sm leading-relaxed text-slate-400">{whyRecommended(selectedItem)}</p></div>
                {mode === 'job' && <div className="mt-4 rounded-lg border border-indigo-500/20 bg-indigo-500/5 p-3"><p className="text-xs font-medium text-indigo-100">{selectedItem.sources?.includes('job') ? `Job requirement · ${selectedItem.importance || 'medium'} importance` : 'Learning prerequisite · from the configured skill dependency catalogue'}</p><p className="mt-1 text-xs text-slate-300">Current status: {selectedItem.currentStatus || 'gap'}</p>{selectedItem.requirementEvidence?.length > 0 && <p className="mt-2 text-xs leading-relaxed text-slate-400">Job evidence: {selectedItem.requirementEvidence.join(' · ')}</p>}</div>}
                {selectedItem.isConfirmed ? <p className="mt-4 rounded-lg bg-emerald-500/5 p-3 text-sm text-emerald-100">You’ve confirmed this skill in your profile. It counts as completed in this path.</p> : selectedItem.status === 'completed' ? <p className="mt-4 rounded-lg bg-emerald-500/5 p-3 text-sm text-emerald-100">You marked the skill check complete in your learning path.</p> : <>
                  {selectedItem.prerequisites?.length > 0 && <p className="mt-4 rounded-lg border border-slate-800 bg-slate-950/30 p-3 text-sm text-slate-300">{getBlockedPrerequisites(selectedItem).length ? `Complete ${getBlockedPrerequisites(selectedItem).join(' and ')} first.` : `This step builds on ${selectedItem.prerequisites.join(' and ')}.`}</p>}
                  <div className="mt-5 space-y-3">
                    <section className="rounded-xl border border-slate-800 bg-slate-950/25 p-4"><h3 className="text-sm font-semibold text-white">Learn</h3><p className="mt-1 text-sm leading-relaxed text-slate-400">{selectedItem.learning?.guidance || 'Use the resources below to get started.'}</p>
                      {(selectedItem.officialDocumentationUrls?.length > 0 || selectedItem.officialDocumentationUrl) && <div className="mt-3"><p className="text-[10px] font-medium uppercase tracking-wide text-slate-500">Official tutorial</p><a href={selectedItem.officialDocumentationUrls?.[0] || selectedItem.officialDocumentationUrl} target="_blank" rel="noopener noreferrer" className="mt-1 inline-flex min-h-10 items-center text-sm text-cyan-300 underline underline-offset-2">Open documentation <span aria-hidden="true" className="ml-1">↗</span></a>{selectedItem.officialDocumentationUrls?.length > 1 && <details className="mt-1 text-xs text-slate-400"><summary className="cursor-pointer">More official guides</summary>{selectedItem.officialDocumentationUrls.slice(1).map(url => <a key={url} href={url} target="_blank" rel="noopener noreferrer" className="mt-2 block break-all text-cyan-300 underline">Open another guide ↗</a>)}</details>}</div>}
                      {selectedItem.youtube?.[0] ? <a href={selectedItem.youtube[0].url} target="_blank" rel="noopener noreferrer" className="mt-3 grid min-w-0 gap-3 overflow-hidden rounded-lg border border-slate-800 sm:grid-cols-[minmax(0,180px)_minmax(0,1fr)]"><img src={selectedItem.youtube[0].thumbnailUrl} alt={`Thumbnail for ${selectedItem.youtube[0].title}`} loading="lazy" className="aspect-video w-full bg-slate-900 object-cover" onError={event => { event.currentTarget.hidden = true; }} /><span className="min-w-0 p-3"><span className="block text-[10px] font-medium uppercase tracking-wide text-slate-500">Recommended video</span><span className="mt-1 block break-words text-sm font-medium text-slate-100">{selectedItem.youtube[0].title}</span><span className="mt-2 block text-xs text-slate-400">{selectedItem.youtube[0].channel || 'YouTube'} · Watch video ↗</span></span></a> : selectedItem.youtubeSearchUrl && <a href={selectedItem.youtubeSearchUrl} target="_blank" rel="noopener noreferrer" className="mt-3 inline-flex min-h-10 items-center text-sm text-cyan-300 underline underline-offset-2">Find a recommended video ↗</a>}
                    </section>
                    <section className="rounded-xl border border-slate-800 bg-slate-950/25 p-4"><h3 className="text-sm font-semibold text-white">Practice</h3><p className="mt-1 text-sm leading-relaxed text-slate-400">{selectedItem.practice?.task || 'Practice with a small exercise related to your target.'}</p></section>
                    <section className="rounded-xl border border-slate-800 bg-slate-950/25 p-4"><h3 className="text-sm font-semibold text-white">Check your work</h3><p className="mt-1 text-sm leading-relaxed text-slate-400">{selectedItem.verification?.task || 'Use a small example to check what you learned.'}</p></section>
                    <div className="grid gap-2 sm:grid-cols-3">{[['learning', 'Learn'], ['practice', 'Practice'], ['verification', 'Skill check']].map(([activity, label]) => { const status = selectedItem[activity]?.status || 'not_started'; const blockedBy = getBlockedPrerequisites(selectedItem); const blocked = blockedBy.length > 0 || (activity === 'practice' && selectedItem.learning?.status !== 'completed') || (activity === 'verification' && selectedItem.practice?.status !== 'completed') || (roadmap.catalogueTrackId && activity === 'practice' && !selectedItem.practice?.task) || (roadmap.catalogueTrackId && activity === 'verification' && !selectedItem.verification?.task); const buttonLabel = status === 'not_started' ? `Start ${label.toLowerCase()}` : status === 'in_progress' ? 'Mark complete' : 'Reset'; return <div key={activity} className="rounded-lg border border-slate-800 bg-slate-900/50 p-3"><p className="text-xs font-medium text-slate-200">{label}</p><p className="mt-1 text-xs text-slate-400">{activityLabel(status)}</p><button type="button" disabled={blocked} onClick={() => onActivity(selectedItem, activity)} className="mt-3 min-h-10 w-full rounded-lg border border-slate-700 px-2 py-2 text-xs text-slate-100 hover:border-cyan-500/50 disabled:cursor-not-allowed disabled:opacity-40">{buttonLabel}</button></div>; })}</div>
                    <p className="text-xs leading-relaxed text-slate-500">Progress saves to your shared profile. Mark the skill check complete after you’ve done the listed task.</p>
                  </div>
                </>}
              </> : <div><h2 id="selected-roadmap-skill" className="text-lg font-semibold text-white">Choose a skill</h2><p className="mt-2 text-sm text-slate-400">Select a step in your journey to see its learning resources and tasks.</p></div>}
            </section>
          </div>

          {jobItems.length > 0 && <section aria-labelledby="roadmap-job-context" className="rounded-2xl border border-indigo-500/20 bg-indigo-500/5 p-5 sm:p-6"><div><p className="text-[10px] font-semibold uppercase tracking-wide text-indigo-200">Job-aware learning</p><h2 id="roadmap-job-context" className="mt-1 text-base font-semibold text-white">Based on your target job{profile.latestJobMatch?.summary?.title ? ` · ${profile.latestJobMatch.summary.title}` : ''}</h2><p className="mt-1 text-sm text-slate-400">These job requirements are already included in your learning path.</p></div><div className="mt-4 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">{jobItems.slice(0, 3).map(item => <button key={item.id} type="button" onClick={() => scrollToDetails(item)} className="min-h-16 min-w-0 rounded-xl border border-indigo-500/20 bg-slate-950/30 p-3 text-left hover:border-indigo-400/50"><span className="block break-words text-sm font-medium text-white">{item.skill}</span><span className="mt-1 block text-xs text-slate-400">Required by the job you’re targeting · View learning steps</span></button>)}</div></section>}
        </> : mode === 'job' && !loading && !error && jobGaps.length > 0 ? <section role="status" className="rounded-2xl border border-amber-500/25 bg-amber-500/5 p-5 sm:p-6"><h2 className="text-base font-semibold text-white">The job gaps could not be placed on a roadmap</h2><p className="mt-2 text-sm leading-relaxed text-slate-300">Your saved analysis still shows {jobGaps.length} developing or missing requirements. Return to Job Intelligence to review the analysis, then try the roadmap again.</p><button type="button" onClick={onOpenJobAnalysis} className="mt-4 min-h-11 rounded-lg bg-cyan-400 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-cyan-300">Return to Job Intelligence</button></section>
        : !loading && !error ? <section className="rounded-2xl border border-vortex-border bg-vortex-card p-5 sm:p-6"><h2 className="text-base font-semibold text-white">Choose a learning goal</h2><p className="mt-2 text-sm leading-relaxed text-slate-400">Select a target role, add a skill goal, or analyze a job description to build your personalized learning path. You can start without a resume.</p><button type="button" onClick={onChangeGoal} className="mt-4 min-h-11 rounded-lg bg-cyan-400 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-cyan-300">Choose a goal</button></section> : null}
      </div>;
    }

    const WELLNESS_PHASES = ['Inhale', 'Hold', 'Exhale', 'Hold'];

    function BoxBreathing() {
      const [phaseSeconds, setPhaseSeconds] = useState(4);
      const [sessionMinutes, setSessionMinutes] = useState(1);
      const [status, setStatus] = useState('idle');
      const [phaseIndex, setPhaseIndex] = useState(0);
      const [phaseCountdown, setPhaseCountdown] = useState(4);
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [remainingSeconds, setRemainingSeconds] = useState(60);
      const runStartRef = useRef(0);
      const phaseDeadlineRef = useRef(0);
      const phaseRemainingRef = useRef(4000);
      const elapsedBeforeRunRef = useRef(0);
      const phaseRef = useRef(0);
      const totalMs = sessionMinutes * 60 * 1000;

      useEffect(() => {
        if (status !== 'running') return undefined;
        const timer = window.setInterval(() => {
          const now = performance.now();
          const elapsed = Math.min(totalMs, elapsedBeforeRunRef.current + now - runStartRef.current);
          if (elapsed >= totalMs) {
            elapsedBeforeRunRef.current = totalMs;
            setElapsedSeconds(Math.floor(totalMs / 1000));
            setRemainingSeconds(0);
            setPhaseCountdown(0);
            setStatus('completed');
            return;
          }
          while (now >= phaseDeadlineRef.current) {
            phaseRef.current = (phaseRef.current + 1) % WELLNESS_PHASES.length;
            phaseDeadlineRef.current += phaseSeconds * 1000;
          }
          const phaseLeft = Math.max(0, phaseDeadlineRef.current - now);
          phaseRemainingRef.current = phaseLeft;
          setPhaseIndex(phaseRef.current);
          setPhaseCountdown(Math.ceil(phaseLeft / 1000));
          setElapsedSeconds(Math.floor(elapsed / 1000));
          setRemainingSeconds(Math.ceil((totalMs - elapsed) / 1000));
        }, 200);
        return () => window.clearInterval(timer);
      }, [status, totalMs, phaseSeconds]);

      const start = () => {
        if (status === 'paused') {
          runStartRef.current = performance.now();
          phaseDeadlineRef.current = runStartRef.current + phaseRemainingRef.current;
          setStatus('running');
          return;
        }
        const now = performance.now();
        runStartRef.current = now;
        phaseDeadlineRef.current = now + phaseSeconds * 1000;
        phaseRemainingRef.current = phaseSeconds * 1000;
        elapsedBeforeRunRef.current = 0;
        phaseRef.current = 0;
        setPhaseIndex(0);
        setPhaseCountdown(phaseSeconds);
        setElapsedSeconds(0);
        setRemainingSeconds(sessionMinutes * 60);
        setStatus('running');
      };
      const pause = () => {
        const now = performance.now();
        elapsedBeforeRunRef.current = Math.min(totalMs, elapsedBeforeRunRef.current + now - runStartRef.current);
        phaseRemainingRef.current = Math.max(0, phaseDeadlineRef.current - now);
        setStatus('paused');
      };
      const reset = () => {
        elapsedBeforeRunRef.current = 0;
        phaseRemainingRef.current = phaseSeconds * 1000;
        phaseRef.current = 0;
        setStatus('idle');
        setPhaseIndex(0);
        setPhaseCountdown(phaseSeconds);
        setElapsedSeconds(0);
        setRemainingSeconds(sessionMinutes * 60);
      };
      const formatClock = seconds => `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      const canEdit = status === 'idle' || status === 'completed';
      const scale = status === 'idle' || status === 'completed' ? 1 : phaseIndex === 0 ? 1.15 : phaseIndex === 2 ? 0.88 : 1;

      return <section aria-labelledby="breathing-heading" className="grid gap-5 lg:grid-cols-[minmax(0,1fr)_minmax(280px,0.8fr)]">
        <div className="rounded-2xl border border-cyan-500/20 bg-gradient-to-br from-cyan-950/40 to-slate-900/70 p-5 sm:p-7">
          <p className="text-xs font-semibold uppercase tracking-[0.16em] text-cyan-200">Breathing Exercise</p><h2 id="breathing-heading" className="mt-2 text-xl font-semibold text-white">Box breathing</h2><p className="mt-2 max-w-xl text-sm leading-relaxed text-slate-300">Follow four steady phases. Stop at any time if the exercise feels uncomfortable; this is a focus break, not medical treatment.</p>
          <div className="flex min-h-[300px] flex-col items-center justify-center py-6" aria-live="polite" aria-atomic="true">
            <div className={`flex size-52 items-center justify-center rounded-[2rem] border border-cyan-300/40 bg-cyan-400/10 shadow-[0_0_80px_-30px_rgba(34,211,238,.65)] motion-safe:transition-transform motion-safe:ease-in-out ${status === 'running' ? 'motion-safe:duration-1000' : 'duration-200'}`} style={{ transform: `scale(${scale})` }} aria-hidden="true"><div className="flex size-36 flex-col items-center justify-center rounded-full border border-cyan-200/30 bg-slate-950/40"><span className="text-sm font-medium text-cyan-100">{status === 'completed' ? 'Complete' : WELLNESS_PHASES[phaseIndex]}</span><span className="mt-1 font-mono text-4xl font-semibold text-white">{status === 'completed' ? '✓' : phaseCountdown}</span></div></div>
            <p className="mt-5 text-lg font-medium text-white" role="status">{status === 'completed' ? 'Session complete' : status === 'idle' ? 'Ready when you are' : WELLNESS_PHASES[phaseIndex]}</p>
          </div>
          <div className="flex flex-wrap justify-center gap-2">
            {status === 'running' ? <button type="button" onClick={pause} className="min-h-11 rounded-lg bg-cyan-400 px-5 text-sm font-semibold text-slate-950">Pause</button> : <button type="button" onClick={start} className="min-h-11 rounded-lg bg-cyan-400 px-5 text-sm font-semibold text-slate-950">{status === 'paused' ? 'Resume' : status === 'completed' ? 'Start Again' : 'Start'}</button>}
            <button type="button" onClick={reset} className="min-h-11 rounded-lg border border-slate-600 px-5 text-sm text-slate-100 hover:border-slate-400">Reset</button>
          </div>
        </div>
        <aside className="space-y-4 rounded-2xl border border-slate-800 bg-slate-900/50 p-5 sm:p-6">
          <h3 className="text-base font-semibold text-white">Session settings</h3>
          <label className="block text-xs text-slate-300">Each phase<select aria-label="Breathing phase duration" value={phaseSeconds} disabled={!canEdit} onChange={event => { const value = Number(event.target.value); setPhaseSeconds(value); setPhaseCountdown(value); phaseRemainingRef.current = value * 1000; }} className="mt-1.5 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white disabled:opacity-60">{[3, 4, 5].map(value => <option key={value} value={value}>{value} seconds</option>)}</select></label>
          <label className="block text-xs text-slate-300">Session length<select aria-label="Breathing session length" value={sessionMinutes} disabled={!canEdit} onChange={event => { const value = Number(event.target.value); setSessionMinutes(value); setRemainingSeconds(value * 60); }} className="mt-1.5 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white disabled:opacity-60">{[1, 2, 5].map(value => <option key={value} value={value}>{value} minute{value > 1 ? 's' : ''}</option>)}</select></label>
          <div className="grid grid-cols-2 gap-3 rounded-xl border border-slate-800 bg-slate-950/50 p-4"><div><p className="text-[10px] uppercase tracking-wide text-slate-500">Elapsed</p><p className="mt-1 font-mono text-xl text-white">{formatClock(elapsedSeconds)}</p></div><div><p className="text-[10px] uppercase tracking-wide text-slate-500">Session left</p><p className="mt-1 font-mono text-xl text-white">{formatClock(remainingSeconds)}</p></div></div>
          <ol className="space-y-2 text-xs text-slate-300">{WELLNESS_PHASES.map((phase, index) => <li key={`${phase}-${index}`} className={`flex items-center gap-2 rounded-lg p-2 ${phaseIndex === index && status !== 'idle' && status !== 'completed' ? 'bg-cyan-500/10 text-cyan-100' : ''}`}><span className="size-5 rounded-full border border-slate-600 text-center leading-5">{index + 1}</span>{phase} · {phaseSeconds}s</li>)}</ol>
        </aside>
      </section>;
    }

    const MEMORY_SYMBOLS = ['🌙', '🪐', '🌿', '💎', '🧭', '☀️', '🦋', '🎧', '🍀', '🚀'];
    function MemoryPictureGame() {
      const [difficulty, setDifficulty] = useState('easy');
      const [cards, setCards] = useState([]);
      const [selected, setSelected] = useState([]);
      const [moves, setMoves] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const [started, setStarted] = useState(false);
      const [complete, setComplete] = useState(false);
      const [locked, setLocked] = useState(false);
      const mismatchTimer = useRef(null);
      const pairCount = difficulty === 'easy' ? 8 : difficulty === 'medium' ? 6 : 10;
      const matchedPairs = cards.filter(card => card.matched).length / 2;

      const restart = (nextDifficulty = difficulty) => {
        if (mismatchTimer.current) window.clearTimeout(mismatchTimer.current);
        mismatchTimer.current = null;
        const count = nextDifficulty === 'easy' ? 8 : nextDifficulty === 'medium' ? 6 : 10;
        const deck = [...MEMORY_SYMBOLS.slice(0, count), ...MEMORY_SYMBOLS.slice(0, count)].map((symbol, index) => ({ id: `${Date.now()}-${index}-${Math.random().toString(36).slice(2, 6)}`, symbol, matched: false, faceUp: false }));
        for (let index = deck.length - 1; index > 0; index -= 1) { const swap = Math.floor(Math.random() * (index + 1)); [deck[index], deck[swap]] = [deck[swap], deck[index]]; }
        setDifficulty(nextDifficulty);
        setCards(deck);
        setSelected([]);
        setMoves(0);
        setElapsed(0);
        setStarted(false);
        setComplete(false);
        setLocked(false);
      };
      useEffect(() => { restart('easy'); return () => { if (mismatchTimer.current) window.clearTimeout(mismatchTimer.current); }; }, []);
      useEffect(() => {
        if (!started || complete) return undefined;
        const timer = window.setInterval(() => setElapsed(Math.floor((Date.now() - started) / 1000)), 1000);
        return () => window.clearInterval(timer);
      }, [started, complete]);

      const flip = index => {
        if (locked || complete || cards[index]?.matched || cards[index]?.faceUp || selected.length >= 2) return;
        if (!started) setStarted(Date.now());
        const nextCards = cards.map((card, current) => current === index ? { ...card, faceUp: true } : card);
        const nextSelected = [...selected, index];
        setCards(nextCards);
        setSelected(nextSelected);
        if (nextSelected.length !== 2) return;
        setMoves(value => value + 1);
        const [first, second] = nextSelected;
        if (nextCards[first].symbol === nextCards[second].symbol) {
          const matched = nextCards.map((card, current) => current === first || current === second ? { ...card, matched: true } : card);
          setCards(matched);
          setSelected([]);
          if (matched.every(card => card.matched)) setComplete(true);
        } else {
          setLocked(true);
          mismatchTimer.current = window.setTimeout(() => {
            setCards(current => current.map((card, cardIndex) => cardIndex === first || cardIndex === second ? { ...card, faceUp: false } : card));
            setSelected([]);
            setLocked(false);
            mismatchTimer.current = null;
          }, 800);
        }
      };
      const elapsedLabel = `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;

      return <section aria-labelledby="memory-heading" className="rounded-2xl border border-violet-500/20 bg-gradient-to-br from-violet-950/25 to-slate-900/70 p-5 sm:p-7">
        <div className="flex flex-wrap items-start justify-between gap-3"><div><p className="text-xs font-semibold uppercase tracking-[0.16em] text-violet-200">Memory Game</p><h2 id="memory-heading" className="mt-2 text-xl font-semibold text-white">Picture pairs</h2><p className="mt-2 text-sm text-slate-300">A quick visual reset between learning sessions.</p></div><button type="button" onClick={() => restart()} className="min-h-10 rounded-lg border border-violet-300/30 px-4 text-sm text-violet-100 hover:bg-violet-400/10">Restart game</button></div>
        <div className="mt-5 flex flex-wrap items-end gap-3"><label className="text-xs text-slate-300">Difficulty<select value={difficulty} onChange={event => restart(event.target.value)} className="mt-1 block rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white">{[['easy', 'Easy · 8 pairs'], ['medium', 'Medium · 6 pairs'], ['hard', 'Hard · 10 pairs']].map(([value, label]) => <option key={value} value={value}>{label}</option>)}</select></label><div className="flex flex-wrap gap-4 rounded-lg border border-slate-800 bg-slate-950/40 px-4 py-2"><span className="text-xs text-slate-300">Moves <strong className="ml-1 text-white">{moves}</strong></span><span className="text-xs text-slate-300">Pairs <strong className="ml-1 text-white">{matchedPairs}/{pairCount}</strong></span><span className="text-xs text-slate-300">Time <strong className="ml-1 font-mono text-white">{elapsedLabel}</strong></span></div></div>
        <div className={`mx-auto mt-5 grid max-w-3xl grid-cols-3 gap-2 sm:grid-cols-4 ${difficulty === 'hard' ? 'md:grid-cols-5' : ''}`} role="group" aria-label={`${difficulty} picture matching game, ${pairCount} pairs`}>
          {cards.map((card, index) => { const visible = card.faceUp || card.matched; return <button key={card.id} type="button" aria-pressed={visible} aria-label={card.matched ? `Card ${index + 1}, matched ${card.symbol}` : visible ? `Card ${index + 1}, ${card.symbol}, revealed` : `Card ${index + 1}, face down`} onClick={() => flip(index)} className={`aspect-square min-h-16 rounded-xl border text-3xl transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-300 sm:text-4xl ${card.matched ? 'border-emerald-400/40 bg-emerald-500/10' : visible ? 'border-violet-300/50 bg-violet-500/15' : 'border-slate-700 bg-slate-950/70 hover:border-violet-400/40'}`}>{visible ? card.symbol : <span aria-hidden="true" className="text-lg text-slate-500">✦</span>}</button>; })}
        </div>
        <p className="mt-4 min-h-6 text-center text-sm text-violet-100" role="status" aria-live="polite">{complete ? `All ${pairCount} pairs found in ${moves} moves and ${elapsedLabel}.` : `Find ${pairCount} matching pairs. Moves count after each two-card turn.`}</p>
      </section>;
    }

    function localDateKey(date = new Date()) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    function formatRoutineDate(value) {
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }
    const DEFAULT_ROUTINE = { preferences: { availableMinutes: 90, startTime: '18:00', preferredDays: [1, 2, 3, 4, 5], sessionMinutes: 25, breakMinutes: 10, includeManualTasks: true, sourceMode: 'auto', selectedSkill: '' }, manualTasks: [], sessionStates: {} };
    const cloneRoutine = routine => ({ preferences: { ...DEFAULT_ROUTINE.preferences, ...(routine?.preferences || {}) }, manualTasks: Array.isArray(routine?.manualTasks) ? routine.manualTasks : [], sessionStates: routine?.sessionStates && typeof routine.sessionStates === 'object' ? routine.sessionStates : {} });

    function WellnessHub({ profile, setProfile, saveProfile, preferredRoadmapMode, preferredRoadmapSkill, preferredCareerId, openLearningPlan, openJobIntelligence }) {
      const [section, setSection] = useState('routine');
      const routine = cloneRoutine(profile.wellnessRoutine);
      const [preferenceDraft, setPreferenceDraft] = useState(routine.preferences);
      const [plan, setPlan] = useState(null);
      const [planLoading, setPlanLoading] = useState(false);
      const [planError, setPlanError] = useState('');
      const [retryPlan, setRetryPlan] = useState(0);
      const [saveError, setSaveError] = useState('');
      const [saving, setSaving] = useState(false);
      const [manualDraft, setManualDraft] = useState(null);
      const [editingTaskId, setEditingTaskId] = useState('');
      const [notice, setNotice] = useState('');
      const profileRef = useRef(profile);
      const saveQueueRef = useRef(Promise.resolve());
      profileRef.current = profile;
      const today = localDateKey();
      const normalizedGoals = [...new Map((Array.isArray(profile.skillGoals) ? profile.skillGoals : []).map(goal => {
        const canonical = canonicalSkillName(goal?.canonical || goal?.canonicalSkill || goal?.skill || goal?.display);
        return [canonical, { ...goal, canonical }];
      }).filter(([canonical]) => canonical)).values()];
      const requestedMode = preferenceDraft.sourceMode || 'auto';
      const inferredMode = preferredRoadmapMode && preferredRoadmapMode !== 'choose' ? preferredRoadmapMode
        : profile.latestJobMatch?.requirements?.length ? 'job'
          : preferredCareerId || profile.targetCareer ? 'career' : normalizedGoals.length ? 'skill' : 'none';
      const mode = requestedMode === 'auto' ? inferredMode : requestedMode;
      const selectedSkill = preferredRoadmapSkill || preferenceDraft.selectedSkill || normalizedGoals[0]?.canonical || '';
      const profileInputs = JSON.stringify({ skills: profile.skills, skillGoals: profile.skillGoals, targetCareer: profile.targetCareer, latestJobMatch: profile.latestJobMatch, roadmapProgress: profile.roadmapProgress });
      const routineInputs = JSON.stringify(routine);

      const persistRoutine = nextRoutine => {
        const nextProfile = { ...profileRef.current, wellnessRoutine: nextRoutine };
        profileRef.current = nextProfile;
        setProfile(nextProfile);
        setSaving(true);
        setSaveError('');
        const operation = saveQueueRef.current.catch(() => {}).then(async () => {
          const currentProfile = profileRef.current;
          const saved = await saveProfile(currentProfile);
          profileRef.current = { ...profileRef.current, ...saved };
          setProfile(profileRef.current);
          return saved;
        });
        saveQueueRef.current = operation;
        return operation.catch(error => { setSaveError(`Your changes are kept in this browser but could not sync: ${error.message}`); throw error; }).finally(() => setSaving(false));
      };

      useEffect(() => {
        setPreferenceDraft({ ...DEFAULT_ROUTINE.preferences, ...(profile.wellnessRoutine?.preferences || {}) });
      }, [profile.wellnessRoutine?.preferences?.availableMinutes, profile.wellnessRoutine?.preferences?.startTime, profile.wellnessRoutine?.preferences?.sessionMinutes, profile.wellnessRoutine?.preferences?.breakMinutes, profile.wellnessRoutine?.preferences?.sourceMode]);

      useEffect(() => {
        const controller = new AbortController();
        let active = true;
        setPlan(null);
        setPlanLoading(true);
        setPlanError('');
        fetch('/api/wellness/routine/plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile, mode, selectedSkill, asOfDate: today }), signal: controller.signal })
          .then(async response => { const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || `Routine could not load (${response.status}).`); return data; })
          .then(data => {
            if (!active) return;
            setPlan(data);
            setNotice(current => current === 'Routine preferences saved. Recalculating the schedule…' ? 'Routine preferences saved and the schedule is ready.' : current);
            const savedStates = routine.sessionStates || {};
            if (JSON.stringify(data.sessionStates || {}) !== JSON.stringify(savedStates)) {
              const next = { ...routine, sessionStates: data.sessionStates || {} };
              persistRoutine(next).then(() => setNotice('Your upcoming learning sessions are synced with your current learning path.')).catch(() => {});
            }
          })
          .catch(error => { if (active && error.name !== 'AbortError') setPlanError(error.message); })
          .finally(() => { if (active) setPlanLoading(false); });
        return () => { active = false; controller.abort(); };
      }, [mode, selectedSkill, today, profileInputs, routineInputs, retryPlan]);

      const savePreferences = async event => {
        event.preventDefault();
        try { await persistRoutine({ ...routine, preferences: { ...preferenceDraft, preferredDays: [...new Set(preferenceDraft.preferredDays)].sort() } }); setNotice('Routine preferences saved. Recalculating the schedule…'); }
        catch {}
      };
      const updateSession = async (task, status) => {
        const timestamp = new Date().toISOString();
        const oldState = routine.sessionStates?.[task.id] || {};
        const sessionStates = { ...routine.sessionStates, [task.id]: { ...oldState, id: task.id, status, title: task.title, skill: task.skill, canonicalSkill: task.canonicalSkill, activity: task.activity, source: task.source, target: task.target, date: task.date, time: task.time, updatedAt: timestamp, completedAt: status === 'completed' ? timestamp : null } };
        const roadmapProgress = { ...(profileRef.current.roadmapProgress || {}) };
        const activityKey = `${task.activity}Status`;
        const previousProgress = roadmapProgress[task.roadmapItemId] || {};
        // A finished scheduled session is not itself verification evidence.
        // Keep the roadmap's verification state pending until its own check flow records it.
        if (status === 'upcoming' || status === 'in_progress' || (status === 'completed' && task.activity !== 'verification')) {

        }
        const nextProfile = { ...profileRef.current, roadmapProgress, wellnessRoutine: { ...routine, sessionStates } };
        profileRef.current = nextProfile;
        setProfile(nextProfile);
        try { const saved = await saveProfile(nextProfile); profileRef.current = { ...profileRef.current, ...saved }; setProfile(profileRef.current); setNotice(status === 'completed' ? `${task.title} session completed. This does not confirm the skill.` : status === 'skipped' ? 'Session skipped; completed history remains saved.' : 'Learning session updated.'); }
        catch (error) { setSaveError(`The session is kept locally but could not sync: ${error.message}`); }
      };
      const updateManual = async (taskId, patch) => {
        const manualTasks = routine.manualTasks.map(task => task.id === taskId ? { ...task, ...patch, updatedAt: new Date().toISOString(), ...(patch.status === 'completed' ? { completedAt: new Date().toISOString() } : patch.status ? { completedAt: null } : {}) } : task);
        try { await persistRoutine({ ...routine, manualTasks }); setNotice('Manual task saved.'); } catch {}
      };
      const saveManual = async event => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const title = String(form.get('title') || '').trim();
        if (!title) return;
        const existing = routine.manualTasks.find(task => task.id === editingTaskId);
        const task = {
          ...(existing || {}), id: existing?.id || `manual:${window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`}`,
          title, description: String(form.get('description') || '').trim(), category: String(form.get('category') || 'Study'),
          date: String(form.get('date') || today), startTime: String(form.get('startTime') || ''), durationMinutes: Number(form.get('durationMinutes') || 30),
          priority: String(form.get('priority') || 'medium'), notes: String(form.get('notes') || '').trim(), status: existing?.status === 'completed' ? 'completed' : 'upcoming',
          createdAt: existing?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString()
        };
        const manualTasks = existing ? routine.manualTasks.map(item => item.id === existing.id ? task : item) : [...routine.manualTasks, task];
        setManualDraft(null); setEditingTaskId('');
        try { await persistRoutine({ ...routine, manualTasks }); setNotice(existing ? 'Manual task updated.' : 'Manual task added.'); } catch {}
      };
      const beginEdit = task => { setEditingTaskId(task.id); setManualDraft(task); document.getElementById('wellness-manual-task-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      const dayNames = [['Mon', 1], ['Tue', 2], ['Wed', 3], ['Thu', 4], ['Fri', 5], ['Sat', 6], ['Sun', 0]];
      const plannedToday = [ ...(plan?.todayTasks || []), ...(routine.preferences.includeManualTasks ? routine.manualTasks.filter(task => task.date === today && task.status !== 'skipped') : []) ].sort((a, b) => String(a.time || a.startTime || '99:99').localeCompare(String(b.time || b.startTime || '99:99')));
      const completedToday = plannedToday.filter(task => task.status === 'completed').length;
      const manualUpcoming = routine.manualTasks.filter(task => task.status !== 'completed' && task.status !== 'skipped' && task.date >= today);
      const completedTasks = [ ...routine.manualTasks.filter(task => task.status === 'completed').map(task => ({ ...task, source: 'Manual' })), ...(plan?.sessionHistory || []).filter(task => task.status === 'completed').map(task => ({ ...task, source: 'Learning' })) ].sort((a, b) => String(b.completedAt || '').localeCompare(String(a.completedAt || ''))).slice(0, 30);
      const skippedTasks = [ ...routine.manualTasks.filter(task => task.status === 'skipped').map(task => ({ ...task, source: 'Manual' })), ...(plan?.sessionHistory || []).filter(task => task.status === 'skipped').map(task => ({ ...task, source: 'Learning' })) ].slice(0, 20);
      const resumeRoadmap = () => {
        if (mode === 'job') openLearningPlan('', '', 'job');
        else if (mode === 'career') openLearningPlan(preferredCareerId || profile.targetCareer || '', '', 'career');
        else if (mode === 'skill') openLearningPlan('', selectedSkill, 'skill');
        else openLearningPlan();
      };
      const generatedCard = task => <article key={task.id} className="rounded-xl border border-cyan-500/20 bg-slate-950/40 p-4"><div className="flex flex-wrap items-start justify-between gap-3"><div className="min-w-0"><p className="text-sm font-semibold text-white">{task.title}</p><p className="mt-1 text-xs text-slate-400">{task.skill} · {task.source === 'job-gap' ? 'Job Gap' : task.source === 'skill-goal' ? 'Skill Goal' : task.source === 'career-roadmap' ? 'Career Roadmap' : 'Prerequisite'} · {task.importance} importance</p><p className="mt-1 text-xs text-cyan-100">{formatRoutineDate(task.date)}{task.time ? ` · ${task.time}` : ''} · {task.durationLabel || `Estimated · ${task.durationMinutes} min`} · {task.status.replace('_', ' ')}</p><p className="mt-2 text-xs leading-relaxed text-slate-400">{task.reason}</p></div><span className="rounded-full border border-cyan-500/25 px-2.5 py-1 text-[10px] capitalize text-cyan-100">{task.status.replace('_', ' ')}</span></div><details className="mt-3 rounded-lg border border-slate-800 bg-slate-900/50 p-3"><summary className="cursor-pointer text-xs font-medium text-slate-200">Learning resource, practice & skill check</summary><div className="mt-3 space-y-3 text-xs text-slate-400"><p><strong className="text-slate-200">Learn:</strong> {task.learning?.guidance || 'Use the linked documentation to study this topic.'}</p>{task.officialDocumentationUrls?.length ? <div><strong className="text-slate-200">Official resources:</strong>{task.officialDocumentationUrls.map(url => <a key={url} href={url} target="_blank" rel="noopener noreferrer" className="mt-1 block break-all text-cyan-300 underline">{url}</a>)}</div> : task.officialDocumentationUrl && <a href={task.officialDocumentationUrl} target="_blank" rel="noopener noreferrer" className="break-all text-cyan-300 underline">Official documentation ↗</a>}{task.youtubeSearchUrl && <a href={task.youtubeSearchUrl} target="_blank" rel="noopener noreferrer" className="block text-cyan-300 underline">Search learning videos ↗</a>}<p><strong className="text-slate-200">Practice:</strong> {task.practice?.task || 'Complete a focused practice example related to this skill.'}</p><p><strong className="text-slate-200">Verification:</strong> {task.verification?.task || 'Record a repeatable check of the expected result.'}</p></div></details><div className="mt-3 flex flex-wrap gap-2"><button type="button" onClick={resumeRoadmap} className="min-h-9 rounded-lg border border-slate-700 px-3 text-xs text-slate-200 hover:border-cyan-400/40">Open learning path</button>{task.status === 'upcoming' ? <button type="button" onClick={() => updateSession(task, 'in_progress')} className="min-h-9 rounded-lg bg-cyan-400 px-3 text-xs font-semibold text-slate-950">Start session</button> : <button type="button" onClick={() => updateSession(task, task.status === 'in_progress' ? 'completed' : 'upcoming')} className="min-h-9 rounded-lg bg-cyan-400 px-3 text-xs font-semibold text-slate-950">{task.status === 'in_progress' ? 'Complete session' : 'Mark incomplete'}</button>}<button type="button" onClick={() => updateSession(task, 'skipped')} className="min-h-9 rounded-lg border border-slate-700 px-3 text-xs text-slate-300">Skip</button></div></article>;
      const manualCard = task => <article key={task.id} className="rounded-xl border border-slate-700 bg-slate-950/40 p-4"><div className="flex flex-wrap items-start justify-between gap-3"><div><p className="text-sm font-semibold text-white">{task.title}</p><p className="mt-1 text-xs text-slate-400">Manual · {task.category} · {task.priority} priority</p><p className="mt-1 text-xs text-slate-300">{formatRoutineDate(task.date)}{task.startTime ? ` · ${task.startTime}` : ''} · {task.durationMinutes} min · {task.status.replace('_', ' ')}</p>{task.description && <p className="mt-2 text-xs leading-relaxed text-slate-400">{task.description}</p>}{task.notes && <details className="mt-2 text-xs text-slate-400"><summary className="cursor-pointer">Notes</summary><p className="mt-1">{task.notes}</p></details>}</div><span className="rounded-full border border-slate-700 px-2.5 py-1 text-[10px] capitalize text-slate-300">{task.status.replace('_', ' ')}</span></div><div className="mt-3 flex flex-wrap gap-2"><button type="button" onClick={() => updateManual(task.id, { status: task.status === 'completed' ? 'upcoming' : 'completed' })} className="min-h-9 rounded-lg border border-emerald-500/30 px-3 text-xs text-emerald-100">{task.status === 'completed' ? 'Mark incomplete' : 'Complete'}</button><button type="button" onClick={() => updateManual(task.id, { status: task.status === 'in_progress' ? 'upcoming' : 'in_progress' })} className="min-h-9 rounded-lg border border-slate-700 px-3 text-xs text-slate-200">{task.status === 'in_progress' ? 'Set upcoming' : 'Start'}</button><button type="button" onClick={() => updateManual(task.id, { status: task.status === 'skipped' ? 'upcoming' : 'skipped' })} className="min-h-9 rounded-lg border border-slate-700 px-3 text-xs text-slate-300">{task.status === 'skipped' ? 'Restore' : 'Skip'}</button><button type="button" onClick={() => beginEdit(task)} className="min-h-9 rounded-lg border border-slate-700 px-3 text-xs text-slate-200">Edit / Reschedule</button><button type="button" onClick={async () => { if (!window.confirm(`Delete “${task.title}”?`)) return; try { await persistRoutine({ ...routine, manualTasks: routine.manualTasks.filter(item => item.id !== task.id) }); setNotice('Manual task deleted.'); } catch {} }} className="min-h-9 rounded-lg border border-rose-500/30 px-3 text-xs text-rose-100">Delete</button></div></article>;

      return <div className="page-enter mx-auto max-w-6xl space-y-5">
        <header className="border-b border-slate-800 pb-5"><p className="text-xs font-semibold uppercase tracking-[0.16em] text-blue-300">WELLNESS & FOCUS</p><h1 className="mt-1 text-2xl font-semibold text-white sm:text-3xl">Make room for a clear mind</h1><p className="mt-2 max-w-2xl text-sm leading-relaxed text-slate-400">A guided breathing pause, a short memory game, and a learning routine that follows your saved goals and roadmap progress.</p></header>
        <nav aria-label="Wellness & Focus sections" className="flex flex-wrap gap-1 rounded-xl border border-slate-800 bg-slate-900/50 p-1">{[['routine', 'Daily Routine'], ['breathing', 'Box Breathing'], ['memory', 'Memory Game']].map(([id, label]) => <button key={id} type="button" aria-current={section === id ? 'page' : undefined} onClick={() => setSection(id)} className={`min-h-10 rounded-lg px-3 py-2 text-xs font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-cyan-400 ${section === id ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-slate-100'}`}>{label}</button>)}</nav>
        {notice && <p role="status" aria-live="polite" className="rounded-lg border border-emerald-500/20 bg-emerald-500/5 p-3 text-xs text-emerald-100">{notice}</p>}
        {saveError && <p role="alert" className="rounded-lg border border-amber-500/25 bg-amber-500/5 p-3 text-xs text-amber-100">{saveError}</p>}
        {section === 'breathing' && <BoxBreathing />}
        {section === 'memory' && <MemoryPictureGame />}
        {section === 'routine' && <div className="space-y-5">
          <div className="grid gap-4 md:grid-cols-3"><article className="rounded-xl border border-blue-500/20 bg-blue-500/5 p-4"><p className="text-[10px] font-semibold uppercase tracking-wide text-blue-200">Today's Progress</p><p className="mt-2 text-xl font-semibold text-white">{plannedToday.length ? `${completedToday} of ${plannedToday.length}` : 'No sessions'}</p><p className="mt-1 text-xs text-slate-400">{plannedToday.length ? 'scheduled tasks completed today' : 'Choose a learning path or add a manual task.'}</p></article><article className="rounded-xl border border-cyan-500/20 bg-cyan-500/5 p-4"><p className="text-[10px] font-semibold uppercase tracking-wide text-cyan-200">Next Learning Task</p><p className="mt-2 text-base font-semibold text-white">{plan?.nextTask?.title || 'No active learning session'}</p><p className="mt-1 text-xs text-slate-400">{plan?.nextTask ? `${plan.nextTask.skill} · ${plan.nextTask.durationLabel} · ${plan.nextTask.source.replace('-', ' ')}` : 'Your routine will update when a learning path is selected.'}</p></article><article className="rounded-xl border border-indigo-500/20 bg-indigo-500/5 p-4"><p className="text-[10px] font-semibold uppercase tracking-wide text-indigo-200">Learning target</p><p className="mt-2 text-base font-semibold text-white">{plan?.target || (mode === 'none' ? 'Manual routine' : 'Loading saved learning path')}</p><p className="mt-1 text-xs text-slate-400">{plan ? `${plan.gapCount} current skill gaps · ${plan.readinessScore == null ? 'readiness not assessed' : `${Math.round(plan.readinessScore)}% weighted readiness`}` : 'Tasks come from the existing roadmap and confirmed skill profile.'}</p></article></div>
          <div className="grid gap-5 lg:grid-cols-[minmax(0,1.15fr)_minmax(300px,0.85fr)]">
            <section className="space-y-4 rounded-2xl border border-slate-800 bg-slate-900/40 p-5 sm:p-6">
              <div className="flex flex-wrap items-start justify-between gap-3"><div><h2 className="text-lg font-semibold text-white">Today's Schedule</h2><p className="mt-1 text-xs text-slate-400">{formatRoutineDate(today)} · {preferenceDraft.availableMinutes} available learning minutes</p></div><button type="button" onClick={resumeRoadmap} className="min-h-9 rounded-lg border border-cyan-500/30 px-3 text-xs text-cyan-100">Open learning path</button></div>
              {planLoading && <p role="status" className="rounded-lg bg-slate-950/40 p-3 text-xs text-slate-300">Updating from your saved learning path…</p>}
              {planError && <div role="alert" className="rounded-lg border border-amber-500/25 bg-amber-500/5 p-3 text-xs text-amber-100"><p>{planError}</p><button type="button" onClick={() => setRetryPlan(value => value + 1)} className="mt-2 underline">Retry routine</button></div>}
              {!planLoading && !planError && mode === 'none' && <div className="rounded-xl border border-slate-700 bg-slate-950/40 p-4"><h3 className="text-sm font-medium text-white">No learning target selected</h3><p className="mt-1 text-xs leading-relaxed text-slate-400">Add personal tasks below, or choose a job, skill goal, or career path to add learning sessions automatically.</p><div className="mt-3 flex flex-wrap gap-2"><button type="button" onClick={openJobIntelligence} className="min-h-9 rounded-lg border border-slate-700 px-3 text-xs text-slate-200">Analyze a job</button><button type="button" onClick={() => openLearningPlan()} className="min-h-9 rounded-lg bg-cyan-400 px-3 text-xs font-semibold text-slate-950">Choose a learning goal</button></div></div>}
              {plannedToday.length ? <div className="space-y-3">{plannedToday.map(task => 'activity' in task ? generatedCard(task) : manualCard(task))}</div> : !planLoading && !planError && mode !== 'none' ? <p className="rounded-xl border border-slate-800 bg-slate-950/30 p-4 text-sm text-slate-400">Nothing scheduled for today. Upcoming sessions will appear below on your preferred study days.</p> : null}
              {plan?.unscheduledTasks?.length > 0 && <section className="rounded-xl border border-amber-500/25 bg-amber-500/5 p-4"><h3 className="text-sm font-semibold text-amber-100">Unscheduled learning tasks</h3><p className="mt-1 text-xs text-slate-400">These tasks could not fit your availability. Increase daily time or shorten sessions in preferences.</p><ul className="mt-3 space-y-2">{plan.unscheduledTasks.map(task => <li key={task.id} className="text-xs text-slate-200">{task.title} · {task.unscheduledReason}</li>)}</ul></section>}
              {plan?.upcomingTasks?.length > 0 && <section><h3 className="text-sm font-semibold text-white">Upcoming Learning Sessions</h3><div className="mt-3 space-y-2">{plan.upcomingTasks.slice(0, 8).map(task => generatedCard(task))}</div>{plan.upcomingTasks.length > 8 && <p className="mt-2 text-xs text-slate-500">Showing the next 8 of {plan.upcomingTasks.length} scheduled learning sessions.</p>}</section>}
            </section>
            <aside className="space-y-5">

                <label className="block text-xs text-slate-300">Learning source<select value={preferenceDraft.sourceMode || 'auto'} onChange={event => setPreferenceDraft(current => ({ ...current, sourceMode: event.target.value }))} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white"><option value="auto">Automatically use current learning path</option><option value="job">Target job gaps</option><option value="career">Career roadmap</option><option value="skill">Independent skill goal</option><option value="none">Manual tasks only</option></select></label>

                <fieldset><legend className="text-xs text-slate-300">Preferred study days</legend><div className="mt-2 flex flex-wrap gap-1.5">{dayNames.map(([label, day]) => { const selected = preferenceDraft.preferredDays.includes(day); return <label key={label} className={`flex cursor-pointer items-center gap-1 rounded-lg border px-2 py-1.5 text-[10px] ${selected ? 'border-cyan-500/40 bg-cyan-500/10 text-cyan-100' : 'border-slate-700 text-slate-400'}`}><input type="checkbox" checked={selected} onChange={() => setPreferenceDraft(current => { const days = current.preferredDays.includes(day) ? current.preferredDays.filter(value => value !== day) : [...current.preferredDays, day]; return { ...current, preferredDays: days.length ? days : current.preferredDays }; })} className="accent-cyan-400" />{label}</label>; })}</div></fieldset>
                <div className="grid grid-cols-2 gap-3"><label className="text-xs text-slate-300">Session length (min)<input type="number" min="10" max="90" step="5" value={preferenceDraft.sessionMinutes} onChange={event => setPreferenceDraft(current => ({ ...current, sessionMinutes: Number(event.target.value) }))} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white" /></label><label className="text-xs text-slate-300">Break (min)<input type="number" min="0" max="30" step="5" value={preferenceDraft.breakMinutes} onChange={event => setPreferenceDraft(current => ({ ...current, breakMinutes: Number(event.target.value) }))} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white" /></label></div>
                <label className="flex items-start gap-2 text-xs text-slate-300"><input type="checkbox" checked={preferenceDraft.includeManualTasks} onChange={event => setPreferenceDraft(current => ({ ...current, includeManualTasks: event.target.checked }))} className="mt-0.5 accent-cyan-400" />Include manual tasks when calculating today's planned time</label>

                <button type="submit" disabled={saving} className="min-h-10 w-full rounded-lg bg-cyan-400 px-3 text-sm font-semibold text-slate-950 disabled:opacity-50">{saving ? 'Saving…' : 'Save preferences'}</button>

              <section id="wellness-manual-task-form" className="rounded-2xl border border-slate-800 bg-slate-900/40 p-5"><div className="flex items-start justify-between gap-3"><div><h2 className="text-base font-semibold text-white">Manual Tasks</h2><p className="mt-1 text-xs text-slate-400">Personal tasks stay saved when your learning path changes.</p></div>{manualDraft && <button type="button" onClick={() => { setManualDraft(null); setEditingTaskId(''); }} className="text-xs text-slate-400 underline">Cancel edit</button>}</div>

t-xs text-slate-300">Duration (min)<input name="durationMinutes" type="number" min="5" max="480" step="5" required defaultValue={manualDraft?.durationMinutes || 30} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white" /></label><label className="text-xs text-slate-300">Notes (optional)<input name="notes" maxLength="2000" defaultValue={manualDraft?.notes || ''} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white" /></label></div><button type="submit" disabled={saving} className="min-h-10 w-full rounded-lg border border-slate-600 px-3 text-sm text-slate-100 disabled:opacity-50">{editingTaskId ? 'Save task changes' : 'Add manual task'}</button></form>
              </section>
            </aside>
          </div>
          <section aria-labelledby="manual-task-list" className="rounded-2xl border border-slate-800 bg-slate-900/40 p-5 sm:p-6"><h2 id="manual-task-list" className="text-base font-semibold text-white">Upcoming & Manual Task List</h2><div className="mt-3 space-y-3">{manualUpcoming.length ? manualUpcoming.sort((a, b) => `${a.date}${a.startTime}`.localeCompare(`${b.date}${b.startTime}`)).map(manualCard) : <p className="text-sm text-slate-400">No manual tasks are scheduled. Add one above whenever you need it.</p>}</div></section>
          <section className="grid gap-5 lg:grid-cols-2"><section className="rounded-2xl border border-emerald-500/20 bg-emerald-500/5 p-5"><h2 className="text-base font-semibold text-emerald-100">Completed Tasks</h2><div className="mt-3 space-y-2">{completedTasks.length ? completedTasks.map(task => <div key={`${task.source}:${task.id}`} className="rounded-lg border border-emerald-500/10 bg-slate-950/30 p-3"><p className="text-sm text-white">{task.title || task.skill}</p><p className="mt-1 text-xs text-slate-400">{task.source} · {task.completedAt ? new Date(task.completedAt).toLocaleString() : 'Completion saved'}</p>{task.source === 'Learning' && <button type="button" onClick={() => updateSession(task, 'upcoming')} className="mt-2 text-xs text-slate-300 underline">Reopen session</button>}{task.source === 'Manual' && <button type="button" onClick={() => updateManual(task.id, { status: 'upcoming', date: task.date < today ? today : task.date })} className="mt-2 text-xs text-slate-300 underline">Mark incomplete</button>}</div>) : <p className="text-sm text-slate-400">Completed routine tasks will appear here.</p>}</div></section><section className="rounded-2xl border border-slate-700 bg-slate-900/30 p-5"><h2 className="text-base font-semibold text-white">Skipped Tasks</h2><div className="mt-3 space-y-2">{skippedTasks.length ? skippedTasks.map(task => <div key={`${task.source}:${task.id}`} className="rounded-lg border border-slate-800 bg-slate-950/30 p-3"><p className="text-sm text-white">{task.title || task.skill}</p><p className="mt-1 text-xs text-slate-400">{task.source} · skipped</p>{task.source === 'Learning' && <button type="button" onClick={() => updateSession(task, 'upcoming')} className="mt-2 text-xs text-slate-300 underline">Reschedule session</button>}{task.source === 'Manual' && <button type="button" onClick={() => updateManual(task.id, { status: 'upcoming', date: task.date < today ? today : task.date })} className="mt-2 text-xs text-slate-300 underline">Restore manual task</button>}</div>) : <p className="text-sm text-slate-400">Skipped tasks stay recorded here; reschedule them from your learning path if needed.</p>}</div></section></section>
        </div>}
      </div>;
