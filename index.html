    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.ambientGain = null;
        this.ambientNodes = [];
        this.soundEnabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.12, gainLevel = 0.08) {
        if (!this.soundEnabled) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) { }
      }

      click() { this.playTone(850, 'sine', 0.04, 0.04); }
      success() {
        if (!this.soundEnabled) return;
        this.playTone(523.25, 'triangle', 0.1, 0.06); // C5
        setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.06), 80); // E5
        setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.08), 160); // G5
      }
      beep() { this.playTone(440, 'sine', 0.2, 0.05); }

      startAmbient(soundType) {
        this.stopAmbient();
        if (!this.soundEnabled) return;
        try {
          this.init();
          this.ambientGain = this.ctx.createGain();
          this.ambientGain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          this.ambientGain.connect(this.ctx.destination);

          if (soundType === 'rain' || soundType === 'whitenoise') {
            const bufferSize = this.ctx.sampleRate * 2;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              if (soundType === 'rain') {
                data[i] = (lastOut * 0.95) + (white * 0.05);
                lastOut = data[i];
              } else {
                data[i] = white * 0.2;
              }
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            noise.connect(this.ambientGain);
            noise.start();
            this.ambientNodes.push(noise);
          } else if (soundType === 'binaural') {
            const oscL = this.ctx.createOscillator();
            const oscR = this.ctx.createOscillator();
            oscL.frequency.value = 200;
            oscR.frequency.value = 210;
            oscL.connect(this.ambientGain);
            oscR.connect(this.ambientGain);
            oscL.start();
            oscR.start();
            this.ambientNodes.push(oscL, oscR);
          }
        } catch (e) {
          console.warn('Ambient sound failed:', e);
        }
      }

      stopAmbient() {
        this.ambientNodes.forEach(node => {
          try { node.stop(); } catch (e) { }
        });
        this.ambientNodes = [];
      }

    // filters and cards below, while remaining compatible with flat records.
    const DSA_QUESTION_LIBRARY = (Array.isArray(window.DSA_QUESTION_CATALOGUE) ? window.DSA_QUESTION_CATALOGUE : [])

        if (Array.isArray(entry.questions)) {
          return entry.questions.map(problem => {
            const [slug, title, difficulty, pattern] = Array.isArray(problem)
              ? problem
              : [problem?.slug, problem?.title, problem?.difficulty, problem?.pattern];
            if (!slug || !title) return null;
            const problemUrl = problem?.problemUrl || problem?.url || `https://leetcode.com/problems/${slug}/`;
            return {
              ...(Array.isArray(problem) ? {} : problem),
              id: problem?.id || `${entry.topic}:${slug}`,
              topic: problem?.topic || entry.topic || entry.name || 'General',
              subtopic: problem?.subtopic || entry.subtopic || 'General',
              slug,
              title,
              difficulty,
              pattern,
              problemUrl,
              solutionUrl: problem?.solutionUrl || `${problemUrl}solutions/`
            };
          }).filter(Boolean);
        }
        return entry && entry.title ? [entry] : [];
      });

        return counts;

        `${question.topic}::${question.subtopic}`,
        { value: `${question.topic}::${question.subtopic}`, label: `${question.topic} · ${question.subtopic}` }
      ])).values()), []);
      const filteredQuestions = useMemo(() => {
        const normalizedQuery = query.trim().toLocaleLowerCase();
        const [subtopicTopic, subtopicName] = selectedSubtopic === 'All' ? ['', ''] : selectedSubtopic.split('::');
        const results = DSA_QUESTION_LIBRARY.filter(question =>
          (selectedTopic === 'All' || question.topic === selectedTopic)
          && (selectedSubtopic === 'All' || (question.topic === subtopicTopic && question.subtopic === subtopicName))
          && (difficulty === 'All' || question.difficulty === difficulty)
          && (!normalizedQuery || question.title.toLocaleLowerCase().includes(normalizedQuery)
            || question.topic.toLocaleLowerCase().includes(normalizedQuery)
            || question.subtopic.toLocaleLowerCase().includes(normalizedQuery))
        );
        const difficultyRank = { Easy: 0, Medium: 1, Hard: 2 };
        if (sortBy === 'title') results.sort((a, b) => a.title.localeCompare(b.title));

</button></div>}

        catch { return 'choose'; }

      const [profile, setProfile] = useState(() => {

          const id = restored.id || `vortex-user-${(window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`)}`;
          const uniqueSkills = new Map();
          for (const rawSkill of Array.isArray(restored.skills) ? restored.skills : []) {
            const skill = normalizeSkillRecord(rawSkill);
            if (skill?.confirmed) uniqueSkills.set(skill.canonical, { ...(uniqueSkills.get(skill.canonical) || {}), ...skill });
          }
          return {
            ...restored,
            id,
            skills: [...uniqueSkills.values()],
            resume: restored.resume && typeof restored.resume === 'object' ? restored.resume : null,
            interests: Array.isArray(restored.interests) ? restored.interests : [],

          try {

            if (active) setBackendStatus(healthResult.status === 'ONLINE' ? 'NODE_API_CONNECTED' : 'BACKEND_UNAVAILABLE');

            {activeTab === 'dashboard' && <DashboardTab profile={profile} gainXp={gainXp} sound={sound} setActiveTab={setActiveTab} openCareerAnalysis={openCareerAnalysis} openSkillGap={openSkillGap} openLearningPlan={openLearningPlan} openJobIntelligence={openJobIntelligence} openSkillGoals={openSkillGoals} />}
            {activeTab === 'profile' && <ProfileTab profile={profile} setProfile={setProfile} gainXp={gainXp} sound={sound} setActiveTab={setActiveTab} />}
            {['skillgap', 'skill-intelligence', 'skill-goals'].includes(activeTab) && <SkillGapTab key={activeTab === 'skill-goals' ? 'skill-goals' : 'skill-intelligence'} profile={profile} setProfile={setProfile} gainXp={gainXp} sound={sound} setActiveTab={setActiveTab} preferredCareerId={preferredLearningCareer || profile.targetCareer || ''} openLearningPlan={openLearningPlan} pageMode="skills" initialMode={activeTab === 'skill-goals' ? 'goals' : 'build'} />}
            {activeTab === 'job-intelligence' && <JobIntelligencePage profile={profile} setProfile={setProfile} onStartLearning={(careerId = '', skill = '') => openLearningPlan(careerId, skill, 'job')} />}
            {activeTab === 'interview-prep' && <InterviewPreparationLibraryPage />}
            {activeTab === 'wellness' && <WellnessHub profile={profile} setProfile={setProfile} saveProfile={saveWellnessProfile} preferredRoadmapMode={preferredRoadmapMode} preferredRoadmapSkill={preferredRoadmapSkill} preferredCareerId={preferredLearningCareer || profile.targetCareer || ''} openLearningPlan={openLearningPlan} openJobIntelligence={openJobIntelligence} />}
            {['learningplan', 'roadmap'].includes(activeTab) && <SkillGapTab profile={profile} setProfile={setProfile} gainXp={gainXp} sound={sound} setActiveTab={setActiveTab} preferredCareerId={preferredLearningCareer || profile.targetCareer || ''} preferredRoadmapSkill={preferredRoadmapSkill} preferredRoadmapMode={preferredRoadmapMode} onRoadmapModeChange={setPreferredRoadmapMode} onRoadmapSkillSelection={() => setPreferredRoadmapSkill('')} openLearningPlan={openLearningPlan} pageMode="roadmap" initialMode={preferredSkillMode} openSkillGoals={openSkillGoals} />}
            </>}

    // =========================================================================
    // PERSONAL DASHBOARD: current goal, next action, and grounded progress
    // =========================================================================
    function DashboardTab({ profile, setActiveTab, openCareerAnalysis, openSkillGap, openLearningPlan, openJobIntelligence, openSkillGoals }) {
      const [careers, setCareers] = useState([]);
      useEffect(() => {
        const controller = new AbortController();
        fetch('/api/roadmap/catalogue', { signal: controller.signal })
          .then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data?.error || 'Catalogue is unavailable.'); return data; })
          .then(data => { if (!controller.signal.aborted && Array.isArray(data.tracks)) setCareers(data.tracks.filter(career => career.id !== 'software-engineering')); })
          .catch(error => { if (error.name !== 'AbortError') console.error('Roadmap catalogue could not be loaded for the dashboard:', error); });
        return () => controller.abort();
      }, []);
      const skills = profileSkillRecords(profile).filter(skill => skill.confirmed);
      const [assessment, setAssessment] = useState(null);
      const [careerRecommendations, setCareerRecommendations] = useState([]);
      const [assessmentState, setAssessmentState] = useState('idle');
      const [assessmentError, setAssessmentError] = useState('');
      const selectedCareer = careers.find(career => career.id === resolveTargetCareerId(profile.targetCareer || profile.targetRole));
      const selectableCareerRecommendations = careerRecommendations.flatMap(recommendation => {
        const id = resolveTargetCareerId(recommendation?.id);
        const track = careers.find(career => career.id === id);
        return track ? [{ ...recommendation, id: track.id, title: track.name }] : [];
      });

      useEffect(() => {
        const hasProjects = Array.isArray(profile.projects) ? profile.projects.length > 0 : Boolean(profile.projects);
        const hasEducation = Boolean(profile.degree || profile.college || profile.cgpa);
        if (!skills.length && !hasProjects && !hasEducation) { setAssessment(null); setCareerRecommendations([]); setAssessmentState('idle'); return; }
        const controller = new AbortController();
        setAssessmentState('loading');
        setAssessmentError('');
        const requestProfile = { ...profile, skills, ...(selectedCareer ? { targetCareer: selectedCareer.id } : {}) };
        fetch('/api/ai/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile: requestProfile }), signal: controller.signal })
          .then(async response => {
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.error || 'Analysis is unavailable.');
            if (!Array.isArray(result.topRecommendations)) throw new Error('The analysis response is incomplete.');
            if (selectedCareer && (!result.skillGapAnalysis || !Array.isArray(result.skillGapAnalysis.skillDetails))) throw new Error('The goal analysis response is incomplete.');
            return result;
          })
          .then(result => { if (!controller.signal.aborted) { setAssessment(result); setCareerRecommendations(result.topRecommendations); setAssessmentState('ready'); } })
          .catch(error => { if (!controller.signal.aborted) { setAssessment(null); setCareerRecommendations([]); setAssessmentError('Your saved profile is available, but career analysis is temporarily unavailable.'); setAssessmentState('error'); } });
        return () => controller.abort();
      }, [careers, profile.skills, profile.targetCareer, profile.targetRole, profile.projects, profile.degree, profile.college, profile.cgpa]);

      const gap = selectedCareer ? assessment?.skillGapAnalysis : null;
      const roadmap = selectedCareer ? assessment?.learningRoadmap : null;
      const details = Array.isArray(gap?.skillDetails) ? gap.skillDetails : [];
      const nextSkill = roadmap?.priorityRanking?.[0];
      const completedCount = details.filter(item => item.status === 'mastered').length;
      const developingCount = details.filter(item => item.status === 'developing').length;
      const missingCount = details.filter(item => ['missing', 'critical_missing'].includes(item.status)).length;
      const firstName = String(profile.name || '').trim().split(/\s+/)[0];
      const latestJob = profile.latestJobMatch;
      const jobNextAction = (latestJob?.priorityGaps || []).find(item => item.status !== 'matched');
      const careerNextAction = roadmap?.nextBestAction || nextSkill;
      const actionSkill = jobNextAction?.display || careerNextAction?.skill || '';
      const actionReason = jobNextAction?.reason || careerNextAction?.reason || '';
      const actionSimulation = jobNextAction && (latestJob?.readinessSimulations || []).find(item => item.canonical === jobNextAction.canonical);

arning <span aria-hidden="true">→</span></button>}</article>

ength && <div className="mt-4 flex flex-wrap gap-2"><button type="button" onClick={() => openSkillGap()} className="rounded-lg bg-blue-500 px-3 py-2 text-xs font-semibold text-white">Build Skills</button><button type="button" onClick={openSkillGoals} className="rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200">Choose Learning Goals</button></div>}</section>}

    // =========================================================================
    // Career analysis panel: retained existing explainable recommendation flow
    // =========================================================================
    function CareerAnalysisPanel({ profile, gainXp, sound, setActiveTab, openCareerAnalysis, openSkillGap, openLearningPlan }) {
      const [isAnalyzing, setIsAnalyzing] = useState(true);
      const [currentStageIndex, setCurrentStageIndex] = useState(0);
      const [logs, setLogs] = useState([]);
      const [selectedCareer, setSelectedCareer] = useState(0);
      const [evaluatedCareers, setEvaluatedCareers] = useState([]);
      const [analysisError, setAnalysisError] = useState('');
      const analyzeProfile = async (signal) => {
        setIsAnalyzing(true);
        setAnalysisError('');
        setLogs([]);
        const skills = Array.isArray(profile.skills) ? profile.skills : [];
        const hasProjects = Array.isArray(profile.projects) ? profile.projects.length > 0 : Boolean(profile.projects);
        const hasEducation = Boolean(profile.degree || profile.education || profile.college || profile.cgpa);
        const hasCandidateData = skills.length > 0 || hasProjects || hasEducation || (Array.isArray(profile.interests) && profile.interests.length > 0);
        if (!hasCandidateData) {
          setEvaluatedCareers([]);
          setSelectedCareer(0);
          setIsAnalyzing(false);
          setAnalysisError('Add skills, project details, interests, or education to generate career recommendations.');
          return false;
        }

        try {
          const response = await fetch('/api/ai/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profile }),
            signal
          });
          let result;
          try { result = await response.json(); } catch (error) { throw new Error('The career service returned an unreadable response.'); }
          if (!response.ok) throw new Error(result?.error || `Career analysis failed (${response.status}).`);
          if (!result || !Array.isArray(result.topRecommendations)) throw new Error('The career service response is missing recommendations.');

          const requiredBreakdown = ['semanticSimilarity', 'coreSkillCoverage', 'projectRelevance', 'educationFit', 'interestAlignment', 'overall'];
          const normalized = result.topRecommendations.filter(item => {
            if (EXCLUDED_TARGET_CAREER_IDS.has(String(item?.id || '').toLowerCase())) return false;
            const breakdown = item?.scoreBreakdown;
            const overall = Number(item?.matchScore ?? breakdown?.overall);
            return item && typeof item.id === 'string' && typeof item.title === 'string' && breakdown &&
              requiredBreakdown.every(key => Number.isFinite(Number(breakdown[key]))) && Number.isFinite(overall) && overall >= 0 && overall <= 100;
          }).map(item => {
            const template = CAREERS_MASTER_DATA.find(c => c.id === item.id) || {};
            const phases = Array.isArray(item.learningRoadmap?.phases) ? item.learningRoadmap.phases : [];
            return {
              ...template,
              ...item,
              matchScore: Math.round(Number(item.scoreBreakdown.overall)),
              matchingSkills: Array.isArray(item.matchingSkills) ? item.matchingSkills : [],
              missingSkills: Array.isArray(item.missingSkills) ? item.missingSkills : [],
              whyMatched: Array.isArray(item.whyMatched) ? item.whyMatched : [],
              strengths: Array.isArray(item.strengths) ? item.strengths : [],
              missingCriticalSkills: Array.isArray(item.missingCriticalSkills) ? item.missingCriticalSkills : [],
              recommendedNextSkills: Array.isArray(item.recommendedNextSkills) ? item.recommendedNextSkills : [],
              matchingJobs: Array.isArray(template.matchingJobs) ? template.matchingJobs : [],
              roadmap: phases.map((phase, index) => ({
                phase: phase.title || `Phase ${index + 1}`,
                task: phase.projectMilestone?.objective || (Array.isArray(phase.focusSkills) ? phase.focusSkills.join(', ') : '')
              }))
            };
          });
          if (!normalized.length) throw new Error('The career service returned no valid recommendation records.');
          setEvaluatedCareers(normalized);
          setSelectedCareer(0);
          setCurrentStageIndex(5);
          const stageSummaries = [
            'Candidate profile loaded',
            'Skills, projects, education, and interests assessed',
            'Profile compared with role requirements',
            'Explainable recommendations ranked',
            'Skill gaps and learning plan prepared'
          ];
          setLogs(stageSummaries.map((summary, index) => `[STAGE ${index + 1}] ${summary}`));
          return true;
        } catch (error) {
          if (error.name !== 'AbortError') {
            console.error('Career analysis request failed:', error);
            setEvaluatedCareers([]);
            setSelectedCareer(0);
            setAnalysisError(error instanceof TypeError || /failed to fetch|networkerror/i.test(String(error?.message || '')) ? 'network' : 'service');
          }
          return false;
        } finally {
          if (!signal?.aborted) setIsAnalyzing(false);
        }
      };

      useEffect(() => {
        const controller = new AbortController();
        analyzeProfile(controller.signal);
        return () => controller.abort();
      }, [profile]);

      const career = evaluatedCareers[selectedCareer] || null;

      const pipelineStages = [
        { num: 1, title: "Student Data Ingestion", subtitle: "Profile details supplied for analysis", icon: "👤", details: `${profile.name} • ${profile.degree || 'Education not provided'}` },
        { num: 2, title: "Profile Feature Analysis", subtitle: "Skills, projects, education & interests", icon: "🧠", details: `${Array.isArray(profile.skills) ? profile.skills.length : 0} candidate skills supplied` },
        { num: 3, title: "Role Ontology Comparison", subtitle: "Local career requirement profiles", icon: "⚖️", details: `${evaluatedCareers.length} recommendations returned` },
          { num: 4, title: "Explainable Career Ranking", subtitle: "Weighted profile match score and breakdown", icon: "🎯", details: career ? `${career.matchScore}% overall match` : 'Awaiting analysis' },
        { num: 5, title: "Skill Gaps & Learning Plan", subtitle: "Role-specific skills and roadmap", icon: "💼", details: career ? `${career.missingCriticalSkills.length} critical gaps` : 'Awaiting analysis' },
      ];

      const runPipeline = async () => {
        sound.beep();
        setCurrentStageIndex(0);
        if (await analyzeProfile()) gainXp(160, "Executed Career Analysis");
      };

      const profileSkills = Array.isArray(profile.skills) ? profile.skills : [];
      const hasProjects = Array.isArray(profile.projects)
        ? profile.projects.some(project => typeof project === 'string' ? project.trim().length > 0 : project && typeof project === 'object' && Object.values(project).some(value => String(value || '').trim().length > 0))
        : typeof profile.projects === 'string' && profile.projects.trim().length > 0;
      const hasProfileData = profileSkills.length > 0 || hasProjects || Boolean(profile.degree || profile.education || profile.college || profile.cgpa || profile.interests?.length);
      const careerGap = career?.skillGapAnalysis;
      const careerRoadmap = career?.learningRoadmap;
      const profileComplete = Boolean(String(profile.name || '').trim() && String(profile.degree || '').trim() && profileSkills.length > 0);
      const projectCount = Array.isArray(profile.projects)
        ? profile.projects.filter(project => typeof project === 'string' ? project.trim().length > 0 : project && typeof project === 'object' && Object.values(project).some(value => String(value || '').trim().length > 0)).length
        : (hasProjects ? 1 : 0);
      const rawExplicitTarget = profile.targetCareer || profile.targetRole || '';
      const explicitTarget = resolveTargetCareerId(rawExplicitTarget);
      const removedExplicitTarget = Boolean(rawExplicitTarget && !explicitTarget);
      const targetMatch = evaluatedCareers.find(item => item.id === explicitTarget || item.title.toLowerCase() === String(explicitTarget).toLowerCase());
      const targetTemplate = CAREERS_MASTER_DATA.find(item => item.id === explicitTarget || item.title.toLowerCase() === String(explicitTarget).toLowerCase());
      const targetCareerLabel = targetMatch?.title || targetTemplate?.title || (!removedExplicitTarget ? profile.targetRole || (explicitTarget && !String(explicitTarget).includes('-') ? explicitTarget : '') : '');
      const greetingName = String(profile.name || '').trim();
      const hour = new Date().getHours();
      const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
      const journeyStages = [
        { label: 'Student profile', complete: profileComplete, detail: profileComplete ? 'Core details present' : 'Complete your profile' },

      const firstIncompleteJourneyStage = journeyStages.findIndex(stage => !stage.complete);

      const skillCoverage = Number.isFinite(Number(careerGap?.readinessScore)) ? Number(careerGap.readinessScore) : null;
      // This dashboard estimate combines two backend measurements.
      const readinessScore = skillCoverage !== null && profileSkills.length > 0
        ? Math.round(skillCoverage * 0.7 + Number(career.matchScore) * 0.3)
        : null;
      const priorityGapItems = careerGap && Array.isArray(careerRoadmap?.priorityRanking)
        ? careerRoadmap.priorityRanking.filter(item => ['critical_missing', 'missing'].includes(item.currentStatus) && item.skill)
        : [];
      const priorityGaps = careerGap
        ? (priorityGapItems.length ? priorityGapItems.map(item => item.skill) : [...new Set([...(careerGap.criticalMissingSkills || []), ...(careerGap.missingSkills || [])])])
        : [];
      const firstAction = Array.isArray(careerRoadmap?.priorityRanking) ? careerRoadmap.priorityRanking[0] : null;
      const nextActionPath = firstAction
        ? [...(Array.isArray(firstAction.prerequisites) ? firstAction.prerequisites : []), firstAction.skill].filter(Boolean)
        : [];
      const analysisStatus = isAnalyzing
        ? (profileComplete ? 'ANALYSIS IN PROGRESS' : 'PROFILE INCOMPLETE')
        : !profileComplete
          ? 'PROFILE INCOMPLETE'
        : evaluatedCareers.length
          ? 'ANALYSIS READY'
          : ['network', 'service'].includes(analysisError)
            ? 'ANALYSIS UNAVAILABLE'
            : 'ANALYSIS REQUIRED';
      const stages = [
        { label: 'PROFILE', status: profileComplete ? 'complete' : hasProfileData ? 'action' : 'pending', action: () => setActiveTab('profile'), detail: profileComplete ? 'Core profile details are present' : 'Complete name, education and skills' },
        { label: 'SKILLS', status: profileSkills.length ? 'complete' : hasProfileData ? 'action' : 'pending', action: () => setActiveTab('profile'), detail: profileSkills.length ? `${profileSkills.length} profile-listed skills` : 'Add skills to your profile' },
        { label: 'CAREER MATCH', status: evaluatedCareers.length ? 'complete' : ['network', 'service'].includes(analysisError) ? 'action' : hasProfileData ? 'active' : 'pending', action: openCareerAnalysis, detail: evaluatedCareers.length ? `${Math.min(3, evaluatedCareers.length)} ranked matches shown` : 'Run profile analysis' },
        { label: 'SKILL GAP', status: careerGap ? 'complete' : evaluatedCareers.length ? 'action' : 'pending', action: () => openSkillGap(career?.id || profile.targetCareer), detail: careerGap ? `${priorityGaps.length} prioritized gaps` : 'Awaiting career analysis' },
        { label: 'LEARNING PLAN', status: careerRoadmap?.phases?.length ? 'complete' : evaluatedCareers.length ? 'action' : 'pending', action: () => openLearningPlan(career?.id || profile.targetCareer), detail: careerRoadmap?.phases?.length ? `${careerRoadmap.phases.length} learning phases` : 'Awaiting career analysis' },
        { label: 'OPPORTUNITIES', status: career?.matchingJobs?.length ? 'active' : 'pending', action: () => setActiveTab('market'), detail: career?.matchingJobs?.length ? 'Bundled examples only; no applications tracked' : 'Open the opportunities module' },
      ];

      return (
        <div className="space-y-6 animate-fadeIn">
          <section className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3" aria-labelledby="career-readiness-heading">

              <p className="text-sm text-slate-300">{greeting}{greetingName ? `, ${greetingName.split(' ')[0]}` : ''} <span aria-hidden="true">👋</span></p>

            </div>
            <div className={`inline-flex items-center gap-2 self-start sm:self-auto px-3 py-2 rounded-full border text-[10px] font-mono tracking-wider ${analysisStatus === 'ANALYSIS READY' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : analysisStatus === 'ANALYSIS UNAVAILABLE' ? 'bg-amber-500/10 border-amber-500/30 text-amber-300' : 'bg-slate-800/70 border-slate-700 text-slate-300'}`} role="status">

                  <button onClick={() => openSkillGap(career.id)} className="mt-4 text-xs font-semibold text-cyan-300 hover:text-white">View Skill Gap →</button>
                </>
              ) : <p className="mt-3 text-sm leading-relaxed text-slate-400">Skill gaps will appear after Career Analysis.</p>}
            </article>

          <section className="p-4 sm:p-5 rounded-2xl bg-vortex-card border border-vortex-border" aria-label="Career intelligence pipeline">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4"><div><h2 className="text-xs font-mono font-bold tracking-wider text-white">YOUR CAREER INTELLIGENCE PIPELINE</h2><p className="mt-1 text-[11px] text-slate-400">Each stage reflects the profile and analysis currently available.</p></div>{isAnalyzing && <span className="text-[10px] font-mono text-cyan-300">Analysis in progress…</span>}</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-2">
              {stages.map((stage, index) => {
                const stateLabel = { complete: 'COMPLETE', active: 'ACTIVE', action: 'ACTION NEEDED', pending: 'PENDING' }[stage.status];
                const stateColor = stage.status === 'complete' ? 'text-emerald-300' : stage.status === 'active' ? 'text-cyan-300' : stage.status === 'action' ? 'text-amber-300' : 'text-slate-500';
                return <button key={stage.label} type="button" onClick={stage.action} className="group relative text-left p-3 rounded-xl border border-vortex-border bg-vortex-surface/70 hover:border-cyan-500/40 transition-colors focus:outline-none focus:ring-2 focus:ring-cyan-500/50">
                  <div className="flex flex-wrap items-center justify-between gap-1"><span className="text-[10px] font-mono font-bold tracking-wider text-slate-200">{stage.label}</span><span className={`text-[9px] font-mono ${stateColor}`}>{stage.status === 'complete' ? '✓ ' : '● '}{stateLabel}</span></div>
                  <p className="mt-2 text-[10px] leading-relaxed text-slate-400">{stage.detail}</p>
                  {index < stages.length - 1 && <span className="hidden xl:block absolute -right-3 top-1/2 z-10 text-cyan-400" aria-hidden="true">→</span>}
                </button>;
              })}
            </div>
          </section>

          <section id="career-matches" className="scroll-mt-6 space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-2">
              <div><h2 className="text-xl font-display font-bold text-white">Top Career Matches</h2><p className="mt-1 text-xs text-slate-400">Career paths ranked using the profile inputs the analysis engine evaluates: skills, projects, education and interests.</p></div>
            {evaluatedCareers.length > 0 && <span className="text-xs font-mono text-cyan-300">{Math.min(3, evaluatedCareers.length)} Career Matches</span>}
            </div>
            {evaluatedCareers.length ? (
              <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
                {evaluatedCareers.slice(0, 3).map((item, index) => {
                  const gaps = Array.isArray(item.learningRoadmap?.priorityRanking)
                    ? item.learningRoadmap.priorityRanking.filter(skill => ['critical_missing', 'missing'].includes(skill.currentStatus)).map(skill => skill.skill).filter(Boolean)
                    : item.skillGapAnalysis ? [...new Set([...(item.skillGapAnalysis.criticalMissingSkills || []), ...(item.skillGapAnalysis.missingSkills || [])])] : item.missingSkills;
                  return <article key={item.id} className={`p-4 rounded-2xl border bg-vortex-card min-w-0 ${selectedCareer === index ? 'border-cyan-400/70 shadow-lg shadow-cyan-500/5' : 'border-vortex-border'}`}>
                    <div className="flex items-start justify-between gap-2"><div className="min-w-0"><p className="text-[9px] font-mono uppercase tracking-wider text-slate-400">{item.category}</p><h3 className="mt-1 text-base font-bold text-white">{item.title}</h3></div><strong className="shrink-0 text-sm font-mono text-cyan-300">{Math.round(item.matchScore)}%<span className="block text-[9px] text-slate-500 font-normal">match</span></strong></div>
                    <div className="mt-4"><p className="text-[9px] uppercase font-mono text-emerald-300">Strong matches</p>{item.matchingSkills.length ? <div className="mt-1 flex flex-wrap gap-1">{item.matchingSkills.slice(0, 4).map(skill => <span key={skill} className="px-2 py-1 rounded-md bg-emerald-500/10 border border-emerald-500/20 text-[10px] text-emerald-200">{skill}</span>)}</div> : <p className="mt-1 text-[10px] text-slate-500">No direct skills matched</p>}</div>
                    <div className="mt-3"><p className="text-[9px] uppercase font-mono text-amber-300">Key gaps</p>{gaps.length ? <div className="mt-1 flex flex-wrap gap-1">{gaps.slice(0, 4).map(skill => <span key={skill} className="px-2 py-1 rounded-md bg-amber-500/10 border border-amber-500/20 text-[10px] text-amber-100">{skill}</span>)}</div> : <p className="mt-1 text-[10px] text-slate-500">No gaps returned</p>}</div>
                    <button type="button" onClick={() => { setSelectedCareer(index); document.getElementById('career-explanation')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }} className="mt-4 w-full px-3 py-2 rounded-lg border border-cyan-500/30 text-xs font-semibold text-cyan-200 hover:bg-cyan-500/10 transition-colors">View Analysis</button>
                  </article>;

              </div>
            ) : <div className="p-5 rounded-2xl bg-vortex-card border border-vortex-border"><h3 className="text-sm font-bold text-white">No career matches yet</h3><p className="mt-1 text-xs text-slate-400">Run Career Analysis to discover your strongest career paths.</p><button onClick={() => hasProfileData ? runPipeline() : setActiveTab('profile')} disabled={isAnalyzing} className="mt-3 px-3 py-2 rounded-lg bg-cyan-500 text-slate-950 text-xs font-bold disabled:opacity-50">{hasProfileData ? 'Run Career Analysis' : 'Complete Your Profile'}</button></div>}
          </section>

          {career && (
            <section id="career-explanation" className="scroll-mt-6 grid grid-cols-1 xl:grid-cols-2 gap-4">
              <article className="p-5 rounded-2xl bg-vortex-card border border-vortex-border min-w-0">
                <p className="text-[10px] font-mono tracking-wider text-cyan-300">WHY THIS CAREER?</p>
                <h2 className="mt-2 text-lg font-display font-bold text-white">Why {career.title}?</h2>

                <h3 className="mt-5 text-[10px] font-mono tracking-wider text-amber-300">AREAS TO STRENGTHEN</h3>
                {priorityGaps.length ? <ul className="mt-2 space-y-1 text-xs text-slate-300">{priorityGaps.slice(0, 5).map(skill => <li key={skill}>⚠ {skill}</li>)}</ul> : <p className="mt-2 text-xs text-slate-400">No skill gaps were returned for this role.</p>}

              <div><p className="text-[10px] font-mono text-cyan-300">01</p><h2 className="text-base font-semibold text-white">Personal Information</h2></div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {[['name', 'Full Name', 'Your full name', 'text'], ['email', 'Email Address', 'you@example.com', 'email'], ['phone', 'Phone Number', 'Phone number', 'tel']].map(([name, label, placeholder, type]) => <label key={name} className="block"><span className="text-xs text-slate-400">{label}</span><input name={name} type={type} value={profile[name] || ''} onChange={updateField} autoComplete={name === 'name' ? 'name' : name === 'email' ? 'email' : 'tel'} placeholder={placeholder} className="mt-1 w-full px-3 py-2.5 rounded-lg bg-vortex-surface border border-vortex-border text-sm text-white focus:outline-none focus:border-cyan-400" /></label>)}

    // =========================================================================
    // 3. SKILL INTELLIGENCE: canonical resume, confirmed skills, target, gaps, and roadmap
    // =========================================================================
    function JobIntelligencePage({ profile, setProfile, onStartLearning }) {
      const [jobDescription, setJobDescription] = useState('');
      const [jobTitle, setJobTitle] = useState('');
      const [jobCompany, setJobCompany] = useState('');
      const [result, setResult] = useState(profile.latestJobMatch || null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [message, setMessage] = useState('');
      const [selectedSimulationSkills, setSelectedSimulationSkills] = useState([]);
      const [simulationLoading, setSimulationLoading] = useState(false);
      const [simulationScore, setSimulationScore] = useState(null);
      const [simulationMessage, setSimulationMessage] = useState('');
      const skills = profileSkillRecords(profile).filter(skill => skill.confirmed);

      const saveResult = async next => {
        setProfile(previous => ({ ...previous, latestJobMatch: next }));
        try {
          const saved = await saveStudentProfile({ ...profile, latestJobMatch: next });
          setProfile({ ...EMPTY_PROFILE, ...saved });
          setMessage('Analysis saved to your profile.');
        } catch (saveError) {
          console.error('Job analysis could not sync:', saveError);
          setMessage('Analysis is saved in this browser. Profile sync is temporarily unavailable.');
        }
      };
      const analyze = async event => {
        event.preventDefault();
        const description = jobDescription.trim();
        if (!description) { setError('Paste a job description to analyze.'); return; }
        if (description.length < 20) { setError("We couldn't identify enough job requirements. Try pasting the complete job description."); return; }
        setLoading(true); setError(''); setMessage(''); setSelectedSimulationSkills([]); setSimulationScore(null); setSimulationMessage('');
        try {
          const response = await fetch('/api/job-match/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobDescription: description, jobTitle: jobTitle.trim(), company: jobCompany.trim(), profile: { ...profile, skills, skillGoals: Array.isArray(profile.skillGoals) ? profile.skillGoals : [] } }) });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.error || 'Job analysis is temporarily unavailable.');
          if (!Array.isArray(body.requirements) || !Array.isArray(body.priorityGaps)) throw new Error('The job analysis response was incomplete.');
          if (!body.requirements.length) throw new Error("We couldn't identify enough job requirements. Try pasting the complete job description.");
          const savedResult = { ...body, summary: { title: body.job?.title || jobTitle.trim() || 'Job description', ...(body.job?.company || jobCompany.trim() ? { company: body.job?.company || jobCompany.trim() } : {}), coverageScore: body.coverageScore, requirementCount: body.requirementCount, matchedCount: body.matchedCount, developingCount: body.developingCount, notFoundCount: body.notFoundCount } };
          setResult(savedResult);
          await saveResult(savedResult);
        } catch (analysisError) {
          console.error('Job description analysis failed:', analysisError);
          setError(analysisError.message || 'Job analysis is temporarily unavailable.');
        } finally { setLoading(false); }
      };
      const addGapToGoals = async item => {
        const goals = Array.isArray(profile.skillGoals) ? profile.skillGoals : [];
        if (goals.some(goal => canonicalSkillName(goal.canonical) === item.canonical)) { setMessage(`${item.display} is already in your learning goals.`); return; }
        const next = { ...profile, skillGoals: [...goals, { canonical: item.canonical, display: item.display, currentLevel: 'beginner', targetLevel: 'intermediate', priority: item.importance === 'high' ? 'high' : 'medium' }] };
        setProfile(next);
        try { setProfile({ ...EMPTY_PROFILE, ...await saveStudentProfile(next) }); setMessage(`${item.display} added to your learning goals.`); }
        catch (saveError) { setMessage(`${item.display} is saved in this browser; backend sync is temporarily unavailable.`); }
      };
      const statusText = { matched: 'Covered · confirmed skill', developing: 'Developing', missing: 'Not found in your profile' };
      const statusStyle = { matched: 'border-emerald-900/70 bg-emerald-950/20 text-emerald-200', developing: 'border-amber-900/70 bg-amber-950/20 text-amber-200', missing: 'border-slate-800 bg-slate-950/40 text-slate-300' };
      const readiness = result?.coverageScore;
      const readinessLabel = readiness == null ? 'Not assessed' : readiness >= 80 ? 'Strong coverage' : readiness >= 60 ? 'Developing' : 'Early coverage';
      const nextAction = (result?.priorityGaps || []).find(item => item.status !== 'matched');
      const criticalGaps = (result?.priorityGaps || []).slice(0, 3);
      const simulationOptions = result?.readinessSimulations || [];
      const importanceGroups = [['Critical', 'high'], ['Important', 'medium'], ['Nice to Have', 'low']].map(([title, importance]) => ({ title, importance, items: (result?.requirements || []).filter(item => item.importance === importance) }));
      const selectedSimulations = simulationOptions.filter(item => selectedSimulationSkills.includes(item.canonical));
      const simulateSelectedSkills = async () => {
        if (!selectedSimulations.length || readiness == null) return;
        setSimulationLoading(true);
        setSimulationMessage('');
        try {
          if (selectedSimulations.length === 1) {
            setSimulationScore(Number(selectedSimulations[0].simulatedScore));
            return;
          }
          if (jobDescription.trim().length < 20) {
            setSimulationScore(null);
            setSimulationMessage('Paste and analyze this job description again to calculate a combined scenario.');
            return;
          }
          const simulatedSkills = selectedSimulations.map(item => ({ canonical: item.canonical, display: item.display, confirmed: true, level: 'advanced', source: 'what-if' }));
          const temporaryProfile = { ...profile, skills: [...skills, ...simulatedSkills] };
          const response = await fetch('/api/job-match/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobDescription, profile: temporaryProfile }) });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.error || 'The combined scenario is temporarily unavailable.');
          if (body.coverageScore == null || !Number.isFinite(Number(body.coverageScore))) throw new Error('The analysis did not return a readiness score for this scenario.');
          setSimulationScore(Number(body.coverageScore));
        } catch (simulationError) {
          setSimulationScore(null);
          setSimulationMessage(simulationError.message || 'The scenario could not be calculated.');
        } finally { setSimulationLoading(false); }
      };

      return <div className="space-y-5">
        <header className="flex flex-wrap items-end justify-between gap-3"><div><p className="text-xs font-medium uppercase tracking-wide text-cyan-300">JOB INTELLIGENCE</p><h1 className="mt-1 text-2xl font-semibold text-white sm:text-3xl">How ready are you for this job?</h1><p className="mt-1 text-sm text-slate-400">Compare a real job description with skills confirmed in your profile.</p></div>{result && <button type="button" onClick={() => { setResult(null); setError(''); setMessage(''); }} className="rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200">Change Job</button>}</header>
        {!result && <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 sm:p-6"><h2 className="text-lg font-semibold text-white">Analyze a Job</h2><p className="mt-1 text-sm text-slate-400">Paste a job description to discover the skills and requirements needed for this role.</p><form onSubmit={analyze} className="mt-4 space-y-3"><div className="grid gap-3 sm:grid-cols-2"><label className="block text-xs font-medium text-slate-300">Job Title <span className="font-normal text-slate-500">(optional)</span><input value={jobTitle} onChange={event => setJobTitle(event.target.value)} maxLength={120} placeholder="e.g. Machine Learning Engineer" className="mt-1.5 w-full rounded-lg border border-slate-700 bg-[#0b0f14] p-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:border-cyan-500 focus:outline-none" /></label><label className="block text-xs font-medium text-slate-300">Company <span className="font-normal text-slate-500">(optional)</span><input value={jobCompany} onChange={event => setJobCompany(event.target.value)} maxLength={120} placeholder="Company name" className="mt-1.5 w-full rounded-lg border border-slate-700 bg-[#0b0f14] p-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:border-cyan-500 focus:outline-none" /></label></div><label htmlFor="job-description" className="block text-xs font-medium text-slate-300">Job description</label><textarea id="job-description" value={jobDescription} onChange={event => setJobDescription(event.target.value)} maxLength={30000} rows={9} placeholder="Paste the complete job description here…" className="w-full resize-y rounded-xl border border-slate-700 bg-[#0b0f14] p-3 text-sm leading-relaxed text-slate-100 placeholder:text-slate-600 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20"/><p className="text-[11px] text-slate-500">Paste from LinkedIn or another job board; analyzed locally using the project’s existing skill ontology.</p><div className="flex flex-wrap items-center justify-between gap-2"><span className="text-[11px] text-slate-500">Up to 30,000 characters · {skills.length} confirmed profile skills</span><button type="submit" disabled={loading} className="rounded-lg bg-cyan-500 px-4 py-2.5 text-sm font-medium text-slate-950 disabled:cursor-not-allowed disabled:opacity-50">{loading ? 'Analyzing…' : 'Analyze Job →'}</button></div></form>{loading && <p role="status" className="mt-3 text-xs text-cyan-200">Extracting job requirements and comparing profile evidence…</p>}{error && <div role="alert" className="mt-3 flex flex-wrap items-center justify-between gap-3 rounded-lg border border-amber-900/70 bg-amber-950/20 p-3 text-xs text-amber-100"><span>{error}</span><button type="button" onClick={event => { event.preventDefault(); analyze({ preventDefault() {} }); }} className="underline">Retry</button></div>}{message && <p role="status" className="mt-3 text-xs text-slate-400">{message}</p>}</section>}
        {result && <>

ength > 1 ? 'Simulate selected skills' : 'Show selected simulation'}</button></div></> : <p className="mt-3 text-xs text-slate-400">No unresolved requirements have a measurable readiness effect.</p>}</section>

      const skillGoalLimitReached = skillGoals.length >= MAX_SKILL_GOALS;
      const selectedGoalCanonical = canonicalSkillName(goalQuery);

      const selectableSkillOptions = [...new Set(catalogueSkills.length ? catalogueSkills : SKILL_GOAL_OPTIONS)].sort((a, b) => a.localeCompare(b));
      const goalSkillMatches = goalQuery.trim() ? selectableSkillOptions.filter(skill => skill.toLowerCase().includes(goalQuery.trim().toLowerCase()) && !skillGoals.some(goal => canonicalSkillName(goal.canonical || goal.canonicalSkill || goal.skill || goal.name || goal.display) === canonicalSkillName(skill))).slice(0, 8) : [];
      const roadmapSkillMatches = roadmapSkillSearch.trim() ? catalogueSkills.filter(skill => skill.toLowerCase().includes(roadmapSkillSearch.trim().toLowerCase())).slice(0, 10) : [];
      const startIndividualSkill = async skill => {

<p className="text-xs text-amber-200">No technical skills were extracted. You can still save the detected resume details and add skills manually.</p>}{pendingResume.candidateProfile?.warnings?.map((warning, index) => <p key={index} className="text-[11px] text-amber-200">{warning}</p>)}<div className="flex flex-wrap gap-2"><button type="button" onClick={saveResumeDetails} className="rounded-lg bg-cyan-500/15 border border-cyan-400/30 px-3 py-2 text-xs font-semibold text-cyan-100">Save Resume Details</button><button type="button" onClick={() => { setPendingResume(null); setExtractedSkills([]); setSelectedExtractedSkills([]); }} className="rounded-lg border border-vortex-border px-3 py-2 text-xs text-slate-300">Cancel</button></div></div>}

-400">Target level</span><select value={goalTargetLevel} onChange={event => setGoalTargetLevel(event.target.value)} className="mt-1 w-full rounded-lg border border-slate-700 bg-[#0b0f14] px-3 py-2.5 text-sm text-white">{['familiar','intermediate','advanced'].map(level => <option key={level} value={level}>{level[0].toUpperCase() + level.slice(1)}</option>)}</select></label><label><span className="text-xs text-slate-400">Priority</span><select value={goalPriority} onChange={event => setGoalPriority(event.target.value)} className="mt-1 w-full rounded-lg border border-slate-700 bg-[#0b0f14] px-3 py-2.5 text-sm text-white"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label></div><button type="button" onClick={addSkillGoal} disabled={!goalQuery || duplicateSkillGoal || skillGoalLimitReached} className="mt-3 rounded-lg bg-cyan-500 px-4 py-2 text-sm font-medium text-slate-950 disabled:opacity-50">Add Skill Goal</button>{skillGoalLimitReached && <p role="status" className="mt-2 text-xs text-amber-200">Maximum skill goals reached. Remove an existing skill goal to choose another.</p>}{profileSyncMessage && <p role="status" className="mt-2 text-xs text-slate-400">{profileSyncMessage}</p>}</section>
          <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5"><h2 className="text-base font-semibold text-white">Skills I’m working toward</h2>{skillGoals.length ? <div className="mt-3 grid gap-3 sm:grid-cols-2">{skillGoals.map(goal => { const pathItem = learningRoadmap?.roadmapItems?.find(item => item.canonicalSkill === goal.canonical); const status = pathItem?.status === 'completed' ? 'Completed' : pathItem?.status === 'in_progress' || pathItem?.status === 'learning' || pathItem?.status === 'practice' || pathItem?.status === 'verification' ? 'In progress' : 'Not started'; return <article key={goal.canonical} className="rounded-xl border border-slate-800 bg-slate-950/30 p-4"><div className="flex items-start justify-between gap-3"><div><h3 className="text-sm font-semibold text-white">{goal.display}</h3><p className="mt-1 text-xs text-slate-400">Personal learning goal · {status}</p></div><button type="button" onClick={() => removeSkillGoal(canonicalSkillName(goal.canonical))} aria-label={`Remove ${goal.display} learning goal`} className="text-xs text-slate-500 hover:text-rose-300">Remove</button></div><button type="button" onClick={() => openLearningPlan?.('', goal.canonical)} className="mt-3 text-xs text-cyan-300 underline underline-offset-4">Open Learning Path</button></article>; })}</div> : <div className="mt-2"><p className="text-sm text-slate-400">You haven’t selected any skills to learn yet.</p><p className="mt-1 text-xs text-slate-500">Choose an individual skill and build your learning path.</p><button type="button" onClick={() => setGoalQuery('Python')} className="mt-3 rounded-lg border border-cyan-500/30 px-3 py-2 text-xs text-cyan-100">Add a Skill Goal</button></div>}</section>
          <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5"><div className="flex flex-wrap items-center justify-between gap-3"><div><h2 className="text-base font-semibold text-white">Career goal (optional)</h2><p className="mt-1 text-xs text-slate-400">Use a role goal for ontology-based skill-gap analysis.</p></div><span className="text-xs text-slate-400">{currentCareer ? `Selected: ${currentCareer.name}` : 'No role selected'}</span></div><div className="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">{targetCareers.map(career => <button key={career.id} type="button" onClick={() => chooseCareer(career.id)} aria-pressed={targetCareerId === career.id} className={`rounded-lg border px-3 py-3 text-left text-xs ${targetCareerId === career.id ? 'border-cyan-700 bg-cyan-950/30 text-cyan-100' : 'border-slate-800 bg-slate-950/30 text-slate-300 hover:border-slate-600'}`}>{career.name}</button>)}</div></section>
          {currentCareer && <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5"><div className="flex flex-wrap items-center justify-between gap-2"><h2 className="text-base font-semibold text-white">Skill gaps for {currentCareer.name}</h2><span className="text-sm text-slate-300">{compatibility == null ? 'Not assessed' : `${compatibility}% skill readiness`}</span></div>{isRoadmapLoading && <p role="status" className="mt-3 text-sm text-cyan-200">Comparing confirmed skills with role requirements…</p>}{roadmapError && <div role="alert" className="mt-3 text-sm text-amber-200">{roadmapError}<button type="button" onClick={() => setRetryCount(value => value + 1)} className="ml-2 underline">Retry</button></div>}{skillGapResult && <div className="mt-4 grid gap-4 md:grid-cols-3">{[['Strong areas', skillGapResult.masteredSkills], ['Developing', skillGapResult.developingSkills], ['Not found in your profile', [...skillGapResult.criticalMissingSkills, ...skillGapResult.missingSkills]]].map(([label, items]) => <div key={label}><h3 className="text-xs font-semibold text-slate-200">{label}</h3><div className="mt-2 flex flex-wrap gap-1.5">{items.length ? items.map(skill => <span key={skill} className="rounded-md border border-slate-800 px-2 py-1 text-[11px] text-slate-300">{skill}</span>) : <span className="text-xs text-slate-500">None identified</span>}</div></div>)}</div>}<button type="button" onClick={() => setActiveTab('roadmap')} className="mt-4 rounded-lg border border-slate-700 px-3 py-2 text-xs text-slate-200">View this role’s roadmap</button></section>}
          </>}


          {pageMode === 'skills' && workspaceTab === 'goals' && currentCareer && <section className="p-5 sm:p-6 rounded-2xl bg-vortex-card border border-vortex-border space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"><div><p className="text-[10px] font-mono text-cyan-300">04 · SKILL GAP ANALYSIS</p><h2 className="mt-1 text-lg font-semibold text-white">{currentCareer?.name || 'Choose a career target'}</h2></div><div className="text-sm font-mono text-cyan-200">{compatibility == null ? 'Not assessed' : `${compatibility}% readiness`}</div></div>
            {isRoadmapLoading && <p role="status" className="text-xs text-cyan-200">Analyzing confirmed skills against the selected role…</p>}
            {roadmapError && <div role="alert" className="rounded-lg border border-amber-500/25 bg-amber-500/5 p-3 text-xs text-amber-100"><p>{roadmapError}</p><button type="button" onClick={() => setRetryCount(value => value + 1)} className="mt-2 underline">Retry analysis</button></div>}
            {skillGapResult && <>
              <div className="h-2 rounded-full bg-slate-800 overflow-hidden"><div className="h-full rounded-full bg-cyan-400 transition-all" style={{ width: `${compatibility}%` }} /></div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3"><div className="rounded-xl border border-rose-500/20 bg-rose-500/5 p-3"><h3 className="text-xs font-semibold text-rose-200">Critical Gaps · {skillGapResult.criticalMissingSkills.length}</h3><div className="mt-2 flex flex-wrap gap-1.5">{skillGapResult.criticalMissingSkills.map(skill => <span key={skill} title={skillGapResult.skillDetails.find(item => item.skill === skill)?.reason} className="rounded-md bg-rose-500/10 px-2 py-1 text-[11px] text-rose-100">{skill}</span>)}</div></div><div className="rounded-xl border border-amber-500/20 bg-amber-500/5 p-3"><h3 className="text-xs font-semibold text-amber-200">Developing · {skillGapResult.developingSkills.length}</h3><div className="mt-2 flex flex-wrap gap-1.5">{skillGapResult.developingSkills.map(skill => <span key={skill} title={skillGapResult.skillDetails.find(item => item.skill === skill)?.reason} className="rounded-md bg-amber-500/10 px-2 py-1 text-[11px] text-amber-100">{skill}</span>)}</div></div><div className="rounded-xl border border-emerald-500/20 bg-emerald-500/5 p-3"><h3 className="text-xs font-semibold text-emerald-200">Strong Areas · {skillGapResult.masteredSkills.length}</h3><div className="mt-2 flex flex-wrap gap-1.5">{skillGapResult.masteredSkills.map(skill => <span key={skill} title={skillGapResult.skillDetails.find(item => item.skill === skill)?.reason} className="rounded-md bg-emerald-500/10 px-2 py-1 text-[11px] text-emerald-100">{skill}</span>)}</div></div></div>
              <div><div className="flex items-center justify-between gap-2"><h3 className="text-sm font-semibold text-white">Career requirement comparison</h3><span className="text-[10px] text-slate-500">{skillGapResult.requirementCount} ontology requirements</span></div><p className="mt-1 text-[10px] text-slate-500">Matched means a confirmed profile skill; developing means a lower stated level or an explicit ontology relationship. Missing means no sufficient confirmed evidence was found.</p><div className="mt-2 space-y-2">{skillGapResult.requirements?.map(item => <details key={item.canonicalName} className="rounded-lg border border-vortex-border bg-vortex-surface/50 p-3"><summary className="cursor-pointer list-none text-xs font-medium text-white">{item.displayName}<span className="ml-2 text-[9px] uppercase text-slate-400">{item.matchStatus} · {item.importance} · {item.source}</span></summary><p className="mt-2 text-[11px] text-slate-400">{item.reason}</p>{item.evidence?.length > 0 && <p className="mt-1 text-[10px] text-slate-500">Requirement basis: {item.evidence.join(' · ')}</p>}{item.profileEvidence?.length > 0 && <p className="mt-1 text-[10px] text-slate-500">Profile evidence: {item.profileEvidence.map(value => typeof value === 'object' ? value.text : value).join(' · ')}</p>}</details>)}</div></div>
              <div><h3 className="text-sm font-semibold text-white">Prioritized career gaps</h3>{skillGapResult.prioritizedGaps?.length ? <ol className="mt-2 grid grid-cols-1 md:grid-cols-2 gap-2">{skillGapResult.prioritizedGaps.map((item, index) => <li key={`${item.canonicalSkill}-${index}`} className="rounded-lg border border-vortex-border bg-vortex-surface/60 p-3"><p className="text-xs font-semibold text-white"><span className="mr-2 text-cyan-300">{index + 1}.</span>{item.skill}<span className="ml-2 text-[9px] uppercase text-amber-200">{item.priority} · {item.status}</span></p><p className="mt-1 text-[11px] text-slate-400">{item.reason}</p>{item.prerequisites?.length > 0 && <p className="mt-1 text-[10px] text-slate-500">Prerequisites: {item.prerequisites.map(value => value.replace(/\b\w/g, letter => letter.toUpperCase())).join(', ')}</p>}{item.relatedSkills?.length > 0 && <p className="mt-1 text-[10px] text-slate-500">Related confirmed evidence: {item.relatedSkills.join(', ')}</p>}</li>)}</ol> : <p className="mt-2 text-xs text-slate-400">No missing or developing requirements were returned for this career.</p>}<p className="mt-2 text-[10px] text-slate-500">Priority is a deterministic heuristic from importance, requirement dependencies, and evidence coverage. It is not an employment prediction.</p></div>
            </>}
          </section>}

          {pageMode === 'roadmap' && roadmapMode === 'choose' && <section className="grid gap-4 md:grid-cols-2"><article className="rounded-2xl border border-cyan-500/25 bg-cyan-950/20 p-5 sm:p-6"><p className="text-xs font-semibold uppercase tracking-wide text-cyan-300">Individual learning</p><h2 className="mt-2 text-lg font-semibold text-white">Learn a Skill</h2><p className="mt-2 text-sm text-slate-300">Focus on one skill and learn it step by step, at your own pace.</p><p className="mt-2 text-xs text-slate-400">Python · C++ · SQL · NumPy · Git · Docker · Machine Learning · React</p><button type="button" onClick={() => { setRoadmapMode('pick-skill'); setRoadmapSkillSearch(''); }} className="mt-5 min-h-10 rounded-lg bg-cyan-400 px-4 py-2 text-sm font-semibold text-slate-950">Choose a Skill</button></article><article className="rounded-2xl border border-slate-700 bg-slate-900/50 p-5 sm:p-6"><p className="text-xs font-semibold uppercase tracking-wide text-indigo-300">Career preparation</p><h2 className="mt-2 text-lg font-semibold text-white">Follow a Career Roadmap</h2><p className="mt-2 text-sm text-slate-300">Build the skills for a target career through a structured learning path.</p><p className="mt-2 text-xs text-slate-400">Machine Learning / AI · Data Science · Full-Stack · Backend · Cloud / DevOps · IoT · DSA</p><button type="button" onClick={() => setRoadmapMode('pick-career')} className="mt-5 min-h-10 rounded-lg border border-indigo-400/30 px-4 py-2 text-sm font-medium text-indigo-100">Choose a Career</button></article></section>}
          {pageMode === 'roadmap' && roadmapMode === 'pick-skill' && <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 sm:p-6"><h2 className="text-base font-semibold text-white">What do you want to learn?</h2><label className="mt-3 block"><span className="sr-only">Search skills</span><input value={roadmapSkillSearch} onChange={event => setRoadmapSkillSearch(event.target.value)} placeholder="Search supported skills…" className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white focus:border-cyan-500 focus:outline-none" /></label><div className="mt-3 flex flex-wrap gap-2">{(roadmapSkillSearch ? roadmapSkillMatches : ['python', 'c++', 'sql', 'numpy', 'git', 'docker', 'machine learning', 'react'].filter(skill => catalogueSkills.includes(skill))).map(skill => <button key={skill} type="button" onClick={() => startIndividualSkill(skill)} className="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-200 hover:border-cyan-500/50">{skillDisplayName(skill)}</button>)}</div>{!catalogueSkills.length && <p className="mt-3 text-xs text-slate-500">Loading supported skills…</p>}</section>}
          {pageMode === 'roadmap' && roadmapMode === 'pick-career' && <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 sm:p-6"><h2 className="text-base font-semibold text-white">Choose a supported career</h2><div className="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">{targetCareers.map(career => <button key={career.id} type="button" onClick={() => { chooseCareer(career.id); setRoadmapMode('career'); onRoadmapModeChange?.('career'); }} className="rounded-lg border border-slate-800 bg-slate-950/30 p-3 text-left text-sm text-slate-200 hover:border-cyan-500/40">{career.name}<span className="mt-1 block text-xs text-slate-500">{career.skillCount} catalogue skills</span></button>)}</div></section>}

          {pageMode === 'roadmap' && ['career', 'skill', 'job'].includes(roadmapMode) && <RoadmapJourney
            roadmap={learningRoadmap}
            journeyNodes={roadmapJourneyNodes}
            recommendedItem={recommendedRoadmapItem}
            selectedItem={selectedRoadmapItem}
            profile={profile}
            loading={isRoadmapLoading}
            error={roadmapError}
            onRetry={() => setRetryCount(value => value + 1)}
            onSelect={itemId => { setSelectedRoadmapItemId(itemId); onRoadmapSkillSelection?.(); }}
            onActivity={updateRoadmapActivity}
            onChangeGoal={openSkillGoals}
            mode={roadmapMode}
            onOpenJobAnalysis={() => setActiveTab('job-intelligence')}
          />}
        </div>
      );
    }

    function RoadmapJourney({ roadmap, journeyNodes, recommendedItem, selectedItem, profile, loading, error, onRetry, onSelect, onActivity, onChangeGoal, mode = 'career', onOpenJobAnalysis }) {
      const activeByCanonical = new Map(journeyNodes.filter(item => !item.isConfirmed).map(item => [item.canonicalSkill, item]));
      const completion = roadmap?.completion || {};
      const completedCount = Number(completion.completedItems) || 0;
      const totalCount = Number(completion.totalItems) || journeyNodes.length;
      const completionPercent = Number.isFinite(Number(completion.percent)) ? Math.max(0, Math.min(100, Number(completion.percent))) : 0;
      const targetLabel = roadmap?.target || profile.latestJobMatch?.summary?.title || 'your learning goals';
      const jobRequirements = mode === 'job' ? (roadmap?.jobRequirements || profile.latestJobMatch?.requirements || []) : [];
      const jobGaps = jobRequirements.filter(requirement => requirement.status !== 'matched');
      const jobReadiness = roadmap?.skillGapAnalysis?.readinessScore;
      const getBlockedPrerequisites = item => {
        const prerequisiteNames = item?.unresolvedPrerequisites?.length
          ? item.unresolvedPrerequisites
          : (item?.prerequisiteDetails || []).filter(prerequisite => prerequisite.status === 'active_gap').map(prerequisite => prerequisite.canonicalSkill);
        return prerequisiteNames.map(canonical => activeByCanonical.get(canonical)).filter(prerequisite => prerequisite && prerequisite.status !== 'completed').map(prerequisite => prerequisite.skill);
      };
      const selectedIndex = journeyNodes.findIndex(item => item.id === selectedItem?.id);
      const completedBeforeSelected = journeyNodes.slice(0, Math.max(0, selectedIndex)).filter(item => item.status === 'completed').slice(-2).map(item => item.skill);
      const jobItems = (roadmap?.roadmapItems || []).filter(item => item.sources?.includes('job'));
      const scrollToDetails = item => {
        onSelect(item.id);
        document.getElementById('roadmap-skill-details')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      const whyRecommended = item => {
        if (!item) return '';
        if (item.sources?.includes('job')) return `Your analyzed target job calls for ${item.skill}. This skill is now part of your learning path.`;
        if (item.isGoal) return `You chose ${item.skill} as a learning goal, so it is included in your path.`;
        const unlocks = (roadmap?.roadmapItems || []).filter(candidate => candidate.prerequisites?.includes(item.skill)).slice(0, 2).map(candidate => candidate.skill);
        if (unlocks.length) return `Learning ${item.skill} gives you a foundation for ${unlocks.join(' and ')}.`;
        if (completedBeforeSelected.length) return `You've completed ${completedBeforeSelected.join(' and ')}. ${item.skill} is the next step toward ${targetLabel}.`;
        return `${item.skill} is part of the learning path for ${targetLabel}.`;
      };
      const activityLabel = status => status === 'completed' ? 'Done' : status === 'in_progress' ? 'In progress' : 'Not started';

      return <div className="space-y-6">
        {loading && <div role="status" className="rounded-xl border border-cyan-500/20 bg-cyan-500/5 p-4 text-sm text-cyan-100">Building your learning path from your saved skills and goals…</div>}
        {error && <div role="alert" className="rounded-xl border border-amber-500/25 bg-amber-500/5 p-4 text-sm text-amber-100"><p>{error}</p><button type="button" onClick={onRetry} className="mt-2 text-xs underline underline-offset-2">Try again</button></div>}

        {mode === 'job' && !loading && !error && jobRequirements.length > 0 && jobGaps.length === 0 && journeyNodes.length === 0 ? <section className="rounded-2xl border border-emerald-500/25 bg-emerald-500/5 p-5 sm:p-6"><p className="text-xs font-semibold uppercase tracking-wide text-emerald-200">Job readiness</p><h2 className="mt-2 text-lg font-semibold text-white">All {jobRequirements.length} recognized requirements are covered</h2><p className="mt-2 text-sm text-slate-300">Your saved confirmed skills cover the requirements in {targetLabel}. No additional learning targets were created.</p>{Number.isFinite(Number(jobReadiness)) && <p className="mt-2 text-sm text-emerald-100">Current readiness: {Math.round(Number(jobReadiness))}%</p>}<button type="button" onClick={onOpenJobAnalysis} className="mt-4 min-h-10 rounded-lg border border-emerald-400/30 px-4 py-2 text-sm text-emerald-100 hover:bg-emerald-400/10">Return to Job Intelligence</button></section>
        : mode === 'job' && !loading && !error && jobRequirements.length === 0 ? <section role="status" className="rounded-2xl border border-amber-500/25 bg-amber-500/5 p-5 sm:p-6"><h2 className="text-base font-semibold text-white">No saved job requirements found</h2><p className="mt-2 text-sm leading-relaxed text-slate-300">Analyze a job description in Job Intelligence to build a targeted roadmap from its recognized skill requirements.</p><button type="button" onClick={onOpenJobAnalysis} className="mt-4 min-h-11 rounded-lg bg-cyan-400 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-cyan-300">Analyze a Job Description</button></section>
        : journeyNodes.length > 0 ? <>
          {mode === 'job' ? <section aria-label="Job readiness and skill gaps" className="rounded-2xl border border-vortex-border bg-vortex-card p-5 sm:p-6"><div className="flex flex-wrap items-end justify-between gap-2"><div><p className="text-sm font-semibold text-white">{Number.isFinite(Number(jobReadiness)) ? `${Math.round(Number(jobReadiness))}% job readiness` : 'Job readiness'}</p><p className="mt-1 text-xs text-slate-400">{jobGaps.length} of {jobRequirements.length} recognized requirements have a developing or missing status.</p></div><span className="text-xs text-slate-400">Based on confirmed profile skills</span></div>{Number.isFinite(Number(jobReadiness)) && <div className="mt-3 h-2.5 overflow-hidden rounded-full bg-slate-800" role="progressbar" aria-label="Job requirement coverage" aria-valuemin="0" aria-valuemax="100" aria-valuenow={Math.max(0, Math.min(100, Number(jobReadiness)))}><div className="h-full rounded-full bg-emerald-400 transition-all duration-500" style={{ width: `${Math.max(0, Math.min(100, Number(jobReadiness)))}%` }} /></div>}</section>
          : <section aria-label="Overall roadmap progress" className="rounded-2xl border border-vortex-border bg-vortex-card p-5 sm:p-6">
            <div className="flex flex-wrap items-end justify-between gap-2"><div><p className="text-sm font-semibold text-white">{completionPercent}% complete</p><p className="mt-1 text-xs text-slate-400">{completedCount} of {totalCount} skills completed</p></div><span className="text-xs text-slate-400">Your progress is saved to your profile</span></div>
            <div className="mt-3 h-2.5 overflow-hidden rounded-full bg-slate-800" role="progressbar" aria-label="Learning path progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow={completionPercent}><div className="h-full rounded-full bg-emerald-400 transition-all duration-500" style={{ width: `${completionPercent}%` }} /></div>
          </section>}

          {recommendedItem ? <section className="rounded-2xl border border-cyan-500/30 bg-gradient-to-br from-cyan-950/45 to-slate-900 p-5 shadow-lg shadow-cyan-950/10 sm:p-7">
            <div className="flex flex-wrap items-start justify-between gap-3"><div><p className="text-[11px] font-semibold uppercase tracking-[0.16em] text-cyan-300">Continue learning</p><h2 className="mt-2 text-2xl font-semibold text-white sm:text-3xl">{recommendedItem.skill}</h2><p className="mt-2 max-w-2xl text-sm leading-relaxed text-slate-300">{recommendedItem.learning?.guidance || `Build your ${recommendedItem.skill} skills for ${targetLabel}.`}</p></div><span className="rounded-full border border-cyan-400/20 bg-cyan-400/10 px-3 py-1 text-xs text-cyan-100">{recommendedItem.stageName || 'Next step'}</span></div>
            <div className="mt-5 rounded-xl border border-white/5 bg-slate-950/30 p-3 sm:p-4"><p className="text-[10px] font-semibold uppercase tracking-wide text-slate-400">Why this is next</p><p className="mt-1 text-sm leading-relaxed text-slate-200">{whyRecommended(recommendedItem)}</p></div>
            {(() => { const steps = ['learning', 'practice', 'verification']; const done = steps.filter(name => recommendedItem[name]?.status === 'completed').length; const percent = Math.round(done * 100 / steps.length); return <div className="mt-4"><div className="flex justify-between text-xs text-slate-300"><span>{done} of {steps.length} learning steps complete</span><span>{percent}%</span></div><div className="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-800"><div className="h-full rounded-full bg-cyan-400 transition-all" style={{ width: `${percent}%` }} /></div></div>; })()}
            <button type="button" onClick={() => scrollToDetails(recommendedItem)} className="mt-5 inline-flex min-h-11 items-center justify-center rounded-lg bg-cyan-400 px-5 py-2.5 text-sm font-semibold text-slate-950 transition hover:bg-cyan-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-300">Continue Learning <span aria-hidden="true" className="ml-2">→</span></button>
          </section> : <section className="rounded-2xl border border-emerald-500/25 bg-emerald-500/5 p-5 sm:p-6"><p className="text-sm font-semibold text-emerald-100">Your learning path is complete</p><p className="mt-1 text-sm text-slate-300">Choose another goal or target role to build a new path.</p><button type="button" onClick={onChangeGoal} className="mt-4 min-h-10 rounded-lg border border-emerald-400/30 px-4 py-2 text-sm text-emerald-100 hover:bg-emerald-400/10">Change Goal</button></section>}

          <div className="grid min-w-0 gap-5 lg:grid-cols-[minmax(0,0.85fr)_minmax(0,1.15fr)]">
            <section aria-labelledby="roadmap-journey-heading" className="min-w-0 rounded-2xl border border-vortex-border bg-vortex-card p-5 sm:p-6">
              <div className="mb-5"><h2 id="roadmap-journey-heading" className="text-lg font-semibold text-white">Your journey</h2><p className="mt-1 text-xs text-slate-400">Select a skill to see what to learn and do next.</p></div>
              {(() => {
                const groups = [...journeyNodes.reduce((map, item) => {
                  const title = item.phaseTitle || 'Learning journey';
                  if (!map.has(title)) map.set(title, []);
                  map.get(title).push(item);
                  return map;
                }, new Map()).entries()];
                const currentGroup = Math.max(0, groups.findIndex(([, items]) => items.some(item => item.id === recommendedItem?.id)));
                return <div className="space-y-2">{groups.map(([title, items], groupIndex) => <details key={title} open={groupIndex === currentGroup} className="rounded-lg border border-slate-800 bg-slate-950/20 p-3"><summary className="cursor-pointer list-none text-xs font-semibold uppercase tracking-wide text-slate-300">{title}<span className="ml-2 text-[10px] font-normal normal-case text-slate-500">{items.filter(item => item.status === 'completed').length}/{items.length} complete</span></summary><ol className="mt-3 space-y-1">
                {items.map(item => {
                  const index = journeyNodes.indexOf(item);
                  const complete = item.status === 'completed';
                  const isCurrent = item.id === recommendedItem?.id;
                  const blockedBy = getBlockedPrerequisites(item);
                  const locked = !complete && blockedBy.length > 0;
                  const label = complete ? 'Completed' : locked ? `Complete ${blockedBy.join(', ')} first` : isCurrent ? 'You’re learning this' : item.status === 'in_progress' ? 'In progress' : 'Upcoming';
                  const selected = selectedItem?.id === item.id;
                  return <li key={item.id} className="relative min-w-0 pb-2 pl-11 last:pb-0">

                    <button type="button" aria-pressed={selected} onClick={() => onSelect(item.id)} className={`block min-h-14 w-full min-w-0 rounded-xl border p-3 text-left transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-cyan-400 ${selected ? 'border-cyan-400/50 bg-cyan-500/5' : complete ? 'border-emerald-900/50 bg-slate-950/20 hover:border-emerald-700/60' : isCurrent ? 'border-cyan-700/40 bg-cyan-950/20 hover:border-cyan-500/60' : 'border-slate-800 bg-slate-950/20 hover:border-slate-600'}`}>

                    </button>
