    // =========================================================================
    // 6. CAREER ACTION CENTER
    // =========================================================================
    function CareerActionTab({ profile, setActiveTab, openCareerAnalysis, openSkillGap, openLearningPlan }) {
      const [analysis, setAnalysis] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [retryCount, setRetryCount] = useState(0);
      const hasProfileData = (Array.isArray(profile.skills) && profile.skills.length > 0) || Boolean(profile.degree || profile.education || profile.college || profile.cgpa) || (Array.isArray(profile.interests) && profile.interests.length > 0) || Boolean(profile.projects && (Array.isArray(profile.projects) ? profile.projects.length : String(profile.projects).trim()));
      const profileComplete = Boolean(String(profile.name || '').trim() && String(profile.degree || '').trim() && Array.isArray(profile.skills) && profile.skills.length > 0);

      useEffect(() => {
        const controller = new AbortController();
        if (!hasProfileData) { setAnalysis(null); setError(''); setLoading(false); return () => controller.abort(); }
        setLoading(true);
        setError('');
        fetch('/api/ai/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profile }), signal: controller.signal })
          .then(async response => {
            let result;
            try { result = await response.json(); } catch (parseError) { throw new Error('The career service returned an unreadable response.'); }
            if (!response.ok) throw new Error(result?.error || `Career analysis failed (${response.status}).`);
            if (!result || !Array.isArray(result.topRecommendations)) throw new Error('Career analysis returned an invalid recommendation list.');
            return result;
          })
          .then(result => { if (!controller.signal.aborted) setAnalysis(result); })
          .catch(requestError => {
            if (requestError.name !== 'AbortError') {
              console.error('Career Action Center analysis request failed:', requestError);
              setAnalysis(null);
              setError(/failed to fetch|networkerror/i.test(String(requestError.message)) ? 'The career service is unavailable. Check the backend connection and try again.' : (requestError.message || 'Career analysis is temporarily unavailable.'));
            }
          })
          .finally(() => { if (!controller.signal.aborted) setLoading(false); });
        return () => controller.abort();
      }, [profile, retryCount]);

      const recommendations = Array.isArray(analysis?.topRecommendations) ? analysis.topRecommendations.filter(item => !EXCLUDED_TARGET_CAREER_IDS.has(String(item?.id || '').toLowerCase())) : [];
      const rawExplicitTarget = String(profile.targetCareer || profile.targetRole || '');
      const explicitTarget = resolveTargetCareerId(rawExplicitTarget);
      const explicitRecommendation = recommendations.find(item => item.id === explicitTarget || String(item.title || '').toLowerCase() === explicitTarget.toLowerCase());
      const explicitTemplate = CAREERS_MASTER_DATA.find(item => item.id === explicitTarget || String(item.title || '').toLowerCase() === explicitTarget.toLowerCase());
      const target = explicitRecommendation || (explicitTarget ? {
        id: explicitTemplate?.id || explicitTarget,
        title: explicitTemplate?.title || ({ 'cyber-defense': 'Cybersecurity Defense Analyst', 'data-science': 'Data Science' }[explicitTarget] || explicitTarget),
        skillGapAnalysis: analysis?.skillGapAnalysis,
        learningRoadmap: analysis?.learningRoadmap
      } : recommendations[0] || null);
      const skillGap = target?.skillGapAnalysis || analysis?.skillGapAnalysis || null;
      const roadmap = target?.learningRoadmap || analysis?.learningRoadmap || null;
      const projectCount = Array.isArray(profile.projects) ? profile.projects.filter(item => typeof item === 'string' ? item.trim() : item && typeof item === 'object' && Object.values(item).some(value => String(value || '').trim())).length : (String(profile.projects || '').trim() ? 1 : 0);
      const skillItems = Array.isArray(roadmap?.priorityRanking) ? roadmap.priorityRanking.filter(item => item?.skill && ['critical_missing', 'missing', 'developing'].includes(item.currentStatus)) : [];
      // Deterministic priority: critical missing roadmap skills first, then other missing skills, then developing skills; profile actions require a field actually absent from the saved profile.
      const firstGap = skillItems.find(item => item.currentStatus === 'critical_missing') || skillItems.find(item => item.currentStatus === 'missing') || skillItems.find(item => item.currentStatus === 'developing') || null;
      const skillPriority = firstGap?.currentStatus === 'critical_missing' ? 'HIGH PRIORITY' : firstGap?.currentStatus === 'missing' ? 'MEDIUM PRIORITY' : 'QUICK WIN';
      const skillSteps = firstGap ? [...(Array.isArray(firstGap.prerequisites) ? firstGap.prerequisites : []), firstGap.skill].filter((value, index, list) => value && list.indexOf(value) === index).slice(-4) : [];
      const actions = [];
      if (firstGap && target) actions.push({ key: 'skill', priority: skillPriority, title: `Build ${firstGap.skill}`, reason: firstGap.reason || `${firstGap.skill} is listed as ${firstGap.currentStatus.replace('_', ' ')} in the target career roadmap.`, steps: skillSteps, verify: firstGap.verification, skill: firstGap.skill, buttons: [{ label: 'View Skill Gap', run: () => openSkillGap(target.id) }, { label: 'Open Learning Plan', run: () => openLearningPlan(target.id) }] });
      if (!projectCount) actions.push({ key: 'project', priority: 'QUICK WIN', title: 'Add project evidence to your profile', reason: 'No project details are present in your saved profile, so the career analysis has no project evidence to assess.', steps: ['Add a project and your contribution', 'List the technologies you used', 'Include outcomes you can substantiate'], buttons: [{ label: 'Update Profile', run: () => setActiveTab('profile') }, { label: 'Open LinkedIn guidance', run: () => setActiveTab('linkedin') }] });
      if (!String(profile.linkedin || '').trim()) actions.push({ key: 'linkedin', priority: 'QUICK WIN', title: 'Add your LinkedIn profile link', reason: 'The saved profile does not include a LinkedIn URL; no external profile has been inspected.', steps: ['Add your LinkedIn URL in Profile', 'Review the profile presentation guidance'], buttons: [{ label: 'Update Profile', run: () => setActiveTab('profile') }, { label: 'LinkedIn guidance', run: () => setActiveTab('linkedin') }] });
      const shownActions = actions.slice(0, 3);
      const stages = [
        { label: 'PROFILE', complete: profileComplete, available: hasProfileData, run: () => setActiveTab('profile') },
        { label: 'CAREER TARGET', complete: Boolean(target), available: hasProfileData, run: openCareerAnalysis },
        { label: 'SKILL GAP', complete: Boolean(skillGap), available: Boolean(target), run: () => openSkillGap(target?.id || '') },
        { label: 'LEARNING', complete: Boolean(roadmap?.phases?.length), available: Boolean(target), run: () => openLearningPlan(target?.id || '') },
        { label: 'PROJECT PROOF', complete: projectCount > 0, available: hasProfileData, run: () => setActiveTab('profile') },
        { label: 'LINKEDIN LINK', complete: Boolean(String(profile.linkedin || '').trim()), available: true, run: () => setActiveTab('linkedin') },
        { label: 'OPPORTUNITY', complete: false, available: false, run: () => {} }
      ];
      const activeStage = Math.max(0, stages.findIndex(stage => !stage.complete && stage.available));
      const status = error ? 'ACTION ANALYSIS TEMPORARILY UNAVAILABLE' : !profileComplete ? 'COMPLETE PROFILE TO CONTINUE' : loading ? 'PROFILE ANALYZED' : target && skillGap ? 'ACTIONS READY' : 'PROFILE ANALYZED';

      return (
        <div className="space-y-6 animate-fadeIn">
          <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-vortex-border">
            <div><p className="text-xs font-mono text-cyan-400 mb-1">CAREER ACTION CENTER • PERSONALIZED NEXT STEPS</p><h1 className="text-2xl sm:text-3xl font-display font-extrabold text-white">Career Action Center</h1><p className="text-xs text-slate-300 mt-1">Turn your career analysis into a prioritized action plan.</p></div>
            <div className={`inline-flex items-center gap-2 self-start px-3 py-2 rounded-full border text-[10px] font-mono tracking-wider ${status === 'ACTIONS READY' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : error ? 'bg-amber-500/10 border-amber-500/30 text-amber-200' : 'bg-slate-800/70 border-slate-700 text-slate-300'}`} role="status"><span className={`w-2 h-2 rounded-full ${status === 'ACTIONS READY' ? 'bg-emerald-400' : error ? 'bg-amber-400' : 'bg-slate-400'}`} />{status}</div>
          </header>

          {!hasProfileData ? <section className="p-6 sm:p-8 rounded-3xl bg-vortex-card border border-vortex-border"><p className="text-xs font-mono text-cyan-300">WELCOME TO YOUR CAREER ACTION CENTER</p><h2 className="mt-2 text-xl font-bold text-white">Your personalized actions will appear here after you complete your profile.</h2><ol className="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm text-slate-300"><li className="p-3 rounded-xl bg-vortex-surface"><span className="text-cyan-300 font-mono mr-2">01</span>Create your profile</li><li className="p-3 rounded-xl bg-vortex-surface"><span className="text-cyan-300 font-mono mr-2">02</span>Choose your target career</li><li className="p-3 rounded-xl bg-vortex-surface"><span className="text-cyan-300 font-mono mr-2">03</span>Run Career Analysis</li><li className="p-3 rounded-xl bg-vortex-surface"><span className="text-cyan-300 font-mono mr-2">04</span>Receive your personalized action plan</li></ol><button type="button" onClick={() => setActiveTab('profile')} className="mt-5 px-4 py-2 rounded-xl bg-cyan-500/15 border border-cyan-400/30 text-cyan-200 text-sm">Create Profile</button></section> : (
            <>
              <section className="grid grid-cols-1 sm:grid-cols-3 gap-3 p-5 rounded-3xl bg-gradient-to-br from-cyan-950/50 to-indigo-950/40 border border-cyan-500/20">
                <div className="sm:col-span-3"><p className="text-[10px] font-mono tracking-wider text-cyan-300">{explicitTarget && target ? 'YOUR CURRENT TARGET' : 'RECOMMENDED CAREER MATCH'}</p><h2 className="mt-1 text-xl sm:text-2xl font-display font-bold text-white">{target?.title || explicitTarget || 'Career analysis needed'}</h2>{target && !explicitTarget && <p className="mt-1 text-xs text-slate-400">Top match from your profile. Choose a target career in Skill Gap to set your focus.</p>}</div>
                <div className="p-3 rounded-xl bg-slate-950/30"><p className="text-[10px] text-slate-400 uppercase">Career Match</p><p className="mt-1 text-lg font-bold text-white">{Number.isFinite(Number(target?.scoreBreakdown?.overall ?? target?.matchScore)) ? `${Math.round(Number(target.scoreBreakdown?.overall ?? target.matchScore))}%` : 'Not assessed yet'}</p></div>
                <div className="p-3 rounded-xl bg-slate-950/30"><p className="text-[10px] text-slate-400 uppercase">Skill Readiness</p><p className="mt-1 text-lg font-bold text-white">{Number.isFinite(Number(skillGap?.readinessScore)) ? `${Math.round(Number(skillGap.readinessScore))} / 100` : 'Not assessed yet'}</p></div>
                <div className="p-3 rounded-xl bg-slate-950/30"><p className="text-[10px] text-slate-400 uppercase">Priority Actions</p><p className="mt-1 text-lg font-bold text-white">{shownActions.length || (loading ? '…' : '0')}</p></div>
              </section>

              {loading && <div className="p-4 rounded-2xl bg-vortex-card border border-vortex-border text-sm text-slate-300" role="status">Loading your profile-based career analysis…</div>}
              {error && <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-sm text-amber-100" role="alert"><p className="font-semibold">ACTION ANALYSIS TEMPORARILY UNAVAILABLE</p><p className="mt-1">We couldn’t retrieve your latest analysis. Your saved profile is safe.</p><button type="button" onClick={() => setRetryCount(value => value + 1)} className="mt-3 underline underline-offset-2">Retry</button></div>}

              <section className="space-y-3" aria-labelledby="top-actions-title"><div className="flex items-end justify-between"><div><p className="text-[10px] font-mono text-cyan-400">BASED ON YOUR SAVED PROFILE AND PRACTICE</p><h2 id="top-actions-title" className="text-xl font-display font-bold text-white mt-1">Your Top Actions</h2></div>{target && <button type="button" onClick={openCareerAnalysis} className="text-xs text-cyan-300 hover:text-white">Review career analysis →</button>}</div>
                {!loading && !error && !target && <div className="p-5 rounded-2xl bg-vortex-card border border-vortex-border text-sm text-slate-300">Career recommendations are not available for this profile yet. Add candidate details and run Career Analysis. <button type="button" onClick={openCareerAnalysis} className="ml-1 text-cyan-300 underline">Open Career Analysis</button></div>}
                {!loading && !error && target && shownActions.length === 0 && <div className="p-5 rounded-2xl bg-vortex-card border border-vortex-border text-sm text-slate-300">No skill gaps or profile follow-ups were returned for this analysis. Review the role breakdown for details.</div>}
                {shownActions.map((action, index) => <article key={action.key} className="p-5 sm:p-6 rounded-2xl bg-vortex-card border border-vortex-border hover:border-cyan-500/30 transition-colors"><div className="flex flex-wrap items-center justify-between gap-2"><span className={`text-[10px] font-mono font-bold tracking-wider ${action.priority === 'HIGH PRIORITY' ? 'text-rose-300' : action.priority === 'MEDIUM PRIORITY' ? 'text-amber-300' : 'text-emerald-300'}`}>{action.priority}</span><span className="text-[10px] text-slate-500 font-mono">ACTION {index + 1}</span></div><h3 className="mt-2 text-lg font-bold text-white">{action.title}</h3><p className="mt-3 text-[10px] font-mono text-slate-400 uppercase">Why this matters</p><p className="mt-1 text-sm leading-relaxed text-slate-300">{action.reason}</p><div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4"><div><p className="text-[10px] font-mono text-slate-400 uppercase">What to do next</p><ol className="mt-2 space-y-1.5 text-sm text-slate-200">{action.steps.map((step, stepIndex) => <li key={`${step}-${stepIndex}`}><span className="text-cyan-400 mr-2">{stepIndex + 1}.</span>{step}</li>)}</ol></div>{action.verify && <div className="p-3 rounded-xl bg-vortex-surface border border-vortex-border"><p className="text-[10px] font-mono text-slate-400 uppercase">Verification</p><p className="mt-1 text-xs text-slate-200">{action.verify}</p></div>}</div><div className="flex flex-wrap gap-2 mt-5">{action.buttons.map(button => <button key={button.label} type="button" onClick={button.run} className="px-3 py-2 rounded-lg border border-vortex-border text-xs font-semibold text-slate-200 hover:text-white hover:border-cyan-500/40">{button.label}</button>)}</div></article>)}
              </section>

              <section className="p-5 rounded-2xl bg-vortex-card border border-vortex-border"><div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2"><div><p className="text-[10px] font-mono text-cyan-400">CAREER READINESS JOURNEY</p><h2 className="mt-1 text-lg font-display font-bold text-white">Your next milestones</h2></div><p className="text-[10px] text-slate-500">Opportunity applications are not tracked here.</p></div><div className="mt-5 grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-8 gap-2">{stages.map((stage, index) => <button key={stage.label} type="button" disabled={!stage.available} onClick={stage.run} className={`relative p-3 rounded-xl border text-left transition-colors ${stage.complete ? 'bg-emerald-500/10 border-emerald-500/25' : index === activeStage ? 'bg-cyan-500/10 border-cyan-400/40' : 'bg-slate-950/20 border-vortex-border'} ${stage.available ? 'hover:border-cyan-400/50' : 'opacity-60 cursor-default'}`}><span className={`flex w-6 h-6 rounded-full items-center justify-center text-xs ${stage.complete ? 'bg-emerald-500/20 text-emerald-300' : index === activeStage ? 'bg-cyan-500/20 text-cyan-200' : 'bg-slate-800 text-slate-500'}`}>{stage.complete ? '✓' : stage.available ? '●' : '→'}</span><span className="block mt-2 text-[9px] font-mono tracking-wide text-slate-200">{stage.label}</span>{index < stages.length - 1 && <span className="hidden xl:block absolute top-6 -right-2 z-10 text-slate-600">→</span>}</button>)}</div></section>



              <section className="p-5 rounded-2xl bg-vortex-card border border-vortex-border"><p className="text-[10px] font-mono text-cyan-400">QUICK ACTIONS</p><div className="mt-3 flex flex-wrap gap-2">{[{ label: 'Complete Profile', run: () => setActiveTab('profile') }, { label: 'View Career Analysis', run: openCareerAnalysis }, { label: 'Analyze Skill Gap', run: () => openSkillGap(target?.id || '') }, { label: 'Build Learning Plan', run: () => openLearningPlan(target?.id || '') }, { label: 'Optimize LinkedIn', run: () => setActiveTab('linkedin') }].map(item => <button key={item.label} type="button" onClick={item.run} className="px-3 py-2 rounded-lg border border-vortex-border text-xs text-slate-200 hover:text-white hover:border-cyan-500/40">{item.label}</button>)}</div></section>
            </>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7. FOCUS & STRESS STUDIO (MOVED TO THE LAST SLOT AS REQUESTED!)
    // Pomodoro Timer, 4-7-8 Breathing, Ambient Sounds, Plus Refreshment & Patience Games!
    // =========================================================================
    function ProductivityTab({ gainXp, sound }) {
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [isRunning, setIsRunning] = useState(false);
      const [mode, setMode] = useState('focus');
      const [ambientSound, setAmbientSound] = useState('none');
      const [activeGame, setActiveGame] = useState('memory'); // 'memory' or 'reaction'

      // Memory Match Game State
      const MEMORY_CARDS = ['⚡', '🧠', '🐍', '⚛️', '🚀', '💻', '🛡️', '🎯'];
      const [cards, setCards] = useState(() => {
        const deck = [...MEMORY_CARDS, ...MEMORY_CARDS].sort(() => Math.random() - 0.5);
        return deck.map((symbol, idx) => ({ id: idx, symbol, flipped: false, matched: false }));
      });
      const [flippedIndexes, setFlippedIndexes] = useState([]);
      const [matchesFound, setMatchesFound] = useState(0);

      // Reaction Speed & Patience Trainer State
      const [reactionState, setReactionState] = useState('idle'); // 'idle', 'waiting', 'ready', 'result'
      const [reactionTime, setReactionTime] = useState(null);
      const [readyTimestamp, setReadyTimestamp] = useState(0);
      const reactionTimerRef = useRef(null);

      // Breathing State
      const [breathState, setBreathState] = useState('Inhale');
      const [breathCounter, setBreathCounter] = useState(4);
      const [isBreathingActive, setIsBreathingActive] = useState(false);

      // Pomodoro Timer
      useEffect(() => {
        let interval = null;
        if (isRunning && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (timeLeft === 0 && isRunning) {
          setIsRunning(false);
          sound.success();
          gainXp(120, "Finished Focus Work Sprint!");
          alert("🎉 Focus session completed! Take a rejuvenating break.");
        }
        return () => clearInterval(interval);
      }, [isRunning, timeLeft]);

      // Ambient Audio Handler
      const handleAmbientChange = (type) => {
        setAmbientSound(type);
        if (type === 'none') {
          sound.stopAmbient();
        } else {
          sound.startAmbient(type);
        }
      };

      const setTimerMode = (m, minutes) => {
        sound.click();
        setMode(m);
        setIsRunning(false);
        setTimeLeft(minutes * 60);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // 4-7-8 Breathing Loop
      useEffect(() => {
        let timer = null;
        if (isBreathingActive) {
          timer = setInterval(() => {
            setBreathCounter(prev => {
              if (prev <= 1) {
                if (breathState === 'Inhale (4s)') {
                  setBreathState('Hold (7s)');
                  return 7;
                } else if (breathState === 'Hold (7s)') {
                  setBreathState('Exhale (8s)');
                  return 8;
                } else {
                  setBreathState('Inhale (4s)');
                  return 4;
                }
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [isBreathingActive, breathState]);

      // Memory Card Click Handler
      const handleCardClick = (index) => {
        if (flippedIndexes.length === 2 || cards[index].flipped || cards[index].matched) return;
        sound.click();

        const newCards = [...cards];
        newCards[index].flipped = true;
        setCards(newCards);

        const newFlipped = [...flippedIndexes, index];
        setFlippedIndexes(newFlipped);

        if (newFlipped.length === 2) {
          const [firstIdx, secondIdx] = newFlipped;
          if (newCards[firstIdx].symbol === newCards[secondIdx].symbol) {
            newCards[firstIdx].matched = true;
            newCards[secondIdx].matched = true;
            setCards(newCards);
            setFlippedIndexes([]);
            setMatchesFound(prev => {
              const next = prev + 1;
              if (next === MEMORY_CARDS.length) {
                sound.success();
                gainXp(100, "Cleared Zen Focus Memory Match Game");
              }
              return next;
            });
          } else {
            setTimeout(() => {
              newCards[firstIdx].flipped = false;
              newCards[secondIdx].flipped = false;
              setCards(newCards);
              setFlippedIndexes([]);
            }, 800);
          }
        }
      };

      const resetMemoryGame = () => {
        sound.click();
        const deck = [...MEMORY_CARDS, ...MEMORY_CARDS].sort(() => Math.random() - 0.5);
        setCards(deck.map((symbol, idx) => ({ id: idx, symbol, flipped: false, matched: false })));
        setFlippedIndexes([]);
        setMatchesFound(0);
      };

      // Reaction Speed & Patience Trainer Handlers
      const startReactionGame = () => {
        sound.click();
        setReactionState('waiting');
        setReactionTime(null);

        const delay = 2000 + Math.random() * 3000; // 2 to 5 seconds patience delay
        reactionTimerRef.current = setTimeout(() => {
          setReactionState('ready');
          setReadyTimestamp(Date.now());
          sound.beep();
        }, delay);
      };

      const handleReactionClick = () => {
        if (reactionState === 'waiting') {
          // Clicked too early! Impatience penalty
          clearTimeout(reactionTimerRef.current);
          setReactionState('result');
          setReactionTime('TOO_EARLY');
          sound.beep();
        } else if (reactionState === 'ready') {
          // Success! Measure reaction time
          const elapsed = Date.now() - readyTimestamp;
          setReactionTime(elapsed);
          setReactionState('result');
          sound.success();
          gainXp(40, `Patience & Reaction Test: ${elapsed}ms`);
        }
      };

      return (
        <div className="space-y-8 animate-fadeIn">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-vortex-border">
            <div>
              <div className="flex items-center gap-2 text-xs font-mono text-cyan-400 mb-1">
                <span>MENTAL FORTITUDE & REFRESHMENT</span>
                <span>•</span>
                <span>Slot 08 (Last Slot)</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-display font-extrabold text-white">Focus & Stress Management Studio</h1>
              <p className="text-xs text-slate-300">Use a focus timer, guided breathing, and short games during study breaks.</p>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-400 font-mono">Ambient Audio:</span>
              {['none', 'rain', 'binaural', 'whitenoise'].map((type) => (
                <button
                  key={type}
                  onClick={() => handleAmbientChange(type)}
                  className={`px-2.5 py-1 rounded-lg text-[10px] font-mono capitalize transition-all ${ambientSound === type
                      ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40'
                      : 'bg-vortex-card border border-vortex-border text-slate-400'
                    }`}
                >
                  {type}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Left 5 Cols: Pomodoro Clock Box + 4-7-8 Breathing Circle */}
            <div className="lg:col-span-5 space-y-6">
              {/* Pomodoro Clock Box */}
              <div className="p-6 rounded-3xl bg-vortex-card border border-vortex-border space-y-6 text-center relative overflow-hidden">
                <div className="flex items-center justify-center gap-2">
                  <button
                    onClick={() => setTimerMode('focus', 25)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono transition-all ${mode === 'focus' ? 'bg-cyan-500 text-black font-bold' : 'text-slate-400 hover:text-white'
                      }`}
                  >
                    25m Focus
                  </button>
                  <button
                    onClick={() => setTimerMode('shortBreak', 5)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono transition-all ${mode === 'shortBreak' ? 'bg-emerald-500 text-black font-bold' : 'text-slate-400 hover:text-white'
                      }`}
                  >
                    5m Break
                  </button>
                  <button
                    onClick={() => setTimerMode('longBreak', 15)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono transition-all ${mode === 'longBreak' ? 'bg-purple-500 text-white font-bold' : 'text-slate-400 hover:text-white'
                      }`}
                  >
                    15m Reset
                  </button>
                </div>

                {/* Big Glowing Timer Display */}
                <div className="font-mono text-6xl sm:text-7xl font-extrabold tracking-tighter text-white py-4 drop-shadow-[0_0_25px_rgba(6,182,212,0.3)]">
                  {formatTime(timeLeft)}
                </div>

                {/* Controls */}
                <div className="flex items-center justify-center gap-4">
                  <button
                    onClick={() => {
                      sound.click();
                      setIsRunning(!isRunning);
                    }}
                    className={`px-8 py-3 rounded-xl font-display font-bold text-sm text-white shadow-lg transition-all ${isRunning
                        ? 'bg-amber-600 hover:bg-amber-500'
                        : 'bg-gradient-to-r from-cyan-500 to-indigo-600 hover:shadow-cyan-500/30'
                      }`}
                  >
                    {isRunning ? '⏸ Pause Focus' : '▶ Start Focus Session'}
                  </button>
                  <button
                    onClick={() => {
                      sound.click();
                      setIsRunning(false);
                      setTimeLeft(mode === 'focus' ? 25 * 60 : mode === 'shortBreak' ? 5 * 60 : 15 * 60);
                    }}
                    className="p-3 rounded-xl bg-vortex-surface border border-vortex-border text-slate-300 hover:text-white"
                    title="Reset Timer"
                  >
                    🔄
                  </button>
                </div>
              </div>

              {/* Stress Decompression: 4-7-8 Guided Breathing Circle */}
              <div className="p-6 rounded-3xl bg-vortex-card border border-vortex-border space-y-4 text-center">
                <div className="flex items-center justify-between">
                  <h3 className="font-display font-bold text-sm text-white flex items-center gap-2">
                    <span>🧘</span>
                    <span>4-7-8 Parasympathetic Calm</span>
                  </h3>
                  <button
                    onClick={() => {
                      sound.click();
                      setIsBreathingActive(!isBreathingActive);
                      if (!isBreathingActive) {
                        setBreathState('Inhale (4s)');
                        setBreathCounter(4);
                        gainXp(30, "Started Guided De-stress Breathing");
                      }
                    }}
                    className="text-xs px-2.5 py-1 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-mono"
                  >
                    {isBreathingActive ? 'Stop' : 'Start Guided Breathing'}
                  </button>
                </div>

                <div className="flex flex-col items-center justify-center py-4">
                  <div
                    className={`w-32 h-32 rounded-full border-4 border-cyan-400/40 flex flex-col items-center justify-center transition-all duration-1000 ${isBreathingActive && breathState.includes('Inhale')
                        ? 'scale-125 bg-cyan-500/20 border-cyan-400 shadow-[0_0_30px_rgba(6,182,212,0.4)]'
                        : isBreathingActive && breathState.includes('Hold')
                          ? 'scale-125 bg-purple-500/20 border-purple-400'
                          : 'scale-100 bg-vortex-surface'
                      }`}
                  >
                    <span className="font-display font-bold text-xs text-cyan-300">{breathState}</span>
                    <span className="font-mono text-2xl font-extrabold text-white mt-1">{breathCounter}s</span>
                  </div>
                </div>

                <p className="text-xs text-slate-300">
                  Follow the timed breathing pattern at a comfortable pace. This exercise does not measure stress or guarantee a health outcome.
                </p>
              </div>
            </div>

            {/* Right 7 Cols: REFRESHMENT GAMES FOR FOCUS & PATIENCE */}
            <div className="lg:col-span-7 space-y-4">
              <div className="p-6 rounded-3xl bg-vortex-card border border-vortex-border space-y-5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-vortex-border">
                  <div>
                    <h3 className="font-display font-bold text-base text-white flex items-center gap-2">
                      <span>🎮</span>
                      <span>Cognitive Refreshment & Patience Enhancers</span>
                    </h3>
                    <p className="text-xs text-slate-400">Play during study breaks to reset working memory and master patience</p>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={() => { sound.click(); setActiveGame('memory'); }}
                      className={`px-3 py-1.5 rounded-xl text-xs font-mono transition-all ${activeGame === 'memory' ? 'bg-cyan-500 text-black font-bold' : 'bg-vortex-surface text-slate-400'
                        }`}
                    >
                      🧩 Zen Memory Match
                    </button>
                    <button
                      onClick={() => { sound.click(); setActiveGame('reaction'); }}
                      className={`px-3 py-1.5 rounded-xl text-xs font-mono transition-all ${activeGame === 'reaction' ? 'bg-purple-500 text-white font-bold' : 'bg-vortex-surface text-slate-400'
                        }`}
                    >
                      ⏱️ Patience & Reaction
                    </button>
                  </div>
                </div>

                {/* GAME 1: ZEN MEMORY MATCH */}
                {activeGame === 'memory' && (
                  <div className="space-y-4 animate-fadeIn">
                    <div className="flex items-center justify-between text-xs font-mono text-slate-400">
                      <span>Matches Found: <strong className="text-cyan-400">{matchesFound} / {MEMORY_CARDS.length}</strong></span>
                      <button onClick={resetMemoryGame} className="text-xs text-slate-400 hover:text-white">
                        Reset Board 🔄
                      </button>
                    </div>

                    <div className="grid grid-cols-4 gap-3 max-w-md mx-auto">
                      {cards.map((card, idx) => (
                        <div
                          key={card.id}
                          onClick={() => handleCardClick(idx)}
                          className={`h-16 sm:h-20 rounded-xl cursor-pointer border flex items-center justify-center text-2xl transition-all duration-300 ${card.flipped || card.matched
                              ? 'bg-gradient-to-tr from-cyan-500/20 to-purple-500/20 border-cyan-400 shadow-lg shadow-cyan-500/10 scale-105'
                              : 'bg-vortex-surface border-vortex-border hover:border-slate-500'
                            }`}
                        >
                          {card.flipped || card.matched ? card.symbol : '❓'}
                        </div>
                      ))}
                    </div>

                    {matchesFound === MEMORY_CARDS.length && (
                      <div className="p-4 rounded-xl bg-emerald-950/30 border border-emerald-500 text-center space-y-1">
                        <div className="text-sm font-bold text-emerald-400">🎉 Working Memory Recharged!</div>
                        <p className="text-xs text-slate-300">You've unlocked +100 Vortex XP for peak cognitive training.</p>
                      </div>
                    )}
                  </div>
                )}

                {/* GAME 2: PATIENCE & REACTION TRAINER */}
                {activeGame === 'reaction' && (
                  <div className="space-y-4 text-center animate-fadeIn">
                    <p className="text-xs text-slate-300">
                      Tests impulse control and reaction speed. Wait patiently for the screen to turn <strong className="text-emerald-400">GREEN</strong>, then click as fast as possible!
                    </p>

                    {reactionState === 'idle' && (
                      <div
                        onClick={startReactionGame}
                        className="h-44 rounded-2xl bg-vortex-surface border border-vortex-border hover:border-cyan-400 cursor-pointer flex flex-col items-center justify-center space-y-2"
                      >
                        <span className="text-4xl">🎯</span>
                        <div className="font-bold text-sm text-white">Click to Start Patience Test</div>
                        <span className="text-xs text-slate-400 font-mono">Screen will turn red, wait for green</span>
                      </div>
                    )}

                    {reactionState === 'waiting' && (
                      <div
                        onClick={handleReactionClick}
                        className="h-44 rounded-2xl bg-rose-950/60 border-2 border-rose-500 cursor-pointer flex flex-col items-center justify-center space-y-2 animate-pulse"
                      >
                        <span className="text-4xl">🛑</span>
                        <div className="font-bold text-base text-rose-300">PATIENCE... WAIT FOR GREEN!</div>
                        <span className="text-xs text-rose-200 font-mono">Do not click early!</span>
                      </div>
                    )}

                    {reactionState === 'ready' && (
                      <div
                        onClick={handleReactionClick}
                        className="h-44 rounded-2xl bg-emerald-500 cursor-pointer flex flex-col items-center justify-center space-y-2 shadow-2xl shadow-emerald-500/50"
                      >
                        <span className="text-4xl">⚡</span>
                        <div className="font-extrabold text-xl text-black">CLICK NOW!</div>
                      </div>
                    )}

                    {reactionState === 'result' && (
                      <div className="h-44 rounded-2xl bg-vortex-surface border border-cyan-400 flex flex-col items-center justify-center space-y-3">
                        {reactionTime === 'TOO_EARLY' ? (
                          <>
                            <span className="text-3xl">⚠️</span>
                            <div className="font-bold text-sm text-rose-400">Impatience Penalty: You clicked too early!</div>
                            <button onClick={startReactionGame} className="px-4 py-1.5 rounded-lg bg-slate-800 text-xs text-white">
                              Try Again 🔄
                            </button>
                          </>
                        ) : (
                          <>
                            <span className="text-3xl">🏆</span>
                            <div className="font-display font-extrabold text-2xl text-cyan-300">{reactionTime} ms</div>
                            <div className="text-xs text-slate-300 font-mono">
                              {reactionTime < 250 ? "Quick Reflexes!" : "Great Focus & Patience!"}
                            </div>
                            <button onClick={startReactionGame} className="px-4 py-1.5 rounded-lg bg-cyan-500 text-black text-xs font-bold">
                              Test Again 🔄
                            </button>
                          </>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render Root Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
